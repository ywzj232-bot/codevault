<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src 'none'：页面不能发出任何网络请求。'self' 只允许从程序自己所在的网址加载图标、清单和离线缓存脚本（双击本地文件打开时这些都不会用到） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: 'self'; media-src blob: mediastream:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="验证码保险箱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>验证码保险箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f5fe3'/%3E%3Cpath d='M32 12l16 6v12c0 11-7 19-16 22-9-3-16-11-16-22V18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M25 32l5 5 9-10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eceef2;
  --border:#e1e4ea; --border-strong:#cdd2da;
  --text:#16181d; --text-2:#4a5260; --text-3:#858d9a;
  --accent:#2f5fe3; --accent-hover:#2550c9; --accent-soft:#e7edfd; --accent-text:#ffffff;
  --ok:#11804c; --ok-soft:#e2f4ea; --warn:#a85400; --warn-soft:#fcefdc; --danger:#c42f28; --danger-soft:#fbe8e7;
  --toast-bg:#1b1e24; --toast-text:#f2f3f5; --toast-action:#9db4ff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 16px 48px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.08);
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#16191f; --surface-2:#1b1f26; --surface-3:#242933;
    --border:#2a2f39; --border-strong:#3a414e;
    --text:#e9ebef; --text-2:#b3b9c4; --text-3:#7c8492;
    --accent:#7393ff; --accent-hover:#8ba6ff; --accent-soft:#1d2747; --accent-text:#0a0f1f;
    --ok:#40cc8b; --ok-soft:#11281d; --warn:#f0a646; --warn-soft:#2d2113; --danger:#ff6f66; --danger-soft:#341816;
    --toast-bg:#eceef2; --toast-text:#16181d; --toast-action:#2f5fe3;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#16191f; --surface-2:#1b1f26; --surface-3:#242933;
  --border:#2a2f39; --border-strong:#3a414e;
  --text:#e9ebef; --text-2:#b3b9c4; --text-3:#7c8492;
  --accent:#7393ff; --accent-hover:#8ba6ff; --accent-soft:#1d2747; --accent-text:#0a0f1f;
  --ok:#40cc8b; --ok-soft:#11281d; --warn:#f0a646; --warn-soft:#2d2113; --danger:#ff6f66; --danger-soft:#341816;
  --toast-bg:#eceef2; --toast-text:#16181d; --toast-action:#2f5fe3;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.3}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--text-3)}
.hint{font-size:12.5px;color:var(--text-3);margin:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.xs{width:13px;height:13px}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:28px;height:28px}
svg.i.fill{fill:currentColor}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:550;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;height:42px;font-size:14.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text-2);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:550;cursor:pointer}
.linkish:hover{text-decoration:underline}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:13px;font-weight:600;color:var(--text-2)}
.label .opt{font-weight:400;color:var(--text-3)}
.input,.textarea,.select{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.input.bad,.textarea.bad,.input.bad:focus,.textarea.bad:focus{border-color:var(--danger)}
.textarea{resize:vertical;min-height:96px;line-height:1.6;display:block}
.select{appearance:auto;padding-right:8px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:4px 0 0}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:42px}
.pw-wrap .icon-btn{position:absolute;right:4px;top:4px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.meter .bar{flex:1;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .2s,background .2s}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text-2);cursor:pointer;margin:4px 0 14px}
.check input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:var(--border-strong);transition:background .15s}
.switch .slider::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::after{transform:translateX(18px)}
.switch input:focus-visible+.slider{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- gate (welcome / lock) ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;background:radial-gradient(1000px 520px at 50% -8%,var(--accent-soft),transparent 62%),var(--bg)}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:32px 30px 26px}
.gate-logo{width:58px;height:58px;border-radius:17px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.gate h1{font-size:22px;text-align:center;margin:0 0 6px}
.gate .sub{color:var(--text-2);text-align:center;margin:0 0 24px;text-wrap:balance}
.gate .stack{display:flex;flex-direction:column;gap:10px}
.gate .file-pill{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:10px 0 18px;word-break:break-all}
.gate .reason{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:0 0 16px;text-align:left}
.gate .reason.info{color:var(--accent);background:var(--accent-soft)}
.gate .links{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:18px;font-size:13px}
.gate .hint-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-2);margin:2px 0 12px;word-break:break-word}
.gate .back{margin:-12px 0 8px -10px}
.gate-foot{margin-top:20px;font-size:12px;color:var(--text-3);text-align:center;display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center}
.gate-foot span{display:inline-flex;align-items:center;gap:5px}
.gate-note{font-size:12.5px;color:var(--text-3);text-align:center;margin:16px 0 0;text-wrap:balance}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.brand-mark svg.i{width:17px;height:17px}
.search{flex:1;max-width:520px;position:relative;min-width:0}
.search input{width:100%;height:36px;padding:0 12px 0 36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search>svg.i{position:absolute;left:11px;top:9px;color:var(--text-3);pointer-events:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.save-status{font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:5px;margin-right:8px;white-space:nowrap}
.save-status.error{color:var(--danger);font-weight:600}
.save-status.warn{color:var(--warn);font-weight:600}
.save-status .spin{width:12px;height:12px;border-width:1.5px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--danger-soft);color:var(--danger);border-bottom:1px solid color-mix(in srgb,var(--danger) 25%,transparent);font-size:13.5px;flex-wrap:wrap}
.banner .msg{flex:1;min-width:200px;display:flex;gap:8px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-bottom-color:color-mix(in srgb,var(--warn) 25%,transparent)}
#lock-veil{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;overflow:hidden;display:none;place-items:center;cursor:progress}
#lock-veil:popover-open{display:grid;animation:veil-in .2s .15s both}
@keyframes veil-in{from{background:transparent}to{background:color-mix(in srgb,var(--bg) 72%,transparent)}}
#lock-veil .veil-box{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow-lg);font-weight:600;animation:veil-box-in .2s .15s both}
@keyframes veil-box-in{from{opacity:0;transform:translateY(4px)}}
.main{display:grid;grid-template-columns:340px 1fr;min-height:0}
.list-pane{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 8px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
.list-tools{display:flex;justify-content:space-between;align-items:center;padding:2px 12px 6px 16px;color:var(--text-3);font-size:12px}
.list-tools select{border:0;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;padding:2px}
.entry-list{list-style:none;margin:0;padding:2px 8px 16px;overflow:auto;flex:1}
.entry-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:none;color:inherit;margin-bottom:2px}
.entry-item:hover{background:var(--surface-2)}
.entry-item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.entry-main{min-width:0;flex:1}
.entry-title{display:flex;align-items:center;gap:6px;font-weight:600}
.entry-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-title .star{color:#e8a200}
.entry-sub{color:var(--text-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.list-empty{padding:32px 16px;text-align:center;color:var(--text-3);font-size:13px}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:650;color:#fff;flex:none;font-size:16px;user-select:none}
.avatar.lg{width:56px;height:56px;border-radius:16px;font-size:24px}
.avatar.sm{width:28px;height:28px;border-radius:8px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:550;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge .mono{letter-spacing:.04em}

/* ---------- detail ---------- */
.detail-pane{overflow:auto;min-height:0}
.detail{max-width:880px;margin:0 auto;padding:26px 28px 56px}
.d-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.d-main{min-width:0;flex:1}
.d-title{font-size:22px;font-weight:700;margin:2px 0 0;word-break:break-word}
.d-meta{color:var(--text-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13.5px}
.d-meta .linkish{color:var(--text-2);font-weight:400;word-break:break-all;text-align:left}
.d-meta .linkish:hover{color:var(--accent)}
.d-actions{display:flex;gap:2px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.back-btn{display:none !important}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;margin:0;font-weight:650;display:flex;align-items:center;gap:8px}
.card-h h3 svg.i{color:var(--text-3)}
.card-h .spacer{flex:1}
.progress{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .25s}
.progress.warn i{background:var(--warn)}
.progress.danger i{background:var(--danger)}
.callout{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;margin:0 0 14px}
.callout svg.i{margin-top:1px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.danger{background:var(--danger-soft);color:var(--danger)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;margin-bottom:12px}
.code{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);transition:background .15s,border-color .15s}
.code:hover{border-color:var(--border-strong)}
.code .idx{font-size:11px;color:var(--text-3);min-width:16px;text-align:right;font-variant-numeric:tabular-nums}
.code .val{flex:1;font-family:var(--mono);font-size:15px;letter-spacing:.03em;background:none;border:0;text-align:left;padding:3px 2px;cursor:copy;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px}
.code .val:hover{color:var(--accent)}
.code.used{background:transparent;border-style:dashed}
.code.used .val{text-decoration:line-through;color:var(--text-3)}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg.i{width:15px;height:15px;stroke-width:2.6}
.totp{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.totp-code{font-family:var(--mono);font-size:36px;font-weight:650;letter-spacing:.06em;background:none;border:0;padding:0 4px;cursor:copy;color:var(--text);border-radius:8px;font-variant-numeric:tabular-nums}
.totp-code:hover{color:var(--accent)}
.totp-code.bad{font-size:16px;color:var(--danger);font-family:var(--font);letter-spacing:0}
.ring{width:42px;height:42px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg);width:42px;height:42px}
.ring circle{fill:none;stroke-width:4}
.ring .track{stroke:var(--surface-3)}
.ring .bar{stroke:var(--accent);stroke-linecap:round}
.ring.expiring .bar{stroke:var(--warn)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--text-2)}
.kv{display:flex;flex-direction:column;gap:8px}
.kv-row{display:flex;align-items:center;gap:12px;padding:9px 8px 9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.kv-label{font-size:12.5px;color:var(--text-2);font-weight:600;width:170px;flex:none;word-break:break-word}
.kv-val{flex:1;font-family:var(--mono);word-break:break-all;white-space:pre-wrap;min-width:0}
.kv-val.masked{color:var(--text-3);letter-spacing:.1em}
.note{white-space:pre-wrap;word-break:break-word;margin:0}

function toast(msg, opts = {}) {
  const box = $('#toasts');
  const t = h('div', { class: 'toast' + (opts.type ? ' ' + opts.type : ''), role: opts.type === 'error' ? 'alert' : 'status' },
    opts.quiet ? null : icon(opts.type === 'error' ? 'alert' : 'check', 'sm'),
    h('span', null, msg));
  let timer = 0;
  const dismiss = () => {
    clearTimeout(timer);
    if (!t.isConnected) return;
    t.classList.add('out');
    setTimeout(() => { t.remove(); if (!box.children.length) { try { box.hidePopover(); } catch {} } }, 180);
  };
  if (opts.action) t.append(h('button', { onclick: () => { dismiss(); opts.action.run(); } }, opts.action.label));
  box.append(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  try { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } catch {}
  timer = setTimeout(dismiss, opts.duration || (opts.action ? 6000 : 2600));
  return dismiss;
}

function openDialog({ title, body, footer, size = '', onClose, onCancel, dismissable = true, form = false, onSubmit }) {
  const dlg = h('dialog', { class: size, 'aria-label': title });

  let finalized = false;
  const finalize = () => { if (finalized) return; finalized = true; dlg.remove(); onClose && onClose(); };
  const close = () => { if (dlg.open) dlg.close(); finalize(); };
  dlg._close = close;
  // 忙碌（例如正在写入文件）时禁止用户关闭：关闭按钮变灰、Esc 无效；程序自己的 close() 不受影响
  let busyFlag = false;
  const xBtn = dismissable ? h('button', { type: 'button', class: 'icon-btn sm', title: '关闭', onclick: () => { if (!busyFlag) (onCancel ? onCancel(close) : close()); } }, icon('x')) : null;
  const setBusy = on => { busyFlag = !!on; if (xBtn) xBtn.disabled = busyFlag; dlg.toggleAttribute('aria-busy', busyFlag); };
  const inner = h(form ? 'form' : 'div', { class: 'dlg', novalidate: form ? true : null },
    h('div', { class: 'dlg-h' }, h('h2', null, title), xBtn),
    h('div', { class: 'dlg-b' }, body),
    footer ? h('div', { class: 'dlg-f' }, footer) : null);
  if (form) inner.addEventListener('submit', e => { e.preventDefault(); onSubmit && onSubmit(close); });
  dlg.append(inner);
  dlg.addEventListener('cancel', e => {
    e.preventDefault();
    if (!dismissable || busyFlag || S.locking) return;
    if (onCancel) onCancel(close); else close();
  });
  dlg.addEventListener('close', finalize);
  document.body.append(dlg);
  inner.tabIndex = -1;
  dlg.showModal();
  // 默认不把焦点放在右上角的关闭按钮上（避免出现焦点框）；需要时各对话框会自行聚焦输入框

/* ---------------- 密码输入组件 ---------------- */
function pwField(props = {}) {
  const input = h('input', { class: 'input', type: 'password', spellcheck: 'false', autocapitalize: 'off', ...props });
  const btn = h('button', { type: 'button', class: 'icon-btn sm', title: '显示密码', 'aria-label': '显示密码' }, icon('eyeOff'));
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.replaceChildren(icon(show ? 'eye' : 'eyeOff'));
    btn.title = show ? '隐藏密码' : '显示密码';
    input.focus();
  });
  return { input, el: h('div', { class: 'pw-wrap' }, input, btn) };
}
function pwScore(p) {
  if (!p) return 0;
  let pool = 0;
  if (/[a-z]/.test(p)) pool += 26;
  if (/[A-Z]/.test(p)) pool += 26;
  if (/\d/.test(p)) pool += 10;
  if (/[^\w\u0080-￿]/.test(p)) pool += 33;
  if (/[^\x00-\x7f]/.test(p)) pool += 2000;
  const chars = Array.from(p);
  let bits = chars.length * Math.log2(Math.max(pool, 2));
  if (new Set(chars).size <= 2) bits = Math.min(bits, 10);
  if (/^(?:12345|password|qwerty|11111|abc123|admin|iloveyou|woaini|00000|88888)/i.test(p)) bits = Math.min(bits, 20);
  return bits < 36 ? 1 : bits < 56 ? 2 : bits < 76 ? 3 : 4;
}
function strengthMeter(input) {
  const bar = h('i');
  const txt = h('span', null, '');
  const el = h('div', { class: 'meter' }, h('div', { class: 'bar' }, bar), txt);
  const LABELS = ['', '弱', '一般', '较强', '很强'];
  const COLORS = ['', 'var(--danger)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
  const upd = () => {
    const s = pwScore(input.value);
    bar.style.width = s * 25 + '%';
    bar.style.background = COLORS[s];
    txt.textContent = s ? '强度：' + LABELS[s] : '';
  };
  input.addEventListener('input', upd);
  upd();
  return el;
}

function renderCreate() {
  const pw1 = pwField({ autocomplete: 'new-password', placeholder: '至少 8 位，建议用一句话' });

    if (p !== pw2.input.value) { err.textContent = '两次输入的主密码不一致'; pw2.input.focus(); return; }

    if (hv && hv.includes(p)) { err.textContent = '密码提示里不能包含主密码'; hint.focus(); return; }

async function pickTextFile() {
  if (HAS_FSA) {

      const [handle] = await window.showOpenFilePicker({ types: VAULT_TYPES, multiple: false, id: 'codevault-backup' });
      return await (await handle.getFile()).text();
    } catch (e) { if (e.name !== 'AbortError') toast('无法打开文件：' + e.message, { type: 'error' }); return null; }
  }
  return new Promise(resolve => {

// 从备份恢复到浏览器存储：先用密码把备份完整解开、校验通过，才会替换现有数据
async function restoreLocalFromBackup() {
  const text = await pickTextFile();
  if (text == null) return;
  let file;
  try { file = parseFile(text); await checkIntegrity(file); }
  catch (e) { toast(e.message + `。${LOCAL_WHERE}里现有的数据没有改动。`, { type: 'error', duration: 7000 }); return; }
  let res = null;
  while (!res) {
    const pw = await promptPassword({
      title: '验证备份文件',
      message: '请输入这个备份的主密码。只有完整解开、校验通过后才会恢复，在此之前' + LOCAL_WHERE + '里现有的数据不会被改动。' + (file.hint ? `\n密码提示：${str(file.hint)}` : ''),
      okText: '验证',
    });
    if (pw == null) return;
    try { res = await unseal(text, pw); }
    catch (e) {
      if (e.code === 'BAD_PASSWORD') { toast(e.message + '，请重试', { type: 'error', duration: 5000 }); continue; }
      toast(e.message + `。${LOCAL_WHERE}里现有的数据没有改动。`, { type: 'error', duration: 7000 });
      return;
    }
  }
  const n = res.vault.entries.length;
  if (hasLocalVault()) {
    const ok = await confirmDialog({ title: `用备份替换${LOCAL_WHERE}里的数据？`, message: `备份验证通过，里面有 ${n} 个条目。\n${LOCAL_WHERE}里现有的保险箱将被它替换，且无法撤销。`, ok: '替换', danger: true });
    if (!ok) return;
  }
  const store = localStore();
  try { await store.write(text); }
  catch (e) { toast('恢复失败：' + e.message, { type: 'error', duration: 6000 }); return; }
  askPersist();
  await clearStash(store);
  await enterVault(store, res);
  toast(`已从备份恢复 ${n} 个条目`);
}

async function resetLocal() {
  const ok = await confirmDialog({ title: `删除${LOCAL_WHERE}中的保险箱？`, message: `这会永久删除保存在${THIS_LOCAL}中的全部加密数据，无法恢复。\n如果你有备份文件，之后可以从备份恢复。`, ok: '永久删除', danger: true });
  if (!ok) return;
  try { localStorage.removeItem(LS_VAULT); } catch {}
  await clearStash(localStore());
  const hd = await rememberedHandle();
  if (hd) { S.store = fileStore(hd); renderLock(); } else renderWelcome();
}

/* ---------------- 锁定时的加密暂存 ---------------- */
// 锁定时若还有没写进去的修改，或编辑框里有没提交的内容，就用当前密钥加密后暂存在浏览器里，解锁后再询问是否恢复。
async function stashMatches(rec, store) {
  if (!rec || typeof rec.text !== 'string' || !store || rec.kind !== store.kind) return false;
  if (store.kind === 'local') return true;
  try { return !!rec.handle && typeof rec.handle.isSameEntry === 'function' && await rec.handle.isSameEntry(store.handle); } catch { return false; }
}
async function stashList() {
  try { const v = await idbGet(STASH_KEY); return Array.isArray(v) ? v : []; } catch { return null; }
}
async function writeStash({ vault, draft }) {
  const store = S.store;
  const at = Date.now();
  const text = await seal({ kind: 'stash', at, vault: vault || null, draft: draft || null }, S.key, S.header);
  const rec = { text, at, kind: store.kind, name: store.name, handle: store.kind === 'file' ? store.handle : null };
  S.memStash = { ...rec, persisted: false };
  try {
    const list = await stashList();
    if (!list) throw new Error('无法读取浏览器存储');
    const keep = [];
    for (const r of list) if (!(await stashMatches(r, store))) keep.push(r);
    keep.push(rec);
    await idbSet(STASH_KEY, keep.slice(-5));
    S.memStash.persisted = true;
  } catch (e) { console.warn('暂存没能写入浏览器存储，只保留在本页内存中', e); }
  return S.memStash;
}
async function findStash(store) {
  if (await stashMatches(S.memStash, store)) return S.memStash;
  for (const r of (await stashList()) || []) if (await stashMatches(r, store)) return r;
  return null;
}
async function clearStash(store) {
  if (await stashMatches(S.memStash, store)) S.memStash = null;
  try {
    const list = await stashList();
    if (!list || !list.length) return;
    const keep = [];
    for (const r of list) if (!(await stashMatches(r, store))) keep.push(r);
    if (keep.length !== list.length) await idbSet(STASH_KEY, keep);
  } catch {}
}

async function enterVault(store, res, password, readOnly = false) {
  Object.assign(S, { store, key: res.key, header: res.header, vault: res.vault, ui: freshUI(), dirty: false, lastActivity: Date.now(), pendingStashClear: false, pendingStashStore: null, readOnly: !!readOnly });
  S.revealed.clear();
  if (store.kind === 'file') { try { await idbSet('handle', store.handle); } catch {} }
  setLastStore(store.kind);
  renderMain();
  if (S.readOnly) showReadOnlyBanner('只读打开');
  if (password != null) {
    try { await processStash(store, password, res); } catch (e) { console.error('处理暂存内容失败', e); }
  }
}

async function processStash(store, password, res) {
  const rec = await findStash(store);
  if (!rec || !S.key) return;
  let payload;
  try {
    const file = parseFile(rec.text);
    const key = file.kdf.salt === res.header.kdf.salt ? res.key : await deriveKey(password, b64d(file.kdf.salt), file.kdf.iterations);
    payload = await decryptRaw(file, key);
  } catch {
    if (!S.key || S.locking) return;
    const drop = await confirmDialog({ title: '有一份暂存内容打不开', message: `${fmtDate(rec.at, true)} 锁定时暂存了没保存的内容，但用现在的主密码解不开（可能主密码在别处改过）。\n先保留的话，以后用当时的主密码解锁时会再次询问。`, ok: '丢弃它', cancel: '先保留', danger: true });
    if (drop && S.key && !S.locking) await clearStash(store);
    return;
  }
  if (!S.key || S.locking) return;
  const sv = payload && payload.vault ? normalizeVault(payload.vault) : null;
  const draft = payload && payload.draft && typeof payload.draft === 'object' ? payload.draft : null;
  let restoring = false;
  if (sv && JSON.stringify(sv) !== JSON.stringify(S.vault)) {
    const where = store.kind === 'file' ? '保险箱文件' : IS_TOUCH ? '本机存储' : '浏览器存储';
    const ok = await confirmDialog({
      title: '恢复锁定前没保存的修改？',
      message: `${fmtDate(rec.at, true)} 锁定时，有修改没能写入${where}，已经加密暂存在${THIS_LOCAL}里。\n\n· 恢复修改：用暂存的内容替换现在的内容，并重新保存（${where}里在那之后的改动会被覆盖）\n· 丢弃：保留${where}里现在的内容`
        + (S.readOnly ? '\n\n当前是只读打开：恢复后可以查看，要保存下来请「另存为」新文件或允许写入。' : ''),
      ok: '恢复修改', cancel: '丢弃', dismissable: false,
    });
    if (!S.key || S.locking) return;  // 等待回答时又被锁定了：暂存原样保留
    if (ok) {
      S.vault = sv; S.ui = freshUI(); S.pendingStashClear = true; S.pendingStashStore = store; restoring = true;
      renderMain(); markDirty();
      if (S.readOnly) showReadOnlyBanner('已恢复暂存的修改（只读打开）');
      toast(S.readOnly ? '已恢复锁定前的修改；只读打开，需要另存为才能保存' : '已恢复锁定前的修改，正在保存');
    }
  }
  if (draft && draft.kind === 'replace-codes') {
    const dest = findEntry(draft.entryId);
    if (dest && entryIdentity(dest) === entryIdentity(draft) && Array.isArray(draft.baseCodes)) {
      replaceCodes(dest, null, null, { draft: str(draft.codes), base: draft.baseCodes, review: draft.codeReview });
    } else {
      openEditor(null, { service: str(draft.service), account: str(draft.account), codes: str(draft.codes), codeReview: draft.codeReview });
      toast('原换码目标已变，草稿按新条目打开，不会覆盖已有账号。');
    }
  } else if (draft) openEditor(draft.entryId ? findEntry(draft.entryId) : null, draft);
  if (!restoring) await clearStash(store);  // 恢复了修改的话，等保存成功后再删
}

function renderLock(opts = {}) {
  const store = S.store;
  if (!store) { renderWelcome(); return; }
  const isFile = store.kind === 'file';
  const pw = pwField({ autocomplete: 'current-password', placeholder: '输入主密码' });
  const err = h('p', { class: 'err', role: 'alert' });
  const hintBox = h('div');
  const notice = h('div');
  const submit = h('button', { type: 'submit', class: 'btn primary block' }, icon('unlock'), '解锁');
  const showHint = async () => {
    try {
      let hint = opts.hint;
      if (hint === undefined) {
        if (!(await store.permit('read'))) return;
        hint = str(parseFile(await store.read()).hint);
      }
      hintBox.replaceChildren(h('div', { class: 'hint-box' }, hint ? ['密码提示：', h('b', null, hint)] : '创建时没有设置密码提示。'));
    } catch (e) { toast(e.message, { type: 'error' }); }
  };
  const form = h('form', { novalidate: true }, h('div', { class: 'field' }, pw.el), hintBox, submit, err);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.textContent = '';
    const p = pw.input.value;
    if (!p) { pw.input.focus(); return; }
    busy(submit, true, '正在解锁…');
    links.inert = true;  // 解锁进行中不能切走
    try {
      // 优先读写；拿不到写权限但能读，就以只读方式打开（可以查看、恢复暂存、另存为，绝不写回原文件）
      let readOnly = false;
      let canWrite = false;
      try { canWrite = await store.permit('readwrite'); } catch { canWrite = false; }
      if (!canWrite) {
        let canRead = false;
        if (store.kind === 'file') { try { canRead = await store.permit('read'); } catch { canRead = false; } }
        if (!canRead) throw new Error('需要允许读取保险箱文件才能解锁');
        readOnly = true;
      }
      const text = await store.read();
      if (!text) throw new Error('找不到保险箱数据');
      const res = await unseal(text, p);
      if (store.kind === 'file') store.acceptRead(text);
      await enterVault(store, res, p, readOnly);
    } catch (e) {
      if (S.key) { console.error(e); return; }
      links.inert = false;
      busy(submit, false);
      submit.replaceChildren(icon('unlock'), '解锁');
      if (e.name === 'NotFoundError') err.textContent = '找不到保险箱文件，它可能被移动、改名或删除了。请点击下方「打开其他文件」重新选择。';
      else err.textContent = e.message || String(e);
      pw.input.select();
      const c = $('.gate-card');
      if (c && e.code === 'BAD_PASSWORD') { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
    }
  });
  const links = h('div', { class: 'links' }, gateLink('忘记密码？查看提示', showHint));
  if (HAS_FSA) links.append(gateLink('打开其他文件', openExistingFile));
  if (isFile && hasLocalVault()) links.append(gateLink(`打开${LOCAL_WHERE}里的保险箱`, () => { S.store = localStore(); renderLock(); }));
  links.append(gateLink('新建保险箱', () => renderCreate()));
  if (!isFile) { links.append(gateLink('从备份恢复', restoreLocalFromBackup)); links.append(gateLink('删除并重新开始', resetLocal, true)); }
  if (opts.stashed) notice.append(h('div', { class: 'reason info' }, icon('info', 'sm'), opts.stashed.persisted ? '有没保存的内容已加密暂存，解锁后可以恢复' : '有没保存的内容已加密暂存在本页，解锁前请不要关闭页面'));
  else if (opts.stashFailed) notice.append(h('div', { class: 'reason' }, icon('alert', 'sm'), '锁定时有没保存的内容，但没能暂存下来'));
  gate(
    h('h1', null, opts.picked ? '打开保险箱' : '保险箱已锁定'),
    h('div', { class: 'file-pill', title: isFile ? '数据文件' : '' }, icon(isFile ? 'file' : 'hardDrive', 'sm'), isFile ? store.name : `保存在此${LOCAL_WHERE}中`),
    opts.reason ? h('div', { class: 'reason' }, icon('clock', 'sm'), opts.reason) : null,
    notice,
    form,
    links,
    isFile ? h('p', { class: 'gate-note' }, '首次解锁时，浏览器会询问是否允许编辑这个文件，请选择「允许」或「编辑文件」。不允许的话会以只读方式打开。') : null);
  // 异步补充：在浏览器存储的锁屏上提供「打开上次的文件」，以及提示是否有暂存内容
  (async () => {
    if (!isFile) {
      const hd = await rememberedHandle();
      if (hd && S.store === store && !S.key) links.insertBefore(gateLink(`打开文件「${hd.name}」`, () => { S.store = fileStore(hd); renderLock(); }), links.children[2] || null);
    }
    if (!opts.stashed && !opts.stashFailed) {
      const rec = await findStash(store);
      if (rec && S.store === store && !S.key && !notice.childElementCount) notice.append(h('div', { class: 'reason info' }, icon('info', 'sm'), `${fmtDate(rec.at, true)} 锁定时有没保存的内容已加密暂存，解锁后可以恢复`));
    }
  })();
}

// 锁定时先把整个界面冻结（主界面、对话框、提示条都不能再操作），并盖上「正在锁定」的遮罩
function lockVeil() {
  let v = $('#lock-veil');
  if (!v) {
    v = h('div', { id: 'lock-veil', popover: 'manual', role: 'status', 'aria-live': 'assertive' },
      h('div', { class: 'veil-box' }, h('span', { class: 'spin' }), '正在锁定…'));
    document.body.append(v);
  }
  return v;
}
function freezeUI(on) {
  for (const el of [$('#app'), $('#toasts'), ...$$('dialog')]) if (el) el.inert = !!on;
  const v = lockVeil();
  try {
    if (on) { if (v.matches(':popover-open')) v.hidePopover(); v.showPopover(); }
    else if (v.matches(':popover-open')) v.hidePopover();
  } catch {}
}
function clearToasts() { const box = $('#toasts'); clear(box); try { box.hidePopover(); } catch {} }

// 锁定一定会成功：点下去的同时冻结界面；能保存就先保存；保存不了的修改和编辑中的草稿先加密暂存，再锁上
async function lock(reason) {
  if (!S.key || S.locking) return;
  S.locking = true;
  freezeUI(true);
  try {
    clearTimeout(S.saveTimer);
    const draft = S.editor && S.editor.changed() ? S.editor.capture() : null;
    let saved = !S.dirty && !S.saving;
    if (!saved) saved = await Promise.race([flushSave(), sleep(4000).then(() => false)]);
    if (S.dirty) saved = false;  // 保存期间如果还有新改动（界面已冻结，正常不会发生），一并暂存，绝不悄悄丢掉
    let stashed = null, stashFailed = false;
    if (!saved || draft) {
      try { stashed = await writeStash({ vault: saved ? null : S.vault, draft }); }
      catch (e) { stashFailed = true; console.error('暂存失败', e); }
    }
    if (clipPending || clipTimer) { clearTimeout(clipTimer); if (document.hasFocus()) { try { await navigator.clipboard.writeText(''); } catch {} } clipPending = false; clipTimer = 0; }
    stopTotp();
    S.key = null; S.vault = null; S.header = null; S.ui = null; S.lastDeleted = null;
    S.dirty = false; S.editor = null; S.pendingStashClear = false; S.pendingStashStore = null; S.readOnly = false;
    S.revealed.clear(); hmacCache.clear(); totpCache.clear();
    closeDialogs();
    clearToasts();
    renderLock({ reason, stashed, stashFailed });
  } finally {
    S.locking = false;
    freezeUI(false);
  }
}

function renderFilters() {

function visibleEntries() {
  const q = S.ui.q.trim().toLowerCase();
  const f = S.ui.filter;
  const list = S.vault.entries.filter(e => {
    if (f === 'fav' && !e.favorite) return false;
    if (f === 'low' && !isLow(e)) return false;
    if (f === 'totp' && !e.totp) return false;
    if (f.startsWith('g:') && e.group !== f.slice(2)) return false;
    if (!q) return true;
    return [e.service, e.account, e.group, e.note, ...e.fields.map(x => x.label)].some(s => s && s.toLowerCase().includes(q));
  });
  const remKey = e => (e.codes.length ? codeStats(e).left : Infinity);
  list.sort((a, b) => (b.favorite - a.favorite)
    || (S.ui.sort === 'updated' ? b.updatedAt - a.updatedAt : 0)
    || (S.ui.sort === 'remaining' ? (remKey(a) - remKey(b)) || 0 : 0)
    || zhCompare(a.service, b.service) || zhCompare(a.account, b.account));

const CIRC = 2 * Math.PI * 17;

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', '21'); c.setAttribute('cy', '21'); c.setAttribute('r', '17'); c.setAttribute('class', cls);
    if (cls === 'bar') { c.setAttribute('stroke-dasharray', String(CIRC)); }
    svg.append(c);

  return h('div', { class: 'ring', 'data-ring': id, title: '剩余秒数' }, svg, h('span'));
}

let totpTimer = 0;
function startTotp() { stopTotp(); totpTimer = setInterval(refreshTotp, 1000); refreshTotp(); }
function stopTotp() { clearInterval(totpTimer); totpTimer = 0; }
// 每个条目这一轮（30 秒内）的动态码；锁定时清空
const totpCache = new Map();
const totpSlot = (e, now = Date.now()) => e.totp.algorithm + '|' + e.totp.digits + '|' + e.totp.secret + '|' + Math.floor(now / 1000 / e.totp.period);
function cachedTotp(e) { const c = totpCache.get(e.id); return c && c.slot === totpSlot(e) ? c.code : null; }
async function currentTotp(e, now = Date.now()) {
  const slot = totpSlot(e, now), c = totpCache.get(e.id);
  if (c && c.slot === slot) return c.code;
  const code = await totpAt(e.totp, now);
  totpCache.set(e.id, { slot, code });
  return code;
}
async function refreshTotp() {
  if (!S.vault) return;
  const now = Date.now();
  for (const el of $$('[data-totp]')) {
    const e = findEntry(el.dataset.totp);
    if (!e || !e.totp) continue;
    const masked = el.dataset.mask === '1';
    const k = totpSlot(e, now) + (masked ? 'm' : '');
    if (el.dataset.k === k) continue;
    el.dataset.k = k;
    let code;
    try { code = await currentTotp(e, now); el.classList.remove('bad'); }
    catch { el.textContent = '密钥无效'; el.classList.add('bad'); continue; }
    el.textContent = masked ? fmtTotp('•'.repeat(e.totp.digits)) : fmtTotp(code);
  }
  for (const el of $$('[data-ring]')) {
    const e = findEntry(el.dataset.ring);
    if (!e || !e.totp) continue;
    const p = e.totp.period;
    const left = p - (Math.floor(now / 1000) % p);
    el.lastChild.textContent = left;
    el.querySelector('.bar').style.strokeDashoffset = String(CIRC * (1 - left / p));
    el.classList.toggle('expiring', left <= 5);
  }
}

function deleteEntry(e) {
  confirmDialog({ title: '删除「' + e.service + '」？', message: '这个条目里的备用码、密钥和备注都会被删除。删除后短时间内可以撤销。', ok: '删除', danger: true }).then(ok => {
    if (!ok) return;
    const idx = S.vault.entries.indexOf(e);
    if (idx < 0) return;
    S.vault.entries.splice(idx, 1);
    S.vault.deleted[e.id] = Math.max(Date.now(), e.updatedAt);  // 同步时把删除也带到另一台设备
    S.lastDeleted = { entry: e, idx };
    if (S.ui.sel === e.id) S.ui.sel = null;
    markDirty();
    renderAll();
    toast('已删除「' + e.service + '」', { duration: 8000, action: { label: '撤销', run: () => {
      if (!S.vault || !S.lastDeleted || S.lastDeleted.entry !== e) return;
      if (findEntry(e.id)) { S.lastDeleted = null; toast('这个条目已经在了（可能刚同步回来）'); return; }
      S.vault.entries.splice(Math.min(S.lastDeleted.idx, S.vault.entries.length), 0, e);
      delete S.vault.deleted[e.id];
      S.lastDeleted = null; S.ui.sel = e.id; markDirty(); renderAll(); toast('已恢复');
    } } });
  });
}

  };

    const q = filtered ? input.value.trim().toLowerCase() : '';
    items = [...new Set(getOptions())].filter(o => o && (!q || o.toLowerCase().includes(q)));
    if (!items.length) { close(); return; }
    if (activeCombo && activeCombo !== api) activeCombo.close();
    activeCombo = api;
    active = -1;

    input.setAttribute('aria-expanded', 'true');

  };
  const close = () => {
    if (activeCombo === api) activeCombo = null;

  };
  const pick = v => {
    input.value = v;

    close(); input.focus();
  };
  btn.addEventListener('mousedown', e => { e.preventDefault(); if (!list.hidden) close(); else { input.focus(); open(false); } });
  input.addEventListener('input', () => { if (!picking && document.activeElement === input) open(true); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.hidden) { open(false); return; }
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      render();
    } else if (e.key === 'Enter' && !list.hidden && active >= 0) { e.preventDefault(); pick(items[active]); }
    else if (e.key === 'Escape' && !list.hidden) { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'Tab') close();
  });
  input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== input) close(); }, 120));
  return wrap;
}

const EMAIL_RE = /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g;
function guessMeta(text, fileName = '') {
  const t = String(text || '');
  const addresses = [...new Map((t.match(EMAIL_RE) || []).map(a => [a.toLowerCase(), a])).values()];
  const account = addresses.length === 1 ? addresses[0] : '';
  const pick = s => {
    let best = null, at = Infinity;
    for (const [re, service, group] of SERVICE_RULES) {
      const m = re.exec(s);
      if (m && m.index < at) { best = { service, group }; at = m.index; }
    }
    return best;
  };
  // 先看文件名，再看正文（去掉邮箱，免得把账号的邮箱域名当成网站），最后才按邮箱域名猜
  const hit = pick(String(fileName).replace(/\.[^.]+$/, '')) || pick(t.replace(EMAIL_RE, ' ')) || (account ? pick(account.split('@')[1]) : null);
  return { service: hit ? hit.service : '', group: hit ? hit.group : '', account, multipleAccounts: addresses.length > 1 };
}

function decodeText(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }  // 也会去掉 UTF-8 的 BOM
  catch { try { return new TextDecoder('gb18030').decode(b); } catch { return new TextDecoder('utf-8').decode(b); } }  // 中文网站常用的 GBK 编码
}

}

async function quickCapture(text, sourceLabel, fileName = '') {
  if (!S.key || S.locking) return;
  const session = S.key, raw = String(text || '');
  const uri = (raw.match(/otpauth:\/\/[^\s"'<>]+/i) || [])[0] || '';
  const report = inspectCodeText(raw), codes = report.codes;
  if (!codes.length && !report.excluded.length && !uri) { toast('没有可识别的内容'); return; }
  const guess = guessMeta(raw, fileName);
  // 含 2FA 密钥时用完整编辑框；不能因某组码相同就丢掉另一种凭证。
  if (codes.length && !uri) {
    const site = accountKey(guess.service), acct = accountKey(guess.account);
    const bySite = site ? S.vault.entries.filter(e => accountKey(e.service) === site) : [];
    const exact = acct ? bySite.filter(e => accountKey(e.account) === acct) : [];
    const candidates = exact.length ? exact : (site
      ? bySite.filter(e => !acct || !accountKey(e.account))
      : S.vault.entries.filter(e => (!acct || accountKey(e.account) === acct) && sameCodeSet(codeValues(e), codes)));

        message: '已准确匹配账号「' + targetName(e) + '」。此条目现有 ' + e.codes.length + ' 个码。继续可核对新码，尚不会修改旧码。',

        ? '没有唯一匹配「' + guess.account + '」的旧条目；未填账号不能视为匹配。'

    let confirming = false, writing = false;
    const me = { changed: () => !!ta.value.trim() || codeReviews.has(ta), capture: () => ({
      kind: 'replace-codes', entryId: id, service: entry.service, account: entry.account, baseCodes: base, codes: ta.value, codeReview: codeReviews.get(ta),
    }) };
    const sink = { el: ta, accept: (t, name) => accept(t, '文件「' + name + '」') };
    S.editor = me; S.dropSink = sink;
    const { close } = openDialog({
      title: hadCodes ? '「' + entry.service + '」换一组新码' : '给「' + entry.service + '」添加备用码', form: true,
      body: [
        h('p', { class: 'confirm-msg' }, '目标：' + targetName(entry) + '\n' + (hadCodes
          ? '将替换现有 ' + st.total + ' 个码（' + st.left + ' 个未用）。整组换新会重置已用标记；只想追加请使用「编辑」。'
          : '把网站给的备用码放在下面，核对后再保存。')),
        h('div', { class: 'sec-h' }, h('h4', null, icon('grid', 'sm'), hadCodes ? '新的备用码' : '备用码'), count, h('span', { class: 'spacer' }), fileButton((t, name) => accept(t, '文件「' + name + '」'))),
        ta, warnEl, note, msg],
      footer: [h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消'), okBtn],
      onSubmit: async c => {
        if (confirming || writing || S.key !== session || S.locking) return;
        if (S.reloading || S.conflictOpen) { msg.textContent = '正在核对其他窗口的修改，请稍后再提交。'; return; }
        msg.textContent = '';
        let live = current();
        if (!live) { msg.textContent = '原条目已删除或账号已变，本次未替换。输入的新码仍在此处，请核对后另存。'; return; }
        const entered = ta.value, vals = parseCodeLines(entered);
        if (!vals.length || vals.some(v => clen(v) > LIMITS.code)) return;
        if (sameCodeSet(codeValues(live), vals)) { toast('和现在存的码完全一样，不用替换'); return; }
        if (!sameCodeSet(base, codeValues(live))) {
          const version = codeState(live);
          confirming = true;
          let decision;
          try {
            decision = await chooseDialog({ title: '旧码已在别处更换',
              message: '「' + targetName(live) + '」当前有 ' + live.codes.length + ' 个码，与打开此窗口时不同。本次还没有写入。取消可保留输入；只有明确确认才会覆盖最新的一组。',
              options: [['replace', '确认替换最新一组']] });
          } finally { confirming = false; }
          if (!decision || S.editor !== me || S.key !== session || S.locking || S.reloading || S.conflictOpen) return;
          live = current();
          if (!live || codeState(live) !== version || ta.value !== entered) {
            msg.textContent = '目标或内容在确认期间又发生变化，未写入；请重新核对。'; return;
          }
        }
        // reload 会更换 entry 对象。仅修改按 id 取回的当前对象，不动它的备注、分组等其他字段。
        const before = live.codes.map(c => ({ ...c }));
        live.codes = vals.map(v => ({ v, used: false, usedAt: 0 }));
        live.ver.codes = Date.now();
        const applied = codeState(live), destStore = S.store;
        writing = true; touch(live); S.ui.sel = id;
        c(); renderAll();
        let persisted = false;
        try {
          persisted = await flushSave();
          const now = current();
          if (!now || S.store !== destStore || codeState(now) !== applied) return;
          if (!persisted || S.readOnly || S.dirty) {
            toast('备用码在当前窗口已更新，但尚未写入文件或浏览器存储。请保留原始新码，按页面提示处理。', { type: 'error', duration: 6500 }); return;
          }
          toast(hadCodes ? '已换成 ' + vals.length + ' 个新码' : '已保存 ' + vals.length + ' 个备用码', { duration: 8000, action: { label: '撤销', run: async () => {
            const dest = current();
            if (!dest || S.reloading || S.conflictOpen || S.store !== destStore || codeState(dest) !== applied) { toast('备用码或使用状态已变化，未撤销，避免覆盖后来的修改。', { type: 'error' }); return; }
            dest.codes = before.map(c => ({ ...c })); const restored = codeState(dest);
            dest.ver.codes = Date.now(); touch(dest); renderAll();
            const ok = await flushSave(), latest = current();
            if (latest && codeState(latest) === restored) toast(ok && !S.dirty && !S.readOnly ? '已恢复原来的码' : '撤销只在本窗口生效，尚未保存');
          } } });
        } finally { resolve(persisted); }
      },
      onClose: () => { if (S.editor === me) S.editor = null; if (S.dropSink === sink) S.dropSink = null; if (!writing) resolve(false); },
    });
    if (opts.draft !== undefined) { ta.value = String(opts.draft);
      if (typeof opts.review?.raw === 'string') accept(opts.review.raw, opts.review.source, { previewOnly: true });
      msg.textContent = '已恢复换码草稿；核对后再提交，尚未覆盖当前条目。'; }
    else if (raw) accept(raw, source || '粘贴的文字', { report: opts.report });
    upd(); ta.focus();
  });
}

// entry：要编辑的条目（新增时为 null）；draft：锁定前暂存的未提交内容；prefill：粘贴或拖入文件后自动识别出的内容
function openEditor(entry, draft, prefill) {
  if (entry && !findEntry(entry.id)) entry = null;
  const isNew = !entry;
  const d = entry ? structuredClone(entry) : { service: '', account: '', group: '', favorite: false, codes: [], totp: null, fields: [], note: '' };
  const fService = h('input', { class: 'input', placeholder: '例如：Google、微信、GitHub', value: d.service, autocomplete: 'off' });
  const fAccount = h('input', { class: 'input', placeholder: '邮箱 / 用户名 / 手机号', value: d.account, autocomplete: 'off' });
  const groups = [...new Set([...S.vault.entries.map(e => e.group).filter(Boolean), ...GROUPS])];
  const fGroup = h('input', { class: 'input', placeholder: '例如：社交、工作', value: d.group, autocomplete: 'off' });
  const serviceBox = combo(fService, () => [...S.vault.entries.map(e => e.service), ...SERVICES]);
  const groupBox = combo(fGroup, () => groups);
  const singles = [[fService, LIMITS.service], [fAccount, LIMITS.account], [fGroup, LIMITS.group]];
  const markSingles = () => { for (const [el, max] of singles) el.classList.toggle('bad', clen(el.value.trim()) > max); };
  for (const [el] of singles) el.addEventListener('input', markSingles);
  const fFav = h('input', { type: 'checkbox' });
  fFav.checked = !!d.favorite;

  // —— 备用码 ——
  const fCodes = h('textarea', { class: 'textarea mono', rows: 6, spellcheck: 'false', autocomplete: 'off', placeholder: '每行一个码。\n也可以直接粘贴网站给的整段文字（含编号、说明），或把下载的 .txt 文件拖进来，会自动识别出备用码。', value: d.codes.map(c => c.v).join('\n') });
  const codesCount = h('span', { class: 'count' });
  const codesWarn = h('div');
  const parseNote = h('div');
  const updCount = () => {
    const all = fCodes.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const uniq = [...new Set(all)];
    const dup = all.length - uniq.length;
    codesCount.textContent = uniq.length ? `共 ${uniq.length} 个码` + (dup ? `（另有 ${dup} 个重复，保存时会合并）` : '') : '';
    const i = uniq.findIndex(v => clen(v) > LIMITS.code);
    fCodes.classList.toggle('bad', i >= 0);
    codesWarn.replaceChildren(...[i >= 0 ? h('p', { class: 'err' }, `第 ${i + 1} 个码有 ${clen(uniq[i])} 个字符，超过了 ${LIMITS.code} 字符的上限，这样无法保存。备用码通常只有十几个字符，请检查是不是粘贴了别的内容。`) : null].filter(Boolean));
  };
  fCodes.addEventListener('input', updCount);
  const applyExtract = (raw, label, opts) => applyCodePreview(fCodes, parseNote, updCount, raw, label, opts);
  const acceptText = (text, label, fileName = '', opts) => {
    const info = applyExtract(text, label, opts);
    if (!info.codes.length && !info.uncertain) return;
    const g = guessMeta(text, fileName);
    if (!fService.value.trim() && g.service) fService.value = g.service;
    if (!fAccount.value.trim() && g.account) fAccount.value = g.account;
    if (!fGroup.value.trim() && g.group) fGroup.value = g.group;
    markSingles(); syncReveal();
  };
  smartPaste(fCodes, (t, name, opts) => acceptText(t, name, '', opts));

  // —— 动态码 ——
  const t0 = d.totp || { secret: '', digits: 6, period: 30, algorithm: 'SHA-1' };
  const fSecret = h('input', { class: 'input mono', spellcheck: 'false', autocomplete: 'off', placeholder: '例如 JBSW Y3DP EHPK 3PXP，或 otpauth:// 开头的链接', value: d.totp ? groupChars(t0.secret) : '' });
  const mkSel = (opts, val) => h('select', { class: 'select', value: String(val) }, opts.map(([v, l]) => h('option', { value: String(v) }, l)));
  const fDigits = mkSel([[6, '6 位'], [7, '7 位'], [8, '8 位']], t0.digits);
  const fPeriod = mkSel([[30, '30 秒'], [60, '60 秒'], [15, '15 秒']], 30);
  const setPeriod = p => {
    if (![...fPeriod.options].some(o => o.value === String(p))) fPeriod.append(h('option', { value: String(p) }, p + ' 秒'));
    fPeriod.value = String(p);
  };
  setPeriod(t0.period);
  const fAlgo = mkSel([['SHA-1', 'SHA-1（默认）'], ['SHA-256', 'SHA-256'], ['SHA-512', 'SHA-512']], t0.algorithm);
  const totpPrev = h('div', { class: 'totp-preview' });
  let prevSeq = 0;
  const readTotp = () => {
    const secret = cleanB32(fSecret.value);
    if (!secret) return null;
    return { secret, digits: +fDigits.value, period: +fPeriod.value, algorithm: fAlgo.value };
  };
  const updTotp = async () => {
    const seq = ++prevSeq;
    const t = readTotp();
    totpPrev.className = 'totp-preview';
    if (!t) { totpPrev.textContent = '在网站开启「两步验证 / 身份验证器」时，选择「无法扫码 / 手动输入密钥」就能看到这串密钥。'; return; }
    try {
      b32decode(t.secret);
      const code = await totpAt(t);
      if (seq !== prevSeq) return;
      totpPrev.replaceChildren('当前动态码 ', h('b', null, fmtTotp(code)), '　—— 与手机验证器上的一致就说明填对了');
    } catch (e) {
      if (seq !== prevSeq) return;
      totpPrev.className = 'totp-preview bad';
      totpPrev.textContent = e.message;
    }
  };
  fSecret.addEventListener('input', () => {
    const v = fSecret.value.trim();
    if (/^otpauth(-migration)?:\/\//i.test(v)) {
      const p = parseOtpauth(v);
      if (!p) { totpPrev.className = 'totp-preview bad'; totpPrev.textContent = /^otpauth-migration/i.test(v) ? '暂不支持 Google 验证器的批量导出链接，请逐个账号导出或手动输入密钥' : '无法识别这个链接'; return; }
      if (p.error) { totpPrev.className = 'totp-preview bad'; totpPrev.textContent = p.error; return; }
      fSecret.value = groupChars(p.secret);
      fDigits.value = String(p.digits);
      setPeriod(Number.isInteger(p.period) && p.period >= 5 && p.period <= 300 ? p.period : 30);
      fAlgo.value = p.algorithm;
      if (!fService.value.trim() && p.issuer) fService.value = p.issuer;
      if (!fAccount.value.trim() && p.account) fAccount.value = p.account;
      markSingles();
      toast('已从链接中读取密钥' + (p.issuer ? '（' + p.issuer + '）' : ''));
    }
    updTotp();
  });
  for (const s of [fDigits, fPeriod, fAlgo]) s.addEventListener('change', updTotp);

  // —— 密钥 / 安全码 ——
  const fieldsBox = h('div');
  const addField = (label = '', value = '', focus, ph = {}) => {
    const lab = h('input', { class: 'input', placeholder: ph.label || '名称，如：恢复密钥', value: label, autocomplete: 'off' });
    const val = h('textarea', { class: 'textarea mono', rows: 1, spellcheck: 'false', autocomplete: 'off', placeholder: ph.value || '内容', value });
    const warn = h('p', { class: 'err fld-warn' });
    const grow = () => { val.style.height = 'auto'; val.style.height = Math.min(val.scrollHeight + 2, 220) + 'px'; };
    const chk = () => {
      const nl = clen(lab.value.trim()), nv = clen(val.value);
      lab.classList.toggle('bad', nl > LIMITS.label);
      val.classList.toggle('bad', nv > LIMITS.value);
      warn.textContent = nl > LIMITS.label ? `名称最多 ${LIMITS.label} 个字（现在 ${nl} 个）`
        : nv > LIMITS.value ? `内容最多 ${LIMITS.value} 个字（现在 ${nv} 个），这样无法保存` : '';
    };
    val.addEventListener('input', () => { grow(); chk(); });
    // 按「安全问题」添加的行，内容框提示「答案」；改选成其他名称（如 PIN 码）后提示变回「内容」
    const updPh = () => { val.placeholder = ph.value && !FIELD_LABELS.some(x => x !== '安全问题' && x === lab.value.trim()) ? ph.value : '内容'; };
    lab.addEventListener('input', () => { chk(); updPh(); });
    const row = h('div', { class: 'fld-row' }, combo(lab, () => FIELD_LABELS), val, h('button', { type: 'button', class: 'icon-btn danger', title: '删除这一项', 'aria-label': '删除这一项', onclick: () => row.remove() }, icon('trash', 'sm')), warn);
    row._get = () => ({ label: lab.value.trim(), value: val.value });
    row._els = { lab, val };
    fieldsBox.append(row);
    requestAnimationFrame(grow);
    chk();
    if (focus) (label && !label.endsWith('：') ? val : lab).focus();
  };
  for (const f of d.fields) addField(f.label, f.value);
  const quick = h('div', { class: 'quick-add' },
    [['恢复密钥', '恢复密钥'], ['安全码 / PIN', 'PIN 码'], ['安全问题', '', { label: '问题，例如：我的小学叫什么名字？', value: '答案' }], ['自定义', '']].map(([t, l, ph]) =>
      h('button', { type: 'button', class: 'btn sm', onclick: () => addField(l, '', true, ph) }, icon('plus', 'sm'), t)));

  // —— 备注 ——
  const fNote = h('textarea', { class: 'textarea', rows: 3, placeholder: '例如：备用码生成于哪天、在哪台设备上设置的 2FA、客服电话……', value: d.note });
  const noteInfo = h('p', { class: 'hint' });
  const updNote = () => {
    const n = clen(fNote.value);
    const over = n > LIMITS.note;
    fNote.classList.toggle('bad', over);
    noteInfo.className = over ? 'err' : 'hint';
    noteInfo.textContent = n > LIMITS.note * 0.9 ? `${n} / ${LIMITS.note} 字` + (over ? '，超出上限，这样无法保存' : '') : '';
  };
  fNote.addEventListener('input', updNote);

  // —— 不常用的几块默认收起，用「＋」按钮展开；有内容的会自动展开；每块右上角的「×」可以再收起 ——
  const closeBtn = key => h('button', { type: 'button', class: 'icon-btn sm sec-close', title: '收起这一栏', 'aria-label': '收起这一栏', onclick: () => collapse(key) }, icon('x', 'sm'));
  const groupRow = h('div', { class: 'row group-row', hidden: true },
    h('div', { class: 'field' }, h('label', { class: 'label' }, '分组'), groupBox),
    h('div', { class: 'field fav-field' }, h('label', { class: 'check' }, fFav, h('span', null, '收藏（在列表中置顶）'))),
    h('div', { class: 'group-close' }, closeBtn('group')));
  const scanSecret = async () => {
    const r = await scanQR({ title: '扫描两步验证二维码', sub: '对准网站开启两步验证时显示的二维码', syncFrames: false });
    if (!r) return;
    if (r.type === 'text' && /^otpauth:\/\//i.test(r.text)) { fSecret.value = r.text; fSecret.dispatchEvent(new Event('input')); reveal('totp'); }
    else toast('这不是两步验证（身份验证器）的二维码', { type: 'error', duration: 4000 });
  };
  const secTotp = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('clock', 'sm'), '2FA 密钥（动态验证码）'), h('span', { class: 'spacer' }),
      h('button', { type: 'button', class: 'btn sm ghost', title: '用摄像头扫网站显示的二维码', onclick: scanSecret }, icon('scan', 'sm'), '扫码'), closeBtn('totp')),
    fSecret, totpPrev,
    h('details', { class: 'adv' }, h('summary', null, '高级选项（一般不用改）'), h('div', { class: 'row' }, fDigits, fPeriod, fAlgo)));
  const secFields = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('key', 'sm'), '其他密钥与安全码'), h('span', { class: 'count' }, '恢复密钥、PIN、安全问题等'), h('span', { class: 'spacer' }), closeBtn('fields')),
    fieldsBox, quick);
  const secNote = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('note', 'sm'), '备注'), h('span', { class: 'spacer' }), closeBtn('note')),
    fNote, noteInfo);
  const moreBar = h('div', { class: 'more-bar' }, h('span', null, '更多：'));
  const parts = {};
  const reveal = (key, focusIt) => {
    const p = parts[key];
    if (!p || !p.sec.hidden) return;
    p.sec.hidden = false; p.btn.hidden = true;
    if (Object.values(parts).every(x => x.btn.hidden)) moreBar.hidden = true;
    if (focusIt && p.focus) p.focus();
  };
  for (const [key, label, sec, focus] of [
    ['totp', '2FA 密钥', secTotp, () => fSecret.focus()],
    ['fields', '恢复密钥 / PIN / 安全问题', secFields, null],
    ['note', '备注', secNote, () => fNote.focus()],
    ['group', '分组 / 收藏', groupRow, () => fGroup.focus()],
  ]) {
    const btn = h('button', { type: 'button', class: 'chip', onclick: () => reveal(key, true) }, icon('plus', 'xs'), label);
    parts[key] = { sec, btn, focus };
    moreBar.append(btn);
  }
  const syncReveal = () => {
    if (fSecret.value.trim()) reveal('totp');
    if ($$('.fld-row', fieldsBox).length) reveal('fields');
    if (fNote.value.trim()) reveal('note');
    if (fGroup.value.trim() || fFav.checked) reveal('group');
  };
  // 收起：没填内容就直接收起；填了内容先确认，再清空并收起（点「添加 / 保存」之前都不会改动保险箱）
  const PART_NAMES = { totp: '2FA 密钥', fields: '其他密钥与安全码', note: '备注', group: '分组 / 收藏' };
  const hasContent = {
    totp: () => !!fSecret.value.trim(),
    fields: () => $$('.fld-row', fieldsBox).some(r => r._get().value.trim()),
    note: () => !!fNote.value.trim(),
    group: () => !!fGroup.value.trim() || fFav.checked,
  };
  const clearPart = {
    totp: () => { fSecret.value = ''; fDigits.value = '6'; setPeriod(30); fAlgo.value = 'SHA-1'; updTotp(); },
    fields: () => clear(fieldsBox),
    note: () => { fNote.value = ''; updNote(); },
    group: () => { fGroup.value = ''; fFav.checked = false; markSingles(); },
  };
  const collapse = async key => {
    const p = parts[key];
    if (!p || p.sec.hidden) return;
    if (hasContent[key]()) {
      const ok = await confirmDialog({
        title: `移除「${PART_NAMES[key]}」这一栏？`,
        message: `这一栏里填的内容会被清空。点「${isNew ? '添加' : '保存'}」之前，保险箱里的数据都不会改动。`,
        ok: '移除', danger: true,
      });
      if (!ok || p.sec.hidden) return;
    }
    clearPart[key]();
    p.sec.hidden = true; p.btn.hidden = false; moreBar.hidden = false;
  };

  const err = h('p', { class: 'err', role: 'alert' });
  const snapshot = () => JSON.stringify([fService.value, fAccount.value, fGroup.value, fFav.checked, fCodes.value, fSecret.value, fDigits.value, fPeriod.value, fAlgo.value, $$('.fld-row', fieldsBox).map(r => r._get()), fNote.value]);
  const initial = snapshot();

  // 恢复锁定前暂存的草稿
  if (draft) {
    fService.value = str(draft.service); fAccount.value = str(draft.account); fGroup.value = str(draft.group);
    fFav.checked = !!draft.favorite;
    fCodes.value = str(draft.codes);
    fSecret.value = str(draft.secret);
    if ([6, 7, 8].includes(+draft.digits)) fDigits.value = String(+draft.digits);
    if (Number.isInteger(+draft.period) && +draft.period >= 5 && +draft.period <= 300) setPeriod(+draft.period);
    if (['SHA-1', 'SHA-256', 'SHA-512'].includes(draft.algorithm)) fAlgo.value = draft.algorithm;
    clear(fieldsBox);
    for (const f of Array.isArray(draft.fields) ? draft.fields : []) addField(str(f && f.label), str(f && f.value));
    fNote.value = str(draft.note);
  }
  // 粘贴 / 拖入文件后自动识别出的内容
  if (prefill) {
    const g = prefill.guess || {};
    if (g.service) fService.value = g.service;
    if (g.account) fAccount.value = g.account;
    if (g.group) fGroup.value = g.group;
    if (prefill.raw) applyExtract(prefill.raw, prefill.source, { report: prefill.report });
    if (prefill.uri) { fSecret.value = prefill.uri; fSecret.dispatchEvent(new Event('input')); }
  }
  if (typeof draft?.codeReview?.raw === 'string') applyExtract(draft.codeReview.raw, draft.codeReview.source, { previewOnly: true });
  markSingles(); updCount(); updTotp(); updNote(); syncReveal();

  const fail = (msg, el) => {
    err.textContent = msg; toast(msg, { type: 'error', duration: 6000 });
    for (const [key, p] of Object.entries(parts)) if (el && p.sec.contains(el)) reveal(key);
    if (el) el.focus();
  };
  const onCancel = async close => {
    if (snapshot() === initial && !codeReviews.has(fCodes)) { close(); return; }
    if (await confirmDialog({ title: '放弃修改？', message: '你填写的内容还没有保存。', ok: '放弃', cancel: '继续编辑', danger: true })) close();
  };
  const onSubmit = close => {
    err.textContent = '';
    const service = fService.value.trim(), account = fAccount.value.trim(), group = fGroup.value.trim();
    if (!service) return fail('请填写服务名称', fService);
    if (clen(service) > LIMITS.service) return fail(`服务名称最多 ${LIMITS.service} 个字（现在 ${clen(service)} 个），没有保存`, fService);
    if (clen(account) > LIMITS.account) return fail(`账号最多 ${LIMITS.account} 个字（现在 ${clen(account)} 个），没有保存`, fAccount);
    if (clen(group) > LIMITS.group) return fail(`分组名最多 ${LIMITS.group} 个字（现在 ${clen(group)} 个），没有保存`, fGroup);
    const codeVals = parseCodeLines(fCodes.value);
    const longI = codeVals.findIndex(v => clen(v) > LIMITS.code);
    if (longI >= 0) return fail(`第 ${longI + 1} 个备用码有 ${clen(codeVals[longI])} 个字符，超过了 ${LIMITS.code} 字符的上限，没有保存`, fCodes);
    const totp = readTotp();
    if (totp) { try { b32decode(totp.secret); } catch (e) { return fail('2FA 密钥有误：' + e.message, fSecret); } }
    const rows = $$('.fld-row', fieldsBox);
    for (let i = 0; i < rows.length; i++) {
      const f = rows[i]._get();
      if (clen(f.label) > LIMITS.label) return fail(`第 ${i + 1} 项的名称最多 ${LIMITS.label} 个字（现在 ${clen(f.label)} 个），没有保存`, rows[i]._els.lab);
      if (clen(f.value) > LIMITS.value) return fail(`第 ${i + 1} 项「${f.label || '未命名'}」的内容最多 ${LIMITS.value} 个字（现在 ${clen(f.value)} 个），没有保存`, rows[i]._els.val);
    }
    const note = fNote.value.replace(/\s+$/, '');
    if (clen(note) > LIMITS.note) return fail(`备注最多 ${LIMITS.note} 个字（现在 ${clen(note)} 个），没有保存`, fNote);
    const oldMap = new Map((entry ? entry.codes : []).map(c => [c.v, c]));
    const codes = codeVals.map(v => (oldMap.has(v) ? { ...oldMap.get(v) } : { v, used: false, usedAt: 0 }));
    const fields = rows.map(r => r._get()).filter(f => f.label || f.value.trim());
    if (prefill && !codeVals.length && !totp && !fields.length && !note) return fail('没有选中备用码或其他密钥。请核对未加入的项，或手工录入。', fCodes);
    const now = Date.now();
    const data = { service, account, group, favorite: fFav.checked, codes, totp, fields, note, updatedAt: now };
    let target = entry && findEntry(entry.id);
    const before = target ? structuredClone(target) : null;
    if (target) Object.assign(target, data);
    else { target = { id: uid(), createdAt: now, ...data, ver: {} }; S.vault.entries.push(target); }
    stampChanges(before, target, now);
    S.ui.sel = target.id;
    if (S.ui.filter !== 'all' && !visibleEntries().includes(target)) S.ui.filter = 'all';
    markDirty();
    close();
    renderAll();
    toast(isNew ? `已添加「${service}」` + (codes.length ? `，共 ${codes.length} 个备用码` : '') : '已保存修改');
  };

  const me = {
    changed: () => snapshot() !== initial || codeReviews.has(fCodes),
    capture: () => ({
      entryId: entry ? entry.id : null,
      service: fService.value, account: fAccount.value, group: fGroup.value, favorite: fFav.checked,
      codes: fCodes.value, secret: fSecret.value, digits: +fDigits.value, period: +fPeriod.value, algorithm: fAlgo.value,
      fields: $$('.fld-row', fieldsBox).map(r => r._get()), note: fNote.value, codeReview: codeReviews.get(fCodes),
    }),
  };
  const sink = { el: fCodes, accept: (t, name) => acceptText(t, `文件「${name}」`, name) };
  S.editor = me;
  S.dropSink = sink;
  let notice = null;
  if (draft) {
    notice = h('div', { class: 'callout info' }, icon('info'), h('span', null,
      draft.entryId && !entry ? '已恢复锁定前没提交的编辑内容。原来的条目已经不在了，保存后会作为新条目添加。'
        : `已恢复锁定前没提交的编辑内容，确认无误后点「${isNew ? '添加' : '保存'}」。`));
  } else if (prefill) {
    const n = prefill.raw ? parseCodeLines(fCodes.value).length : 0;
    const g = prefill.guess || {};
    const found = [n ? `${n} 个备用码` : '', prefill.uri ? '2FA 密钥' : ''].filter(Boolean).join('和');
    notice = h('div', { class: 'callout info' }, icon('sparkles'), h('span', null,
      (found ? `已从${prefill.source}识别出 ${found}` : `没有在${prefill.source}里识别出确定的备用码，未写入`)
      + (fService.value.trim() ? `，看起来是「${fService.value.trim()}」${fAccount.value.trim() ? '（' + fAccount.value.trim() + '）' : ''}。核对一下，没问题就点「${isNew ? '添加' : '保存'}」。` : `。填上服务名称，然后点「${isNew ? '添加' : '保存'}」。`)));
  }

  const submitBtn = h('button', { type: 'submit', class: 'btn primary' }, icon('check', 'sm'), isNew ? '添加' : '保存');
  const { dlg } = openDialog({
    title: isNew ? '新增条目' : '编辑「' + entry.service + '」',
    form: true, onSubmit, onCancel,
    onClose: () => {
      if (S.editor === me) S.editor = null;
      if (S.dropSink === sink) S.dropSink = null;
      if (prefill && prefill.onDone) prefill.onDone();
    },
    body: [
      notice,
      h('div', { class: 'sec' },
        h('div', { class: 'row' },
          h('div', { class: 'field' }, h('label', { class: 'label' }, '服务名称'), serviceBox),
          h('div', { class: 'field' }, h('label', { class: 'label' }, '账号 ', h('span', { class: 'opt' }, '（可选）')), fAccount)),
        groupRow),
      h('div', { class: 'sec' },
        h('div', { class: 'sec-h' }, h('h4', null, icon('grid', 'sm'), '一次性备用码'), codesCount, h('span', { class: 'spacer' }),
          fileButton((t, name) => acceptText(t, `文件「${name}」`, name)),
          h('button', { type: 'button', class: 'btn sm ghost', title: '从当前内容中识别备用码', onclick: () => applyExtract(fCodes.value, '当前内容') }, icon('sparkles', 'sm'), '智能整理')),
        fCodes, codesWarn, parseNote,
        entry && entry.codes.some(c => c.used) ? h('p', { class: 'hint', style: { marginTop: '6px' } }, '已标记为「用过」的码，只要内容不变就会保留标记。') : null),
      moreBar,
      secTotp, secFields, secNote,
      err,
    ],
    footer: [
      h('button', { type: 'button', class: 'btn', onclick: () => onCancel(() => dlg._close()) }, '取消'),
      submitBtn,
    ],
  });
  if (Object.values(parts).every(x => x.btn.hidden)) moreBar.hidden = true;
  if (prefill && fService.value.trim()) submitBtn.focus();
  else (isNew && !draft ? fService : fCodes).focus();
}

function changePassword() {
  if (S.readOnly) { toast('只读打开时不能修改主密码：请先「另存为」新文件，或允许写入原文件', { type: 'error', duration: 5000 }); return; }
  const cur = pwField({ autocomplete: 'current-password', placeholder: '当前主密码' });
  const p1 = pwField({ autocomplete: 'new-password', placeholder: '新主密码（至少 8 位）' });
  const p2 = pwField({ autocomplete: 'new-password', placeholder: '再输入一次新主密码' });
  const err = h('p', { class: 'err', role: 'alert' });
  const note = h('p', { class: 'hint', role: 'status' });
  const submit = h('button', { type: 'submit', class: 'btn primary' }, '确认修改');
  const cancelBtn = h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消');
  let closed = false;  // 对话框已关闭（用户取消或被锁定）：之后绝不能再写入
  const lockInputs = on => { for (const f of [cur, p1, p2]) f.input.readOnly = !!on; };
  const { close, setBusy } = openDialog({
    title: '修改主密码', size: 'sm', form: true,
    body: [
      h('div', { class: 'field' }, h('label', { class: 'label' }, '当前主密码'), cur.el),
      h('div', { class: 'field' }, h('label', { class: 'label' }, '新主密码'), p1.el, strengthMeter(p1.input)),
      h('div', { class: 'field' }, h('label', { class: 'label' }, '确认新主密码'), p2.el),
      h('p', { class: 'hint' }, '修改后，之前导出的备份文件仍然需要用旧密码解锁。'),
      note, err],
    footer: [cancelBtn, submit],
    onClose: () => { closed = true; },
    onSubmit: async c => {
      if (submit.disabled) return;
      err.textContent = '';
      // 以点击「确认修改」这一刻的输入为准：三个密码立即取成快照，之后的校验、验证、写入都只用快照；
      // 处理期间输入框设为只读，失败需要重试时再放开
      const curPw = cur.input.value, newPw = p1.input.value, newPw2 = p2.input.value;
      if (clen(newPw) < 8) { err.textContent = '新主密码至少需要 8 个字符'; return; }
      if (newPw !== newPw2) { err.textContent = '两次输入的新主密码不一致'; return; }
      if (S.readOnly) { err.textContent = '只读打开时不能修改主密码'; return; }
      const oldKey = S.key, store = S.store;
      const stillHere = () => !closed && S.key === oldKey && !S.locking;
      lockInputs(true);
      // —— 验证阶段：还可以取消，取消后什么都不会改 ——
      busy(submit, true, '正在验证…');
      try {
        const k = await deriveKey(curPw, b64d(S.header.kdf.salt), S.header.kdf.iterations);
        await decryptRaw(parseFile(await seal({ probe: 1 }, oldKey, S.header)), k);
      } catch {
        if (!stillHere()) return;
        lockInputs(false);
        busy(submit, false); err.textContent = '当前主密码不正确'; cur.input.select(); return;
      }
      if (!stillHere()) return;
      const kdf = newKdf();
      const header = { ...S.header, kdf };
      let key;
      try { key = await deriveKey(newPw, b64d(kdf.salt), kdf.iterations); }
      catch (e) { if (stillHere()) { lockInputs(false); busy(submit, false); err.textContent = '修改失败：' + e.message; } return; }
      if (!stillHere()) return;
      // —— 写入阶段：从这里开始不能取消或关闭，直到写完 ——
      setBusy(true); cancelBtn.disabled = true;
      busy(submit, true, '正在写入…');
      note.textContent = '正在用新密码重写保险箱文件，完成前不能取消或关闭。';
      let job = null;
      try {
        clearTimeout(S.saveTimer);
        while (S.saving) { try { await S.saving; } catch {} }
        if (S.key !== oldKey || S.locking) return;  // 期间已被锁定：什么都没写
        const vault = S.vault;
        job = (async () => { await store.write(await seal(vault, key, header)); })();
        S.saving = job;
        await job;
      } catch (e) {
        setBusy(false); cancelBtn.disabled = false; note.textContent = '';
        lockInputs(false);
        busy(submit, false);
        if (!S.key) return;
        if (e && e.code === 'CONFLICT') {
          err.textContent = '文件已在别处被修改，本次改密没有写入。请先处理版本冲突。';
          onConflict();
        } else {
          const why = (e && (e.message || e.name)) || '未知错误';
          err.textContent = `写入保险箱失败，主密码没有更改，仍然是原来的密码。（${why}）`;
          toast('主密码没有更改：写入保险箱失败', { type: 'error', duration: 6000 });
          if (S.dirty) markDirty();
        }
        return;
      } finally {
        if (job && S.saving === job) S.saving = null;
      }
      // 以下均为提交后的收尾；不再走“仍是旧密码”的错误分支。
      if (S.store === store && S.key === oldKey) {
        const recovered = S.pendingStashClear ? (S.pendingStashStore || store) : null;
        S.key = key; S.header = header; S.dirty = false; S.pendingStashClear = false; S.pendingStashStore = null;
        setSaveState('saved'); hideBanner();
        // 只清理已经合并并写入的暂存；未恢复的草稿不能因改密而被删除。
        if (recovered) clearStash(recovered).catch(e => console.warn('已完成改密，暂存清理失败', e));
      }
      setBusy(false);
      c();
      toast('主密码已修改，以后请用新密码解锁');
    },
  });
  cur.input.focus();
}

function editHint() {
  const input = h('input', { class: 'input', value: S.header.hint || '', placeholder: '只有你能看懂的提示' });
  input.addEventListener('input', () => input.classList.toggle('bad', clen(input.value.trim()) > LIMITS.hint));
  const err = h('p', { class: 'err' });
  const { close } = openDialog({
    title: '密码提示', size: 'sm', form: true,
    body: [h('p', { class: 'confirm-msg' }, `提示会以明文形式显示在解锁页面上，任何拿到文件的人都能看到，千万不要直接写密码。最多 ${LIMITS.hint} 个字。`), h('div', { class: 'field' }, input), err],
    footer: [h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消'), h('button', { type: 'submit', class: 'btn primary' }, '保存')],
    onSubmit: c => {
      const v = input.value.trim();
      if (clen(v) > LIMITS.hint) { err.textContent = `密码提示最多 ${LIMITS.hint} 个字（现在 ${clen(v)} 个），没有保存`; input.focus(); return; }
      S.header = { ...S.header, hint: v }; markDirty(); c(); toast('密码提示已更新');
    },
  });
  input.focus();
}

/* ---------------- 备份：导出 / 导入 ---------------- */
async function exportBackup() {
  if (!S.key) return;
  const name = `验证码保险箱备份-${ymd()}${VAULT_EXT}`;
  let handle = null;
  if (HAS_FSA) {
    try { handle = await window.showSaveFilePicker({ suggestedName: name, types: VAULT_TYPES, id: 'codevault-backup', startIn: 'documents' }); }
    catch (e) { if (e.name === 'AbortError') return; handle = null; }
  }
  const prevExportAt = S.vault.meta.lastExportAt;
  try {
    S.vault.meta.lastExportAt = Date.now();
    const text = await seal(S.vault, S.key, S.header);
    if (handle) {
      if (S.store.kind === 'file' && typeof handle.isSameEntry === 'function' && await handle.isSameEntry(S.store.handle)) { S.vault.meta.lastExportAt = prevExportAt; toast('不能把备份保存成正在使用的数据文件，请换一个名字或位置', { type: 'error', duration: 5000 }); return; }
      const w = await handle.createWritable(); await w.write(text); await w.close();
      toast('备份已保存：' + handle.name + '（用当前主密码解锁）', { duration: 5000 });
    } else {

                try { await navigator.share({ files: [file], title: name }); r = 'shared'; } catch (err) { r = err.name === 'AbortError' ? 'cancelled' : 'failed'; }
