        else if (g === 4 && typeof w === 'number') a.alg = w;
        else if (g === 5 && typeof w === 'number') a.dig = w;
        else if (g === 6 && typeof w === 'number') a.type = w;
      }
      let account = a.name.trim(), issuer = a.issuer.trim();
      const ci = account.indexOf(':');
      if (ci >= 0) { if (!issuer) issuer = account.slice(0, ci).trim(); account = account.slice(ci + 1).trim(); }
      const algorithm = { 0: 'SHA-1', 1: 'SHA-1', 2: 'SHA-256', 3: 'SHA-512' }[a.alg];
      list.push({ issuer, account, secret: a.secret, digits: a.dig === 2 ? 8 : 6, algorithm, ok: (a.type === 2 || a.type === 0) && !!algorithm && a.secret.length >= 8 });
    } else if (f === 3 && typeof v === 'number') size = v;
    else if (f === 4 && typeof v === 'number') index = v;
  }
  return { list, batch: size > 1 ? [index + 1, size] : null };
}
async function importMigration(uri) {
  let m;
  try { m = parseMigration(uri); } catch { m = null; }
  if (!m || !m.list.length) { toast('无法读取这个谷歌身份验证器导出二维码', { type: 'error' }); return; }
  const usable = m.list.filter(a => a.ok);
  const fresh = usable.filter(a => !S.vault.entries.some(e => e.totp && e.totp.secret === a.secret));
  const skipped = m.list.length - usable.length;
  if (!fresh.length) { toast(usable.length ? '这些账号的 2FA 密钥都已经存过了' : '二维码里没有可以导入的动态码账号（只支持基于时间的 TOTP）', { type: usable.length ? undefined : 'error', duration: 5000 }); return; }
  const name = a => (a.issuer || a.account || '未命名') + (a.issuer && a.account ? '（' + a.account + '）' : '');
  const ok = await confirmDialog({
    title: '从谷歌身份验证器导入',
    message: `将新增 ${fresh.length} 个账号的动态验证码：\n` + fresh.slice(0, 8).map(a => '· ' + name(a)).join('\n') + (fresh.length > 8 ? `\n……共 ${fresh.length} 个` : '')
      + (usable.length > fresh.length ? `\n另有 ${usable.length - fresh.length} 个已经存过，跳过。` : '')
      + (skipped ? `\n另有 ${skipped} 个不支持（计数器型等），跳过。` : '')
      + (m.batch ? `\n这是导出的第 ${m.batch[0]} / ${m.batch[1]} 张，其余几张也要扫一下。` : ''),
    ok: '导入',
  });
  if (!ok || !S.key || S.locking) return;
  const now = Date.now();
  for (const a of fresh) {
    const e = normalizeEntry({ id: uid(), service: a.issuer || a.account || '未命名', account: a.issuer ? a.account : '', totp: { secret: a.secret, digits: a.digits, period: 30, algorithm: a.algorithm }, createdAt: now, updatedAt: now });
    stampChanges(null, e, now);
    S.vault.entries.push(e);
  }
  markDirty(); renderAll();
  toast(`已导入 ${fresh.length} 个账号的动态验证码`);
}

/* ---------------- 手机版：离线缓存与更新 ---------------- */
// 只在从网址打开时启用（双击本地文件时什么都不做）。sw.js 只缓存程序自己的几个文件，不碰保险箱数据。
let swWaiting = null, swReload = false;
function setupPWA() {
  if (!IS_WEB || !('serviceWorker' in navigator)) return;
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = 'manifest.webmanifest';
  document.head.append(link);
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (swReload) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const found = w => { if (!w || !navigator.serviceWorker.controller) return; swWaiting = w; onUpdateFound(); };
    if (reg.waiting) found(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') found(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('离线缓存不可用', e));
}
function updatePill() {
  return swWaiting ? h('button', { type: 'button', class: 'update-pill', onclick: applyUpdate }, icon('refresh', 'xs'), '有新版本，点这里更新') : null;
}
function onUpdateFound() {
  const slot = $('#update-slot');
  if (slot) slot.replaceChildren(...[updatePill()].filter(Boolean));
  if (S.key) toast('验证码保险箱有新版本', { action: { label: '锁定并更新', run: applyUpdate }, duration: 10000 });
}
async function applyUpdate() {
  if (!swWaiting) return;
  if (S.key) await lock();
  swReload = true;
  swWaiting.postMessage('skipWaiting');
}

/* ---------------- 打印 ---------------- */
async function printEntries(list) {
  if (!list.length) { toast('还没有可以打印的条目'); return; }
  const ok = await confirmDialog({ title: '打印纸质备份', message: `将以明文打印 ${list.length} 个账号的密码、备用码和密钥。\n纸质副本请像现金一样妥善保管，不用时及时销毁。`, ok: '继续打印' });
  if (!ok) return;
  const area = clear($('#print-area'));
  const sorted = [...list].sort((a, b) => zhCompare(a.service, b.service));
  area.append(h('div', { class: 'p-head' }, h('h1', null, APP_NAME), h('div', null, `打印于 ${fmtDate(Date.now(), true)} · 共 ${list.length} 项`)));
  for (const e of sorted) {
    const st = codeStats(e);
    area.append(h('section', { class: 'p-entry' },
      h('h2', null, e.service, e.account ? h('small', null, '　' + e.account) : null),
      e.password || e.url ? [h('h3', null, '登录信息'), h('table', { class: 'p-kv' }, h('tbody', null, e.url ? h('tr', null, h('td', null, '网址'), h('td', null, e.url)) : null, e.password ? h('tr', null, h('td', null, '密码'), h('td', null, e.password)) : null))] : null,
      e.codes.length ? [h('h3', null, `一次性备用码（可用 ${st.left} / ${st.total}，用过的请打勾）`),
        h('ol', { class: 'p-codes' }, e.codes.map((c, i) => h('li', { class: c.used ? 'used' : '' }, h('span', { class: 'box' }, c.used ? '☑' : '☐'), `${pad2(i + 1)}.  ${c.v}`)))] : null,
      e.totp ? [h('h3', null, `2FA 密钥（TOTP，${e.totp.digits} 位 / ${e.totp.period} 秒 / ${e.totp.algorithm}）`), h('div', { class: 'p-mono' }, groupChars(e.totp.secret))] : null,
      e.fields.length ? [h('h3', null, '密钥与安全码'), h('table', { class: 'p-kv' }, h('tbody', null, e.fields.map(f => h('tr', null, h('td', null, f.label || '—'), h('td', null, f.value)))))] : null,
      e.note ? [h('h3', null, '备注'), h('div', { class: 'p-note' }, e.note)] : null));
  }
  area.append(h('div', { class: 'p-foot' }, '提示：备用码每个只能用一次；用完或泄露后，请到对应网站重新生成。'));
  setTimeout(() => window.print(), 60);
}
addEventListener('afterprint', () => clear($('#print-area')));

/* ---------------- 全局快捷键 / 启动 ---------------- */
addEventListener('keydown', e => {
  if (!S.key || $('dialog[open]')) return;
  if (e.key === '/' && !isTyping(e.target)) { e.preventDefault(); const s = $('.search input'); if (s) s.focus(); }
  else if (e.key === 'Escape' && !isTyping(e.target) && S.ui && S.ui.sel) { select(null); }
});
addEventListener('pagehide', () => { if (S.dirty) flushSave(); });

async function init() {
  applyTheme();
  setupPWA();
  detectBio();  // 不等它：锁屏上的按钮只看本机有没有开启记录
  if (!window.crypto || !crypto.subtle) {
    gate(h('h1', null, '无法运行'), h('p', { class: 'sub' }, '当前环境不支持所需的加密功能（编辑器或聊天软件里的预览窗口通常不行）。请在文件夹里双击这个文件，用最新版的 Microsoft Edge 或 Google Chrome 打开。'));
    return;
  }
  // 文件和浏览器存储都要找：上次用哪个就先打开哪个，锁屏上可以切换到另一个
  const handle = await rememberedHandle();
  const local = hasLocalVault();
  if (handle && !(local && loadPrefs().lastStore === 'local')) { S.store = fileStore(handle); renderLock(); return; }
  if (local) { S.store = localStore(); renderLock(); return; }
  renderWelcome();
}
init();
})();
