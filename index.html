<meta name="referrer" content="no-referrer">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#03040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>验证码保险箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f5fe3'/%3E%3Cpath d='M32 12l16 6v12c0 11-7 19-16 22-9-3-16-11-16-22V18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M25 32l5 5 9-10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   1.5.0「极光玻璃」：会流动的极光背景 + 液态玻璃浮层 + iOS 弹簧动效
   ===================================================================== */
@property --a1{syntax:'<color>';inherits:true;initial-value:#5a46ff}
@property --a2{syntax:'<color>';inherits:true;initial-value:#ff3b94}
@property --a3{syntax:'<color>';inherits:true;initial-value:#00b7ff}
@property --a4{syntax:'<color>';inherits:true;initial-value:#10d0a0}
:root{
  color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Cascadia Code",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.3,1.25,.5,1);
  --bouncy:cubic-bezier(.3,1.5,.45,1);
  --soft:cubic-bezier(.22,.9,.3,1);
  /* 浅色 */
  --base:#eef0f7; --ink:#0a0b10; --ink2:rgba(60,60,67,.68); --ink3:rgba(60,60,67,.38);
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,140,.12); --fill-2:rgba(118,118,140,.2); --well:rgba(255,255,255,.64); --card:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.76); --rim-a:#fff; --rim-b:rgba(255,255,255,.6); --hi:rgba(255,255,255,.95);
  --gshadow:0 14px 34px -14px rgba(36,48,96,.26),0 2px 6px -2px rgba(36,48,96,.08);
  --lightc:rgba(255,255,255,.85); --edge:rgba(238,240,247,.8); --veil:rgba(244,246,251,.3);
  --sheet:rgba(247,248,252,.86); --backdrop:rgba(30,34,56,.26);
  --mx:50%; --mw:#fff; --aur:1; --grain:.05;
  --A1:#5a46ff; --A2:#ff3b94; --A3:#00b7ff; --A4:#10d0a0;
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --indigo:#5856d6; --cyan:#32ade6; --teal:#30b0c7; --yellow:#ffcc00;
  --eg1:#6d6bff; --eg2:#b45cff; --emglass:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.3) 50%,rgba(255,255,255,.5)); --emshadow:rgba(90,70,255,.38);
  --scanc:#5b55ff; --scang:rgba(91,85,255,.45); --halo:.5;
  /* 旧名字（程序里的行内样式还在用） */
  --text:var(--ink); --text-2:var(--ink2); --text-3:var(--ink3); --accent:var(--blue); --danger:var(--red); --warn:var(--orange); --ok:var(--green);
  --a1:var(--A1); --a2:var(--A2); --a3:var(--A3); --a4:var(--A4);
}
@supports (transition-timing-function:linear(0,1)){
  :root{
    --spring:linear(0, 0.029, 0.102, 0.202, 0.313, 0.427, 0.536, 0.637, 0.725, 0.8, 0.863, 0.913, 0.952, 0.981, 1.002, 1.017, 1.025, 1.03, 1.032, 1.031, 1.029, 1.026, 1.022, 1.019, 1.015, 1.012, 1.009, 1.007, 1.005, 1.003, 1.002, 1.001, 1, 1, 0.999, 0.999, 1);
    --bouncy:linear(0, 0.03, 0.107, 0.215, 0.34, 0.47, 0.597, 0.714, 0.817, 0.904, 0.974, 1.027, 1.065, 1.09, 1.103, 1.107, 1.104, 1.095, 1.084, 1.071, 1.057, 1.043, 1.031, 1.02, 1.01, 1.003, 0.997, 0.993, 0.99, 0.989, 0.989, 0.989, 0.99, 0.991, 0.992, 0.994, 0.995, 0.997, 0.998, 0.999, 1, 1, 1.001, 1.001, 1);
    --soft:linear(0, 0.021, 0.073, 0.145, 0.227, 0.313, 0.398, 0.478, 0.553, 0.622, 0.683, 0.736, 0.783, 0.823, 0.856, 0.885, 0.909, 0.928, 0.944, 0.957, 0.968, 0.976, 0.983, 0.988, 0.992, 0.995, 0.997, 0.999, 1, 1.001, 1.001, 1.001, 1.001, 1.002, 1.001, 1.001, 1);
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --base:#03040a; --ink:#fff; --ink2:rgba(235,235,245,.68); --ink3:rgba(235,235,245,.36);
    --sep:rgba(255,255,255,.1); --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.15); --well:rgba(0,0,0,.26); --card:rgba(255,255,255,.06);
    --glass:rgba(255,255,255,.075); --glass-2:rgba(36,36,46,.74); --rim-a:rgba(255,255,255,.55); --rim-b:rgba(255,255,255,.16); --hi:rgba(255,255,255,.2);
    --gshadow:0 18px 40px -16px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.25);
    --lightc:rgba(255,255,255,.2); --edge:rgba(3,4,10,.7); --veil:rgba(3,4,10,.34);
    --sheet:rgba(28,28,36,.86); --backdrop:rgba(0,0,0,.5);
    --mx:100%; --mw:#000; --aur:.66; --grain:.07;
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --cyan:#64d2ff; --teal:#40c8e0; --yellow:#ffd60a;
    --eg1:#fff; --eg2:#d6cfff; --emglass:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.08) 50%,rgba(255,255,255,.18)); --emshadow:rgba(110,80,255,.6);
    --scanc:#fff; --scang:rgba(140,220,255,.85); --halo:.36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --base:#03040a; --ink:#fff; --ink2:rgba(235,235,245,.68); --ink3:rgba(235,235,245,.36);
  --sep:rgba(255,255,255,.1); --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.15); --well:rgba(0,0,0,.26); --card:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.075); --glass-2:rgba(36,36,46,.74); --rim-a:rgba(255,255,255,.55); --rim-b:rgba(255,255,255,.16); --hi:rgba(255,255,255,.2);
  --gshadow:0 18px 40px -16px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.25);
  --lightc:rgba(255,255,255,.2); --edge:rgba(3,4,10,.7); --veil:rgba(3,4,10,.34);
  --sheet:rgba(28,28,36,.86); --backdrop:rgba(0,0,0,.5);
  --mx:100%; --mw:#000; --aur:.66; --grain:.07;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --cyan:#64d2ff; --teal:#40c8e0; --yellow:#ffd60a;
  --eg1:#fff; --eg2:#d6cfff; --emglass:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.08) 50%,rgba(255,255,255,.18)); --emshadow:rgba(110,80,255,.6);
  --scanc:#fff; --scang:rgba(140,220,255,.85); --halo:.36;
}
html{transition:--a1 1.2s ease,--a2 1.2s ease,--a3 1.2s ease,--a4 1.2s ease}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--base);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
h1,h2,h3{line-height:1.25}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
.hint{font-size:13px;color:var(--ink2);margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.xs{width:13px;height:13px}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:30px;height:30px}
svg.i.fill{fill:currentColor}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}

/* ───── 会流动的极光背景（固定在最底层） ───── */
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--base);pointer-events:none}
#aurora i{position:absolute;border-radius:50%;opacity:var(--aur);background:radial-gradient(closest-side,color-mix(in srgb,var(--c) var(--mx),var(--mw)),transparent);will-change:transform}
#aurora .b1{--c:var(--a1);width:130vmax;height:70vmax;left:-62vmax;top:-26vmax;animation:d1 22s ease-in-out infinite alternate}
#aurora .b2{--c:var(--a2);width:110vmax;height:62vmax;right:-60vmax;top:10vh;animation:d2 27s ease-in-out infinite alternate}
#aurora .b3{--c:var(--a3);width:120vmax;height:66vmax;left:-56vmax;bottom:-20vmax;animation:d3 24s ease-in-out infinite alternate}
#aurora .b4{--c:var(--a4);width:110vmax;height:60vmax;right:-54vmax;bottom:-34vmax;animation:d4 31s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(24%,14%) scale(1.14)}}
@keyframes d2{to{transform:translate(-20%,16%) scale(.88)}}
@keyframes d3{to{transform:translate(18%,-12%) scale(1.12)}}
@keyframes d4{to{transform:translate(-22%,-16%) scale(1.16)}}
#aurora .veil{position:absolute;inset:0;background:var(--veil);opacity:1;transition:opacity 1s ease}
html.gate-on #aurora .veil{opacity:0}
#aurora .grain{position:absolute;inset:0;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1}

/* ───── 液态玻璃 ───── */
.glass{position:relative;background:var(--gf,var(--glass));-webkit-backdrop-filter:blur(var(--gb,26px)) saturate(var(--gs,190%));backdrop-filter:blur(var(--gb,26px)) saturate(var(--gs,190%));box-shadow:var(--gshadow),inset 0 1px 0 var(--hi)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:linear-gradient(155deg,var(--rim-a) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 64%,var(--rim-b) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* 手指按下的地方会亮起来 */
.tl{position:relative}
.tl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:radial-gradient(150px circle at var(--tx,50%) var(--ty,50%),var(--lightc),transparent 70%);opacity:0;transition:opacity .7s ease}
.tl.lit::after{opacity:1;transition:opacity .05s}
.press{transition:transform .6s var(--spring)}
.press.down{transform:scale(.965);transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.press.sm.down{transform:scale(.86)}

/* ───── 按钮 ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--fill);color:var(--ink);font:600 15px/1 var(--font);white-space:nowrap;transition:transform .5s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.96);transition-duration:.12s}
.btn.primary{background:linear-gradient(180deg,#3592ff,#0a6aff);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 10px 24px -12px rgba(10,106,255,.8)}
.btn.danger{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sm{height:34px;padding:0 13px;border-radius:17px;font-size:14px;gap:5px}
.btn.block{width:100%;height:52px;border-radius:26px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--ink2);flex:none;transition:background .2s,color .2s,transform .5s var(--spring)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.on{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.icon-btn.danger{color:var(--red)}
.icon-btn:disabled{opacity:.4}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline}

/* ───── 表单 ───── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font:600 13px var(--font);color:var(--ink2);padding-left:4px}
.label .opt{font-weight:400;color:var(--ink3)}
.input,.textarea,.select{width:100%;border:0;background:var(--fill);border-radius:14px;padding:11px 14px;min-height:46px;outline:none;color:var(--ink);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s,background .2s}
.input::placeholder,.textarea::placeholder{color:var(--ink3)}
.input:focus,.textarea:focus,.select:focus{background:var(--well);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--blue) 75%,transparent)}
.input.bad,.textarea.bad,.input.bad:focus,.textarea.bad:focus{box-shadow:inset 0 0 0 2px var(--red)}
.textarea{resize:vertical;min-height:96px;line-height:1.6;display:block}
.select{appearance:auto;padding-right:10px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin:6px 0 0}
.pw-wrap{position:relative;display:block}
.pw-wrap .input{padding-right:48px}
.pw-wrap .icon-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.pw-wrap .icon-btn:active{transform:translateY(-50%) scale(.9)}
.pw-line{display:flex;gap:8px;align-items:center}
.pw-line .pw-wrap{flex:1;min-width:0}
.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:0 4px}
.meter .bar{flex:1;height:5px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .3s var(--soft),background .3s}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);cursor:pointer;margin:4px 0 14px;text-align:left}
.check input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--blue);flex:none}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:var(--fill-2);transition:background .25s}
.switch .slider::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .45s var(--spring)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider::after{transform:translateX(20px)}
.switch input:focus-visible+.slider{outline:2px solid var(--blue);outline-offset:2px}

/* ───── 锁屏 / 欢迎 ───── */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(36px,calc(env(safe-area-inset-top) + 24px)) 20px max(28px,calc(env(safe-area-inset-bottom) + 20px));text-align:center}
.gate-card{width:100%;max-width:400px;animation:gate-in .8s var(--spring) both}
@keyframes gate-in{from{opacity:0;transform:translateY(22px)}}
.gate h1{font:700 30px/1.15 var(--display);letter-spacing:.3px;margin:26px 0 8px}
.gate .sub{color:var(--ink2);margin:0 0 22px;text-wrap:balance}
.gate .stack{display:flex;flex-direction:column;gap:12px}
.gate .file-pill{display:inline-flex;align-items:center;gap:7px;justify-content:center;max-width:100%;font-size:13.5px;color:var(--ink2);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim-b);border-radius:999px;padding:7px 14px;margin:0 0 20px;word-break:break-all}
.gate .reason{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13.5px;color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent);border-radius:16px;padding:9px 14px;margin:0 0 14px;text-align:left}
.gate .reason.info{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate .field{margin:0;text-align:left}
.gate .pw-wrap .input{height:56px;border-radius:28px;padding:0 54px 0 22px;font-size:17px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim-b),inset 0 1px 0 var(--hi)}
.gate .pw-wrap .input:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--blue) 75%,transparent)}
.gate .input{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 .5px var(--rim-b)}
.gate .btn:not(.primary):not(.ghost){background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim-b),inset 0 1px 0 var(--hi)}
.gate .err{text-align:center;margin:0}
.gate .err:empty{display:none}
.gate .links{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:20px;font-size:14px}
.gate .hint-box{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;padding:10px 14px;font-size:14px;color:var(--ink2);word-break:break-word}
.gate .back{align-self:flex-start;margin:0 0 6px -8px}
.gate .meter{margin-top:4px}
.gate-foot{margin-top:26px;font-size:12.5px;color:var(--ink2);text-align:center;display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center}
.gate-foot span{display:inline-flex;align-items:center;gap:5px}
.gate-note{font-size:13px;color:var(--ink2);text-align:center;margin:16px 0 0;text-wrap:balance}
.or-line{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13px;margin:6px 0}
.or-line::before,.or-line::after{content:"";flex:1;height:.5px;background:var(--sep)}
.bio-btn svg.i{width:24px;height:24px;stroke-width:1.8}
/* 玻璃徽标：盾牌钥匙孔，面容 ID 扫描、打勾 */
.emblem{position:relative;width:148px;height:148px;margin:0 auto;flex:none}
.gate-lock .emblem{width:164px;height:164px}
.emf{position:absolute;inset:0;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.halo{position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--a1) 70%,var(--a3)),transparent);opacity:var(--halo);z-index:-1;transition:background .5s}
.em-glass{position:absolute;inset:0;border-radius:30%;background:var(--emglass);-webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.8),inset 0 -3px 9px rgba(0,0,0,.12),inset 0 0 40px rgba(255,255,255,.16),0 0 0 .5px rgba(255,255,255,.45),0 44px 70px -30px var(--emshadow);transition:box-shadow .5s}
.em-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(150deg,#fff,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 66%,rgba(255,255,255,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.em-glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(68% 42% at 30% 10%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);opacity:.75}
.emblem svg.eg{position:absolute;left:50%;top:50%;width:52%;height:52%;transform:translate(-50%,-50%);transition:opacity .35s ease,transform .7s var(--spring),filter .35s ease}
.emblem svg.lockg{filter:drop-shadow(0 8px 18px var(--emshadow))}
.emblem svg.faceg,.emblem svg.okg{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.emblem svg.faceg{width:48%;height:48%;stroke-width:1.6;color:var(--scanc);filter:drop-shadow(0 0 10px var(--scang))}
.emblem svg.okg{stroke-width:2.4;color:var(--green);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--green) 70%,transparent))}
.okg path{stroke-dasharray:26;stroke-dashoffset:26}
.em-scan{position:absolute;inset:6px;border-radius:27%;overflow:hidden;opacity:0;transition:opacity .3s}
.em-scan::before{content:"";position:absolute;left:8%;right:8%;height:34%;top:-34%;background:linear-gradient(to bottom,rgba(140,225,255,0),rgba(140,225,255,.16) 72%,rgba(210,248,255,.9) 97%,rgba(255,255,255,0))}
.emblem.scan .lockg{opacity:0;transform:translate(-50%,-50%) scale(.55);filter:blur(6px)}
.emblem.scan .faceg{opacity:1;transform:translate(-50%,-50%);animation:fpulse 1.1s ease-in-out infinite}
@keyframes fpulse{50%{transform:translate(-50%,-50%) scale(.94)}}
.emblem.scan .em-scan{opacity:1}
.emblem.scan .em-scan::before{animation:scanl 1.05s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scanl{to{top:100%}}
.emblem.ok .lockg,.emblem.ok .faceg{opacity:0;transform:translate(-50%,-50%) scale(.55)}
.emblem.ok .okg{opacity:1;transform:translate(-50%,-50%)}
.emblem.ok .okg path{animation:draw .4s .05s ease forwards}
.emblem.ok .em-glass{box-shadow:inset 0 2px 1px rgba(255,255,255,.8),inset 0 0 40px color-mix(in srgb,var(--green) 28%,transparent),0 0 0 .5px rgba(255,255,255,.45),0 44px 70px -30px color-mix(in srgb,var(--green) 75%,transparent)}
.emblem.ok .halo{background:radial-gradient(closest-side,color-mix(in srgb,var(--green) 80%,transparent),transparent)}
.gate.leaving .emblem{animation:fly-through .62s cubic-bezier(.5,0,.2,1) forwards}
.gate.leaving .gate-card,.gate.leaving .gate-foot,.gate.leaving .install-card{animation:fade-down .38s ease-in forwards}
@keyframes fly-through{to{transform:scale(4.4);opacity:0;filter:blur(18px)}}
@keyframes fade-down{to{transform:translateY(30px);opacity:0}}
.install-card{width:100%;max-width:400px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--gshadow),inset 0 0 0 .5px var(--rim-b);border-radius:22px;padding:14px 18px;margin:0 0 26px;font-size:14px;color:var(--ink2);text-align:left}
.install-card b{color:var(--ink)}
.install-card ol{margin:6px 0 0;padding-left:20px}
.install-card li{margin:3px 0}
.update-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 14px;border-radius:999px;border:0;background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);font-size:13px;font-weight:600}

/* ───── 主界面框架 ───── */
.shell{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:minmax(380px,460px) 1fr}
.side,.main{position:relative;min-width:0;overflow:hidden}
.side{box-shadow:inset -.5px 0 0 var(--sep)}
.scroller{position:absolute;inset:0;z-index:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.side .scroller{padding:calc(env(safe-area-inset-top) + 64px) 0 calc(env(safe-area-inset-bottom) + 110px);scrollbar-width:none}
.side .scroller::-webkit-scrollbar{display:none}
.nav{position:absolute;z-index:10;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 78px);pointer-events:none}
.nav .edge{position:absolute;inset:0;opacity:var(--p,0);background:linear-gradient(to bottom,var(--edge) 45%,transparent);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.nav .bar{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);height:46px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.nav .sp{flex:1}
.nav .ttl{position:absolute;left:110px;right:110px;top:calc(env(safe-area-inset-top) + 10px);height:46px;display:grid;place-items:center;font:600 17px var(--font);opacity:var(--p,0);transform:translateY(calc((1 - var(--p,0)) * 8px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.circ{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.grp{height:46px;border-radius:23px;display:flex;align-items:center;padding:0 3px}
.gb{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--ink);position:relative;z-index:2;transition:transform .6s var(--spring),background .2s}
.gb.txt{width:auto;padding:0 14px 0 10px;font:600 17px var(--font)}
.gb.on svg.i{fill:var(--yellow);stroke:var(--yellow)}
.gb.pop svg.i{animation:pop .6s var(--bouncy)}
.hd{padding:2px 22px 0}
.big{font:700 34px/1.18 var(--display);letter-spacing:.3px;margin:0;opacity:calc(1 - var(--p,0) * 1.3)}
.hd .sub{margin-top:2px;font:400 15px var(--font);color:var(--ink2);opacity:calc(1 - var(--p,0) * 1.3);display:flex;flex-wrap:wrap;align-items:center}
.save-status{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.save-status.error{color:var(--red);font-weight:600}
.save-status.warn{color:var(--orange);font-weight:600}
.save-status .spin{width:12px;height:12px;border-width:1.5px}
#banner:empty{display:none}
.banner{display:flex;align-items:center;gap:10px;margin:14px 16px 0;padding:12px 14px;border-radius:20px;font-size:14px;flex-wrap:wrap;color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--glass-2));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.banner.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--glass-2))}
.banner .msg{flex:1;min-width:200px;display:flex;gap:8px;align-items:center}
.banner .btn{height:32px;font-size:13.5px}
#lock-veil{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;overflow:hidden;display:none;place-items:center;cursor:progress}
#lock-veil:popover-open{display:grid;animation:veil-in .2s .15s both}
@keyframes veil-in{from{background:transparent}to{background:color-mix(in srgb,var(--base) 60%,transparent)}}
#lock-veil .veil-box{display:flex;align-items:center;gap:10px;background:var(--glass-2);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:var(--ink);border-radius:999px;padding:12px 20px;box-shadow:var(--gshadow);font-weight:600;animation:veil-box-in .3s .15s var(--spring) both}
@keyframes veil-box-in{from{opacity:0;transform:scale(.9)}}
/* 进场：一层层浮上来 */
.shell.enter .side .st{animation:rise .75s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.shell.enter .side .nav,.shell.enter .bbar{animation:fade .5s .35s both}
.shell.enter .main .detail,.shell.enter .main .nav{animation:fade .6s .3s both}
.shell.enter{animation:zoom-in .85s var(--soft) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes fade{from{opacity:0}}
@keyframes zoom-in{from{opacity:0;transform:scale(1.08);filter:blur(12px)}}

/* ───── 首页：大标题、安全检查、收藏卡片、账号列表 ───── */
.rings{margin:18px 16px 0;border-radius:30px;padding:16px 18px 16px 16px;display:flex;align-items:center;gap:16px;cursor:pointer;width:calc(100% - 32px);text-align:left}
.rings > svg{width:96px;height:96px;flex:none;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 0 6px rgba(120,200,255,.25));position:relative;z-index:2}
.rings circle{fill:none;stroke-width:9.5;stroke-linecap:round}
.rings .tr{opacity:.2}
.rings .ar{transition:stroke-dashoffset 1.5s var(--soft)}
.rt{flex:1;min-width:0;position:relative;z-index:2}
.rt h3{margin:0 0 5px;font:600 17px var(--font);display:flex;align-items:center;justify-content:space-between;gap:6px}
.rt h3 small{font:500 13px var(--font);color:var(--orange);display:flex;align-items:center;gap:1px;white-space:nowrap}
.rt h3 small.ok{color:var(--green)}
.rt h3 small svg.i{width:14px;height:14px;stroke-width:2.6}
.rt p{margin:4px 0 0;display:flex;align-items:center;gap:8px;font:400 14px/1.3 var(--font);color:var(--ink2)}
.rt p i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.rt p em{margin-left:auto;font:600 14px var(--rounded);font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:26px 22px 12px;font:700 21px/1.2 var(--display);letter-spacing:.2px;margin:0}
.sh small{font:400 15px var(--font);color:var(--ink2);letter-spacing:0}
/* 钱包式卡片 */
.card{color:#fff;background:
    radial-gradient(130% 120% at 0% 0%,rgba(255,255,255,.34),rgba(255,255,255,0) 46%),
    radial-gradient(100% 120% at 100% 100%,rgba(0,0,0,.3),rgba(0,0,0,0) 55%),
    repeating-radial-gradient(circle at 92% 120%,rgba(255,255,255,.075) 0 1px,rgba(255,255,255,0) 1.6px 9px),
    linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.3),0 -3px 12px -3px rgba(0,0,0,.25),0 24px 40px -24px var(--c2)}
.wallet{position:relative;margin:0 16px}
.wc{position:absolute;left:0;right:0;height:170px;border-radius:24px;overflow:hidden;cursor:pointer;text-align:left;outline-offset:3px}
.wmark{position:absolute;right:-8px;bottom:-62px;font:800 200px/1 var(--rounded);font-style:normal;color:rgba(255,255,255,.11);transform:rotate(-12deg);pointer-events:none;white-space:nowrap}
.wsheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.3) 47%,rgba(255,255,255,.05) 53%,rgba(255,255,255,0) 62%);background-size:300% 100%;background-position:100% 0;mix-blend-mode:overlay;animation:sheen 9s ease-in-out infinite}
.wc:nth-child(2) .wsheen{animation-delay:-3s}.wc:nth-child(3) .wsheen{animation-delay:-6s}
@keyframes sheen{0%,74%{background-position:100% 0}100%{background-position:0 0}}
.wtop{position:relative;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px}
.wico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.4);font:700 14px/1 var(--rounded)}
.wico.two{font-size:11.5px}
.wtop b{flex:1;font:600 17px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcode{font:600 19px/1 var(--rounded);letter-spacing:1.5px;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.15);white-space:nowrap}
.wsub{font:600 14px var(--font);opacity:.9;white-space:nowrap}
.mring{width:20px;height:20px;transform:rotate(-90deg);flex:none}
.mring circle{fill:none;stroke-width:2.6}
.mring .trk{stroke:rgba(255,255,255,.28)}
.mring .arc{stroke:#fff;stroke-linecap:round;stroke-dasharray:50.27;transition:stroke-dashoffset .3s linear}
.wsec{font:600 13px var(--rounded);font-variant-numeric:tabular-nums;opacity:.92;min-width:18px;text-align:right}
.wbody{position:absolute;left:18px;right:16px;bottom:16px}
.wbig{font:600 42px/1 var(--rounded);letter-spacing:3px;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.18);white-space:nowrap}
.wbig.small{font-size:28px;letter-spacing:.5px}
.wmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font:500 14px var(--font);color:rgba(255,255,255,.86)}
.wmeta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcopy{height:30px;padding:0 13px;border-radius:15px;display:flex;align-items:center;gap:5px;flex:none;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 .5px rgba(255,255,255,.35);font:600 13px var(--font);color:#fff}
.wcopy svg.i{width:15px;height:15px;stroke-width:2.3}
/* 筛选 */
.filters{display:flex;gap:8px;padding:22px 16px 0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters:empty{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim-b);color:var(--ink2);font:600 13.5px var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .5s var(--spring)}
.chip:active{transform:scale(.94)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--base);box-shadow:none}
/* 账号列表 */
.list{margin:0 16px;border-radius:28px;padding:3px 0;list-style:none}
.list > li{list-style:none}
.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 14px 10px 16px;position:relative;cursor:pointer;text-align:left;color:inherit;transition:background .25s}
.lrow.down{background:var(--fill)}
.lrow[aria-current="true"]{background:color-mix(in srgb,var(--blue) 13%,transparent)}
.list > li:first-child > .lrow,.list > .lrow:first-child{border-radius:28px 28px 0 0}
.list > li:last-child > .lrow,.list > .lrow:last-child{border-radius:0 0 28px 28px}
.list > li:only-child > .lrow,.list > .lrow:only-child{border-radius:28px}
.list > li + li > .lrow::before,.list > .lrow + .lrow::before{content:"";position:absolute;top:0;left:74px;right:0;height:.5px;background:var(--sep)}
.lrow .t{flex:1;min-width:0;position:relative;z-index:2}
.lrow .t b{display:flex;align-items:center;gap:5px;font:500 17px/1.25 var(--font)}
.lrow .t b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .t .star{color:var(--yellow);width:13px;height:13px}
.lrow .t > span{display:block;font:400 14px/1.3 var(--font);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:14px;height:14px;color:var(--ink3);stroke-width:2.8}
.list-empty{padding:30px 18px;text-align:center;color:var(--ink2);font-size:14px}
.ico{width:44px;height:44px;border-radius:12.5px;display:grid;place-items:center;flex:none;position:relative;color:#fff;font:700 19px/1 var(--rounded);text-shadow:0 1px 2px rgba(0,0,0,.2);
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1.5px 3px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.25),0 7px 14px -7px var(--c2)}
.ico::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 75% at 30% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 58%);pointer-events:none}
.ico.two{font-size:15.5px}
.ico.sm{width:34px;height:34px;border-radius:10px;font-size:15px}
.ico.sm.two{font-size:12px}
.ico.xs{width:30px;height:30px;border-radius:9px;font-size:13px}
.ico.xs.two{font-size:11px}
.pills{display:flex;gap:5px;position:relative;z-index:2;flex:none}
.pill{font:600 12px/1 var(--font);padding:5px 8px;border-radius:999px;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);white-space:nowrap}
.foot{margin:22px 0 0;text-align:center;font:400 13px var(--font);color:var(--ink2);padding:0 20px}
.bbar{position:absolute;z-index:10;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:12px;align-items:center;justify-content:space-between}
.search{flex:1 1 56px;min-width:56px;height:56px;border-radius:28px;display:flex;align-items:center;gap:9px;padding:0 19px;color:var(--ink2);cursor:text;overflow:hidden;transition:flex-grow .6s var(--spring),padding .6s var(--spring)}
.search svg.i{position:relative;z-index:2}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 17px var(--font);color:var(--ink);position:relative;z-index:2;transition:opacity .2s}
.search input::placeholder{color:var(--ink2)}
.search input::-webkit-search-cancel-button{opacity:.6}
.bbar.min .search{flex-grow:0;padding:0 17px}
.bbar.min .search input{opacity:0}
.add{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;position:relative;
  background:linear-gradient(180deg,rgba(53,146,255,.94),rgba(10,106,255,.92));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.3),0 14px 28px -10px rgba(10,106,255,.75)}
.add svg.i{width:26px;height:26px;stroke-width:2.4}
/* 空保险箱 */
.empty-card{margin:18px 16px 0;border-radius:30px;padding:26px 22px;text-align:center}
.empty-card .art{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(155deg,#6d6bff,#b45cff);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 14px 30px -12px rgba(110,90,255,.8)}
.empty-card h2{margin:0 0 6px;font:700 22px var(--display)}
.empty-card p{margin:0 0 18px;color:var(--ink2);text-wrap:balance}
.empty-card .stack{display:flex;flex-direction:column;gap:10px}
.quick-tip{display:flex;gap:12px;align-items:flex-start;text-align:left;background:color-mix(in srgb,var(--blue) 11%,transparent);border-radius:18px;padding:12px 14px;margin:16px 0 0}
.quick-tip svg.i{color:var(--blue);margin-top:2px}
.quick-tip b{color:var(--blue)}
.quick-tip p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

/* ───── 账号详情 ───── */
.main .scroller{padding:calc(env(safe-area-inset-top) + 66px) 0 calc(env(safe-area-inset-bottom) + 40px)}
.detail{max-width:740px;margin:0 auto;padding:0 16px}
.detail.enter{animation:detail-in .55s var(--spring) both}
@keyframes detail-in{from{opacity:0;transform:translateY(18px) scale(.985)}}
.hero{position:relative;height:214px;border-radius:30px;overflow:hidden;transform-origin:50% 100%}
.hero .wmark{font-size:230px;bottom:-74px}
.hero.sweep .wsheen{animation:sweep 1.2s .05s ease forwards}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.hico{position:absolute;left:18px;top:18px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 .5px rgba(255,255,255,.4),0 10px 20px -10px rgba(0,0,0,.35);font:700 25px/1 var(--rounded)}
.hico.two{font-size:19px}
.hchips{position:absolute;right:16px;top:22px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.hchip{height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.38);font:600 12.5px/26px var(--font);white-space:nowrap}
.hero h2{position:absolute;left:20px;right:20px;bottom:46px;margin:0;font:700 31px/1.1 var(--display);letter-spacing:.2px;text-shadow:0 2px 14px rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.huser{position:absolute;left:20px;right:20px;bottom:19px;font:500 15px var(--font);color:rgba(255,255,255,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{margin-top:18px;border-radius:26px;padding:2px 0}

.kv .k{width:46px;flex:none;font:400 15px var(--font);color:var(--ink2)}
.kv .v{flex:1;min-width:0;font:400 17px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}
.kv .v.muted{color:var(--ink3)}
.kv .v.pw{font:500 16.5px var(--mono);letter-spacing:.3px}
.kv .v.pw.dots{font:700 15px var(--font);letter-spacing:2.5px}
.kv .v.link{color:var(--blue);text-decoration:none}
.kv.add-row{cursor:pointer}
.kv .addt{display:flex;align-items:center;gap:3px;color:var(--blue);font:600 14px var(--font);padding-right:8px;flex:none}
.info > .kv:first-child{border-radius:26px 26px 0 0}.info > .kv:last-child{border-radius:0 0 26px 26px}.info > .kv:only-child{border-radius:26px}
.str{flex:none;font:600 11.5px/1 var(--font);padding:4px 7px;border-radius:7px;color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent)}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--fill);flex:none;position:relative;z-index:2;transition:transform .5s var(--spring),background .2s}
.mini:active{transform:scale(.86);transition-duration:.12s}
.mini svg.i{width:18px;height:18px}
.cap2{padding:26px 6px 12px;font:600 15px var(--font);color:var(--ink2)}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{border-radius:26px;transition:transform .6s var(--spring),box-shadow .45s ease}
.tile.down{transform:scale(.985);transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.th{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:15px 16px;cursor:pointer;border-radius:26px;text-align:left;color:inherit}
.orb{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none;position:relative;background:linear-gradient(155deg,var(--t1),var(--t2));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.15),0 9px 18px -8px var(--t2);z-index:2}
.orb::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)}
.orb svg.i{width:25px;height:25px;stroke-width:2.1;position:relative}
.tile.opening .orb{animation:orb .7s var(--bouncy)}
@keyframes orb{0%{transform:scale(.82) rotate(-8deg)}100%{transform:none}}
.tile.empty .orb{filter:saturate(.35) brightness(1.05);opacity:.75}
.th .t{flex:1;min-width:0;position:relative;z-index:2}
.th .t b{display:block;font:600 17px/1.25 var(--font)}
.th .t > span{display:block;font:400 14px/1.3 var(--font);color:var(--ink2)}
.th .t em{font-style:normal;color:var(--sc,var(--ink2));font-weight:600}
.peekc{max-width:110px;overflow:hidden;white-space:nowrap;font:600 17px var(--rounded);letter-spacing:1.5px;color:var(--ink);filter:blur(5px);opacity:.75;transition:opacity .3s,filter .4s,max-width .6s var(--spring);position:relative;z-index:2;font-variant-numeric:tabular-nums;flex:none}
.tile.open .peekc{opacity:0;filter:blur(10px);max-width:0}
.tch{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink2);flex:none;transition:transform .7s var(--spring);position:relative;z-index:2}
.tch svg.i{width:16px;height:16px;stroke-width:2.6}
.tile.open .tch{transform:rotate(180deg)}
.tile.open{box-shadow:var(--gshadow),inset 0 1px 0 var(--hi),0 0 0 1px color-mix(in srgb,var(--t1) 34%,transparent),0 26px 56px -26px color-mix(in srgb,var(--t1) 70%,transparent)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .62s var(--spring)}
.fold > div{overflow:hidden;min-height:0}
.tile.open .fold{grid-template-rows:1fr}
.tin{padding:0 16px 18px;opacity:0;transform:translateY(-10px) scale(.97);filter:blur(6px);transition:opacity .22s ease,transform .6s var(--spring),filter .35s ease;position:relative;z-index:2}
.tile.open .tin{opacity:1;transform:none;filter:none;transition-delay:.06s}
.tile:not(.open) .tin{visibility:hidden;transition:opacity .22s ease,transform .6s var(--spring),filter .35s ease,visibility 0s .4s}
.tile.no-anim,.tile.no-anim *{transition:none !important;animation:none !important}
.slots{display:flex;align-items:center;gap:6px;cursor:pointer;outline-offset:4px}
.slot{flex:1;max-width:54px;height:62px;border-radius:15px;background:var(--well);box-shadow:inset 0 1px 3px rgba(0,0,0,.13),inset 0 0 0 .5px var(--sep),0 1px 0 var(--hi);position:relative;overflow:hidden}
.slot b{position:absolute;inset:0;display:grid;place-items:center;font:600 34px/1 var(--rounded);font-variant-numeric:tabular-nums;color:var(--ink)}
.slots .gap{width:8px;flex:none}
.slots.bad{cursor:default;color:var(--red);font-size:15px}
.slots.bump .slot{animation:bump .55s var(--bouncy) both;animation-delay:calc(var(--i) * 28ms)}
@keyframes bump{0%{transform:scale(.88)}100%{transform:none}}
.obar{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin-top:14px}
.obar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--t1),var(--cyan));transition:width .3s linear}
.otp.soon .obar i{background:linear-gradient(90deg,var(--orange),var(--red));animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.ometa{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font:400 13px var(--font);color:var(--ink2)}
.ometa b{font:600 13px var(--rounded);color:var(--ink);font-variant-numeric:tabular-nums}
.otp.soon .ometa b{color:var(--orange)}
.segs{display:grid;gap:4px;margin:0 0 14px}
.segs i{height:6px;border-radius:3px;background:var(--fill-2);transition:background .4s,box-shadow .4s}
.segs i.on{background:linear-gradient(90deg,var(--t1),var(--t2));box-shadow:0 0 9px -1px var(--t1)}
.bcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.bc{min-height:48px;border-radius:14px;background:var(--well);box-shadow:inset 0 0 0 .5px var(--sep),inset 0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;color:var(--ink);transition:color .3s,transform .5s var(--spring)}
.bc .val{flex:1;min-width:0;text-align:left;padding:8px 6px 8px 9px;font:500 15px var(--mono);letter-spacing:.2px;color:inherit;cursor:copy;border-radius:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc s{text-decoration:none;position:relative}
.bc s::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:1.6px;border-radius:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--soft)}
.bc.used{color:var(--ink3)}
.bc.used s::after{transform:scaleX(1)}
.ck{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--ink3);display:grid;place-items:center;color:#fff;flex:none;transition:background .3s,box-shadow .3s}
.ck svg.i{width:14px;height:14px;stroke-width:3.4;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s ease .08s}
.bc.used .ck{background:var(--green);box-shadow:0 4px 12px -4px var(--green)}
.bc.used .ck svg.i{stroke-dashoffset:0}
.bc.pop .ck{animation:pop .55s var(--bouncy)}
.tacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tnote{margin:10px 2px 0;font:400 13px var(--font);color:var(--ink2)}
.kr{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:52px}
.kr + .kr{border-top:.5px solid var(--sep)}
.kr .k{width:92px;flex:none;font:400 14px var(--font);color:var(--ink2);word-break:break-word}
.kr .v{flex:1;min-width:0;font:500 15px var(--mono);filter:blur(6px);opacity:.8;transition:filter .5s ease,opacity .5s;cursor:pointer;white-space:pre-wrap;word-break:break-all;user-select:none}
.kr.shown .v{filter:none;opacity:1;user-select:text}
.kr .rv{font:600 12px var(--font);color:var(--t2);padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--t1) 16%,transparent);transition:opacity .3s;cursor:pointer;flex:none}
.kr.shown .rv{display:none}
.note{margin:0;font:400 15px/1.65 var(--font);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.tempty{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 14px var(--font);color:var(--ink2)}
.tempty .btn{flex:none}
.callout{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:11px 13px;border-radius:16px;font-size:14px;margin:0 0 14px}
.callout svg.i{margin-top:1px}
.callout.warn{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
.callout.danger{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.callout.info{background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue)}
.callout .grow{flex:1;min-width:180px}
.callout .btn{flex:none;align-self:center}
.danger-zone{margin:22px 0 0}
.danger-zone .lrow{min-height:54px;gap:12px;color:var(--blue)}
.danger-zone .lrow.danger{color:var(--red)}
.danger-zone .lrow .t{font:500 16px var(--font)}
.d-foot{font-size:12.5px;color:var(--ink2);margin:18px 0 0;text-align:center}
.wide-only{display:revert}
/* 宽屏右边没选账号时：概览 */
.ov{padding-top:20px}
.ov-hero{padding:6px 6px 8px}
.ov-hero h2{margin:0 0 6px;font:700 30px var(--display)}
.ov-hero p{margin:0;color:var(--ink2)}
.ov-card{margin-top:16px;border-radius:26px;padding:18px 20px}

.ov-card h3 .sp{flex:1}

.ov-card p{margin:0;color:var(--ink2);font-size:14px}

/* ───── 对话框：玻璃面板（手机上从底部弹出） ───── */
dialog{border:0;padding:0;border-radius:30px;background:transparent;color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.55),0 0 0 .5px var(--rim-b)}
dialog::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--sheet);-webkit-backdrop-filter:blur(44px) saturate(180%);backdrop-filter:blur(44px) saturate(180%)}
dialog.sm{width:min(430px,calc(100vw - 32px))}
dialog::backdrop{background:var(--backdrop);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]{animation:sheet-in .55s var(--spring)}
@keyframes sheet-in{from{opacity:0;transform:translateY(18px) scale(.96)}}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 48px);position:relative}
.dlg-h{display:flex;align-items:center;gap:10px;padding:20px 16px 8px 24px}

.dlg-h .icon-btn{background:var(--fill);color:var(--ink2)}
.dlg-b{padding:6px 24px 16px;overflow:auto}
.dlg-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 24px 20px}
.dlg-f .left{margin-right:auto}
.confirm-msg{margin:0 0 8px;color:var(--ink2);white-space:pre-line;font-size:15px}
.dlg:focus{outline:none}
.sec{background:var(--card);border-radius:22px;padding:14px 16px;margin:0 0 12px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-bottom:10px}
.sec-h h4{margin:0;font:600 15px var(--font);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sec-h .count{white-space:nowrap}

.sec-h .spacer{flex:1}
.sec-h .count{font-size:12.5px;color:var(--ink2)}
.sec-h .sec-close{margin:-6px -8px -6px 0}
.sec > .field:last-child{margin-bottom:0}
.parse-note{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--green);margin-top:8px}
.fld-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.fld-row .textarea{min-height:46px;resize:vertical}
.fld-row .fld-warn{grid-column:1 / -1;margin:-2px 0 0;min-height:0}
.fld-row .fld-warn:empty{display:none}
.capture-review{margin-top:8px;font-size:13px;color:var(--ink2)}
.capture-review summary{cursor:pointer;color:var(--ink2)}

.capture-review .linkish{margin-left:8px}
.capture-review pre{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono)}
.quick-add{display:flex;flex-wrap:wrap;gap:6px}
.more-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px;font-size:13px;color:var(--ink2)}
.more-bar .chip{height:32px;font-size:13px;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
.fav-field{justify-content:flex-end}
.fav-field .check{margin:0 0 10px}
.row>.group-close{flex:none;align-self:flex-end;margin-bottom:18px}
.combo{position:relative;display:block;min-width:0}
.combo>.input{padding-right:40px}
.combo-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.combo-list{position:fixed;z-index:20;margin:0;padding:6px;overflow:auto;background:var(--glass-2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:18px;box-shadow:0 24px 50px -20px rgba(0,0,0,.45),0 0 0 .5px var(--rim-b)}
.combo-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-opt:hover,.combo-opt.active{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.combo-opt.current{font-weight:650}
.combo-opt svg.i{color:var(--blue)}
.combo-sp{display:inline-block;width:13px;flex:none}
.textarea.drop-ready{box-shadow:inset 0 0 0 2px var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
body.dropping::after{content:'松开鼠标，自动识别文件里的备用码';position:fixed;inset:14px;border:2px dashed var(--blue);border-radius:30px;background:color-mix(in srgb,var(--base) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--blue);display:grid;place-items:center;font-size:19px;font-weight:650;z-index:2147483646;pointer-events:none}
.add-codes{margin:0}
.totp-preview{font-size:13px;margin-top:8px;color:var(--ink2)}
.totp-preview b{font-family:var(--mono);font-size:15px;color:var(--green);letter-spacing:.05em}
.totp-preview.bad{color:var(--red)}
details.adv{margin-top:10px;font-size:13.5px}
details.adv summary{cursor:pointer;color:var(--ink2);width:max-content}
details.adv .row{margin-top:8px}
.set-group{background:var(--card);border-radius:22px;padding:2px 16px;margin:0 0 16px}
.set-title{font:600 13px var(--font);color:var(--ink2);margin:6px 6px 8px;display:flex;align-items:center;gap:6px}
.set-title svg.i{width:15px;height:15px}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;min-height:56px}
.set-row + .set-row{border-top:.5px solid var(--sep)}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-weight:600;font-size:15px}
.set-row .t span{font-size:13px;color:var(--ink2);word-break:break-all}
.set-row .select{width:auto;min-width:120px;min-height:38px;padding:6px 10px}
.set-help{padding:12px 0 14px}
.about{font-size:13px;color:var(--ink2);line-height:1.7}
.help h5{font-size:14.5px;margin:16px 0 4px;color:var(--ink)}
.help p{margin:0;color:var(--ink2);font-size:14px}
.sec .help h5:first-child{margin-top:0}
/* 同步 / 扫码 */
.filters[role="tablist"]{padding:0 0 14px;overflow:visible;flex-wrap:wrap}
.filters[role="tablist"] .chip{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.filters[role="tablist"] .chip[aria-pressed="true"]{background:var(--ink);color:var(--base)}
.sync-qr{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 8px}
.sync-qr canvas{width:min(340px,78vw,52vh);height:auto;aspect-ratio:1;image-rendering:pixelated;background:#fff;border-radius:22px;padding:10px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35),0 0 0 .5px var(--sep)}
.sync-qr .frames{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sync-qr .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:260px}
.sync-qr .dots i{width:7px;height:7px;border-radius:50%;background:var(--fill-2);transition:background .2s,transform .3s var(--spring)}
.sync-qr .dots i.on{background:var(--blue);transform:scale(1.3)}
.sync-steps{margin:0 0 4px;padding-left:20px;color:var(--ink2);font-size:14px}
.sync-steps li{margin:4px 0}
.sync-alt{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.scan-box{position:relative;width:100%;aspect-ratio:4/3;max-height:58vh;background:#000;border-radius:22px;overflow:hidden;display:grid;place-items:center}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-box video.mirror{transform:scaleX(-1)}
.scan-box .aim{position:absolute;inset:12% 18%;border:2.5px solid rgba(255,255,255,.92);border-radius:24px;box-shadow:0 0 0 999px rgba(0,0,0,.3);pointer-events:none;animation:aim 2.4s ease-in-out infinite}
@keyframes aim{50%{transform:scale(.97)}}
.scan-box .scan-msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#fff;font-size:13.5px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.scan-box .scan-err{color:#fff;padding:24px;text-align:center;font-size:14px;line-height:1.6}
.scan-status{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:13.5px;color:var(--ink2);min-height:22px}
.progress{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .25s}
.scan-status .progress{flex:1;margin:0}
.sync-show{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.sync-show.with-recv .sync-qr canvas{width:min(280px,78vw,46vh)}
.recv{flex:1 1 220px;max-width:280px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.recv-h{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--ink2)}
.recv .scan-status{margin:2px 0 0;font-size:13px;flex-wrap:wrap;row-gap:6px}
.recv .scan-status .progress{flex:1 1 100%}
.scan-box.compact{border-radius:18px}
.scan-box.compact .aim{inset:8% 12%;border-radius:16px}
.scan-box.compact .scan-msg{font-size:12.5px;bottom:6px}
.scan-box.compact .scan-err{font-size:13px;padding:14px;line-height:1.5}
.sync-done{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);border-radius:16px;padding:11px 14px;margin:0 0 12px;font-size:14px;font-weight:600}
.sync-done .grow{flex:1;min-width:160px}
.sync-qr.flip canvas{width:min(84vw,52vh,400px)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fill);color:var(--ink2);white-space:nowrap}
/* 安全检查、生成密码、历史密码、导入 */
.sc-top{display:flex;align-items:center;gap:18px;margin:0 0 16px}
.sc-top > svg{width:110px;height:110px;flex:none;transform:rotate(-90deg);overflow:visible}
.sc-top circle{fill:none;stroke-width:10;stroke-linecap:round}
.sc-top .tr{opacity:.2}
.sc-sec{margin:0 0 16px}
.sc-h{display:flex;flex-direction:column;margin:0 6px 8px}
.sc-h b{font:600 16px var(--font)}
.sc-h span{font-size:13px;color:var(--ink2)}
.sc-sec .list{margin:0;background:var(--card)}
.sc-group{padding:8px 16px 2px;font:600 12.5px var(--font);color:var(--ink2)}
.sc-ok{text-align:center;padding:18px 0 6px}
.sc-ok .art{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(155deg,#5fe07f,#1fb24a);box-shadow:0 14px 30px -12px rgba(30,180,80,.8)}
.sc-ok .art svg.i{width:36px;height:36px;stroke-width:3}
.gen-out{font:600 22px/1.35 var(--mono);text-align:center;word-break:break-all;padding:18px 14px;border-radius:20px;background:var(--card);min-height:76px;display:grid;place-items:center;letter-spacing:.5px}
.gen-out .d{color:var(--blue)}.gen-out .s{color:var(--orange)}
.gen-len{display:flex;align-items:center;gap:12px;margin:16px 4px 6px}
.gen-len input{flex:1;accent-color:var(--blue)}
.gen-len b{font:600 16px var(--rounded);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.gen-opts .set-row{min-height:48px;padding:8px 0}
.ph-row{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.ph-row + .ph-row{border-top:.5px solid var(--sep)}
.ph-row .t{flex:1;min-width:0}
.ph-row .t b{display:block;font:500 15.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-row .t b.dots{font:700 14px var(--font);letter-spacing:2.5px}
.ph-row .t span{font-size:12.5px;color:var(--ink2)}

/* ───── 提示：从屏幕顶部长出来的黑色胶囊（像灵动岛） ───── */
/* 放在顶栏按钮下面：带「撤销」的提示绝不能压住返回、扫一扫这些按钮，免得点错 */
#toasts{position:fixed;inset:calc(env(safe-area-inset-top) + 64px) auto auto 50%;transform:translateX(-50%);margin:0;padding:0;border:0;background:transparent;overflow:visible;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
#toasts:not(:popover-open){display:none}
/* 提示不挡点击：手指照样能点到下面的返回、锁定等按钮；只有提示里的按钮（撤销、标记为已用）能点 */
.toast{pointer-events:none;display:flex;align-items:center;gap:11px;background:#000;color:#fff;padding:9px 16px 9px 9px;min-height:50px;border-radius:26px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.12);font-size:14.5px;max-width:100%;transform-origin:50% 0;animation:island-in .7s var(--bouncy)}
.toast.quiet{padding-left:16px}
.toast .tk{width:32px;height:32px;border-radius:50%;background:#30d158;display:grid;place-items:center;flex:none;box-shadow:0 0 16px -2px rgba(48,209,88,.75)}
.toast .tk svg.i{width:17px;height:17px;stroke:#fff;stroke-width:3.2;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .42s .28s ease forwards}
.toast.error .tk{background:#ff453a;box-shadow:0 0 16px -2px rgba(255,69,58,.75)}
.toast.error .tk svg.i{stroke-dasharray:none;stroke-dashoffset:0;animation:none;stroke-width:2.6}
.toast .tt{min-width:0;display:flex;flex-direction:column;animation:tt-in .5s .12s both}
.toast .tt span{font-weight:600;line-height:1.3}
.toast .tt small{font-size:12.5px;color:rgba(235,235,245,.62);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .ico{box-shadow:none}
.toast button{pointer-events:auto;background:rgba(255,255,255,.16);border:0;color:#fff;font-weight:650;padding:7px 12px;border-radius:999px;white-space:nowrap;flex:none;margin-left:4px;transition:background .2s}
.toast.out{animation:island-out .32s ease-in forwards}
@keyframes island-in{from{opacity:0;transform:scale(.4,.55) translateY(-14px);filter:blur(6px)}}
@keyframes island-out{to{opacity:0;transform:scale(.5,.6) translateY(-10px);filter:blur(4px)}}
@keyframes tt-in{from{opacity:0;filter:blur(6px)}}

@media (hover:hover){
  .btn:hover{background:var(--fill-2)}
  .btn.primary:hover{background:linear-gradient(180deg,#4a9dff,#1b74ff)}
  .btn.danger:hover{background:color-mix(in srgb,var(--red) 18%,transparent)}
  .btn.ghost:hover{background:var(--fill)}
  .icon-btn:hover{background:var(--fill);color:var(--ink)}
  .icon-btn.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
  .gb:hover,.circ:hover{background:var(--fill)}
  .kv.add-row:hover{background:var(--fill)}
  .mini:hover{background:var(--fill-2)}
  .bc .val:hover{color:var(--blue)}
  .ck:hover{box-shadow:inset 0 0 0 1.6px var(--green)}
  .combo-btn:hover{background:var(--fill)}
  .toast button:hover{background:rgba(255,255,255,.26)}
  .lrow:hover{background:var(--fill)}
}
/* 打开 / 关闭账号时在两页之间飞行的卡片 */
.flyer{position:fixed;z-index:5;overflow:hidden;pointer-events:none;will-change:left,top,width,height}
.flyer > *{position:absolute;left:0;top:0;margin:0 !important}
.flyer .fbg{inset:0;width:auto;height:auto}
.flyer .fglass{inset:0;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}

/* ───── 窄屏（手机）：一次显示一页 ───── */
.back-btn{display:none !important}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side,.main{grid-area:1 / 1}
  .side{box-shadow:none}
  .main{visibility:hidden}
  .shell.has-detail .main{visibility:visible}
  .shell.has-detail .side{visibility:hidden}
  .shell.morphing .side,.shell.morphing .main{visibility:visible}
  .back-btn{display:grid !important}
  .detail{padding:0 16px}
}
@media (min-width:900px){
  .main .scroller{padding-top:calc(env(safe-area-inset-top) + 72px)}
  .hero{height:236px}
  .bbar.min .search{flex-grow:1;padding:0 19px}
  .bbar.min .search input{opacity:1}
}
@media (max-width:600px){
  dialog,dialog.sm{width:100%;max-width:100%;margin:auto 0 0;border-radius:30px 30px 0 0;max-height:calc(100dvh - env(safe-area-inset-top) - 10px)}
  dialog[open]{animation:sheet-up .6s var(--spring)}
  @keyframes sheet-up{from{transform:translateY(100%)}}
  .dlg{max-height:calc(100dvh - env(safe-area-inset-top) - 10px)}
  .dlg::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--fill-2)}
  .dlg-h{padding:22px 14px 8px 20px}
  .dlg-b{padding:4px 16px 12px}
  .dlg-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .dlg-f .btn{flex:1 1 auto}
  .dlg .row{flex-wrap:wrap}
  .dlg .row>.field{flex:1 1 220px}
  .set-row{flex-wrap:wrap;gap:8px 14px}
  .fld-row{grid-template-columns:1fr auto}
  .fld-row .textarea{grid-column:1 / -1;grid-row:2}
  .kr .k{width:76px}
}
/* 触屏：输入框用 16px 字号（否则 iPhone 一点输入框就自动放大页面） */
@media (pointer:coarse){
  .input,.textarea,.select,.search input{font-size:17px}
  .btn{height:46px}
  .btn.sm{height:36px}
  .ck{width:32px;height:32px}
}
body.privacy #app,body.privacy dialog{filter:blur(18px);opacity:.2}

/* ───── 打印 ───── */
#print-area{display:none}
@media print{
  body{background:#fff !important;color:#000}
  body>*:not(#print-area){display:none !important}
  #print-area{display:block;color:#000;font:11pt/1.5 var(--font)}
  #print-area h1{font-size:16pt;margin:0}
  .p-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:14px}
  .p-entry{break-inside:avoid;border:1px solid #888;border-radius:8px;padding:10px 14px;margin:0 0 12px}
  .p-entry h2{font-size:13pt;margin:0 0 6px}
  .p-entry h2 small{font-weight:400;font-size:10.5pt;color:#333}
  .p-entry h3{font-size:10pt;margin:10px 0 4px;color:#333}
  .p-codes{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 28px;margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12pt}
  .p-codes li.used{text-decoration:line-through;color:#777}
  .p-codes .box{display:inline-block;width:1.4em;font-family:var(--font)}
  .p-kv{border-collapse:collapse;width:100%}
  .p-kv td{border-top:1px solid #ccc;padding:3px 6px;vertical-align:top}
  .p-kv td:first-child{width:32%;color:#333}
  .p-kv td:last-child{font-family:var(--mono);word-break:break-all}
  .p-mono{font-family:var(--mono);word-break:break-all}
  .p-note{white-space:pre-wrap}
  .p-foot{margin-top:16px;font-size:9pt;color:#555}
}
@media (prefers-reduced-motion:reduce){
  #aurora i,.wsheen,.emf{animation:none !important}
  *,*::before,*::after{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important;transition-delay:0s !important}
}

  const t = h('div', { class: 'toast' + (err ? ' error' : '') + (lead ? '' : ' quiet'), role: err ? 'alert' : 'status' },
    lead, h('div', { class: 'tt' }, h('span', null, msg), opts.sub ? h('small', null, opts.sub) : null));
  let timer = 0;

    clearTimeout(timer);

  };
  if (opts.action) t.append(h('button', { type: 'button', onclick: () => { dismiss(); opts.action.run(); } }, opts.action.label));
  box.append(t);

  const close = () => { if (dlg.open) dlg.close(); finalize(); };
  dlg._close = close;

  let busyFlag = false;

function pwField(props = {}) {
  const input = h('input', { class: 'input', type: 'password', spellcheck: 'false', autocapitalize: 'off', ...props });
  const btn = h('button', { type: 'button', class: 'icon-btn sm', title: '显示密码', 'aria-label': '显示密码' }, icon('eyeOff'));

    btn.title = show ? '隐藏密码' : '显示密码';

}
function pwScore(p) {
  if (!p) return 0;
  let pool = 0;
  if (/[a-z]/.test(p)) pool += 26;
  if (/[A-Z]/.test(p)) pool += 26;
  if (/\d/.test(p)) pool += 10;
  if (/[^\w\u0080-￿]/.test(p)) pool += 33;
  if (/[^\x00-\x7f]/.test(p)) pool += 2000;
  const chars = Array.from(p);
  let bits = chars.length * Math.log2(Math.max(pool, 2));
  if (new Set(chars).size <= 2) bits = Math.min(bits, 10);
  if (/^(?:12345|password|qwerty|11111|abc123|admin|iloveyou|woaini|00000|88888)/i.test(p)) bits = Math.min(bits, 20);
  return bits < 36 ? 1 : bits < 56 ? 2 : bits < 76 ? 3 : 4;
}
function strengthMeter(input) {

  const el = h('div', { class: 'meter' }, h('div', { class: 'bar' }, bar), txt);
  const LABELS = ['', '弱', '一般', '较强', '很强'];
  const COLORS = ['', 'var(--danger)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
  const upd = () => {

    bar.style.width = s * 25 + '%';

}
