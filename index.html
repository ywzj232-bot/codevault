  }
  return new Promise(resolve => {
    // iPhone 会把不认识的扩展名（.vault）变成灰色不让选，所以在 iPhone 上不限制类型，读进来再校验
    const input = h('input', { type: 'file', accept: IS_IOS ? null : '.vault,.json,application/json', style: { display: 'none' } });
    input.addEventListener('change', async () => { const f = input.files[0]; input.remove(); resolve(f ? await f.text() : null); });
    input.addEventListener('cancel', () => { input.remove(); resolve(null); });
    topHost().append(input);
    input.click();
  });
}

// 从备份恢复到浏览器存储：先用密码把备份完整解开、校验通过，才会替换现有数据
async function restoreLocalFromBackup() {
  const text = await pickTextFile();
  if (text == null) return;
  let file;
  try { file = parseFile(text); await checkIntegrity(file); }
  catch (e) { toast(e.message + `。${LOCAL_WHERE}里现有的数据没有改动。`, { type: 'error', duration: 7000 }); return; }
  let res = null;
  while (!res) {
    const pw = await promptPassword({
      title: '验证备份文件',
      message: '请输入这个备份的主密码。只有完整解开、校验通过后才会恢复，在此之前' + LOCAL_WHERE + '里现有的数据不会被改动。' + (file.hint ? `\n密码提示：${str(file.hint)}` : ''),
      okText: '验证',
    });
    if (pw == null) return;
    try { res = await unseal(text, pw); }
    catch (e) {
      if (e.code === 'BAD_PASSWORD') { toast(e.message + '，请重试', { type: 'error', duration: 5000 }); continue; }
      toast(e.message + `。${LOCAL_WHERE}里现有的数据没有改动。`, { type: 'error', duration: 7000 });
      return;
    }
  }
  const n = res.vault.entries.length;
  if (hasLocalVault()) {
    const ok = await confirmDialog({ title: `用备份替换${LOCAL_WHERE}里的数据？`, message: `备份验证通过，里面有 ${n} 个条目。\n${LOCAL_WHERE}里现有的保险箱将被它替换，且无法撤销。`, ok: '替换', danger: true });
    if (!ok) return;
  }
  const store = localStore();
  try { await store.write(text); }
  catch (e) { toast('恢复失败：' + e.message, { type: 'error', duration: 6000 }); return; }
  askPersist();
  await clearStash(store);
  await enterVault(store, res);
  toast(`已从备份恢复 ${n} 个条目`);
}

async function resetLocal() {
  const ok = await confirmDialog({ title: `删除${LOCAL_WHERE}中的保险箱？`, message: `这会永久删除保存在${THIS_LOCAL}中的全部加密数据，无法恢复。\n如果你有备份文件，之后可以从备份恢复。`, ok: '永久删除', danger: true });
  if (!ok) return;
  try { localStorage.removeItem(LS_VAULT); } catch {}
  clearBio();
  await clearStash(localStore());
  const hd = await rememberedHandle();
  if (hd) { S.store = fileStore(hd); renderLock(); } else renderWelcome();
}

/* ---------------- 锁定时的加密暂存 ---------------- */
// 锁定时若还有没写进去的修改，或编辑框里有没提交的内容，就用当前密钥加密后暂存在浏览器里，解锁后再询问是否恢复。
async function stashMatches(rec, store) {
  if (!rec || typeof rec.text !== 'string' || !store || rec.kind !== store.kind) return false;
  if (store.kind === 'local') return true;
  try { return !!rec.handle && typeof rec.handle.isSameEntry === 'function' && await rec.handle.isSameEntry(store.handle); } catch { return false; }
}
async function stashList() {
  try { const v = await idbGet(STASH_KEY); return Array.isArray(v) ? v : []; } catch { return null; }
}
async function writeStash({ vault, draft }) {
  const store = S.store;
  const at = Date.now();
  const text = await seal({ kind: 'stash', at, vault: vault || null, draft: draft || null }, S.key, S.header);
  const rec = { text, at, kind: store.kind, name: store.name, handle: store.kind === 'file' ? store.handle : null };
  S.memStash = { ...rec, persisted: false };
  try {
    const list = await stashList();
    if (!list) throw new Error('无法读取浏览器存储');
    const keep = [];
    for (const r of list) if (!(await stashMatches(r, store))) keep.push(r);
    keep.push(rec);
    await idbSet(STASH_KEY, keep.slice(-5));
    S.memStash.persisted = true;
  } catch (e) { console.warn('暂存没能写入浏览器存储，只保留在本页内存中', e); }
  return S.memStash;
}
async function findStash(store) {
  if (await stashMatches(S.memStash, store)) return S.memStash;
  for (const r of (await stashList()) || []) if (await stashMatches(r, store)) return r;
  return null;
}
async function clearStash(store) {
  if (await stashMatches(S.memStash, store)) S.memStash = null;
  try {
    const list = await stashList();
    if (!list || !list.length) return;
    const keep = [];
    for (const r of list) if (!(await stashMatches(r, store))) keep.push(r);
    if (keep.length !== list.length) await idbSet(STASH_KEY, keep);
  } catch {}
}

async function enterVault(store, res, password, readOnly = false) {
  await playUnlock();
  Object.assign(S, { store, key: res.key, header: res.header, vault: res.vault, ui: freshUI(), dirty: false, lastActivity: Date.now(), pendingStashClear: false, pendingStashStore: null, readOnly: !!readOnly });
  S.revealed.clear();
  if (store.kind === 'file') { try { await idbSet('handle', store.handle); } catch {} }
  setLastStore(store.kind);
  renderMain();
  if (S.readOnly) showReadOnlyBanner('只读打开');
  if (password != null) {
    try { await processStash(store, password, res); } catch (e) { console.error('处理暂存内容失败', e); }
  }
}

async function processStash(store, password, res) {
  const rec = await findStash(store);
  if (!rec || !S.key) return;
  let payload;
  try {
    const file = parseFile(rec.text);
    const key = file.kdf.salt === res.header.kdf.salt ? res.key : await deriveKey(password, b64d(file.kdf.salt), file.kdf.iterations);
    payload = await decryptRaw(file, key);
  } catch {
    if (!S.key || S.locking) return;
    const drop = await confirmDialog({ title: '有一份暂存内容打不开', message: `${fmtDate(rec.at, true)} 锁定时暂存了没保存的内容，但用现在的主密码解不开（可能主密码在别处改过）。\n先保留的话，以后用当时的主密码解锁时会再次询问。`, ok: '丢弃它', cancel: '先保留', danger: true });
    if (drop && S.key && !S.locking) await clearStash(store);
    return;
  }
  if (!S.key || S.locking) return;
  const sv = payload && payload.vault ? normalizeVault(payload.vault) : null;
  const draft = payload && payload.draft && typeof payload.draft === 'object' ? payload.draft : null;
  let restoring = false;
  if (sv && JSON.stringify(sv) !== JSON.stringify(S.vault)) {
    const where = store.kind === 'file' ? '保险箱文件' : IS_TOUCH ? '本机存储' : '浏览器存储';
    const ok = await confirmDialog({
      title: '恢复锁定前没保存的修改？',
      message: `${fmtDate(rec.at, true)} 锁定时，有修改没能写入${where}，已经加密暂存在${THIS_LOCAL}里。\n\n· 恢复修改：用暂存的内容替换现在的内容，并重新保存（${where}里在那之后的改动会被覆盖）\n· 丢弃：保留${where}里现在的内容`
        + (S.readOnly ? '\n\n当前是只读打开：恢复后可以查看，要保存下来请「另存为」新文件或允许写入。' : ''),
      ok: '恢复修改', cancel: '丢弃', dismissable: false,
    });
    if (!S.key || S.locking) return;  // 等待回答时又被锁定了：暂存原样保留
    if (ok) {
      S.vault = sv; S.ui = freshUI(); S.pendingStashClear = true; S.pendingStashStore = store; restoring = true;
      renderMain(); markDirty();
      if (S.readOnly) showReadOnlyBanner('已恢复暂存的修改（只读打开）');
      toast(S.readOnly ? '已恢复锁定前的修改；只读打开，需要另存为才能保存' : '已恢复锁定前的修改，正在保存');
    }
  }
  if (draft && draft.kind === 'replace-codes') {
    const dest = findEntry(draft.entryId);
    if (dest && entryIdentity(dest) === entryIdentity(draft) && Array.isArray(draft.baseCodes)) {
      replaceCodes(dest, null, null, { draft: str(draft.codes), base: draft.baseCodes, review: draft.codeReview });
    } else {
      openEditor(null, { service: str(draft.service), account: str(draft.account), codes: str(draft.codes), codeReview: draft.codeReview });
      toast('原换码目标已变，草稿按新条目打开，不会覆盖已有账号。');
    }
  } else if (draft) openEditor(draft.entryId ? findEntry(draft.entryId) : null, draft);
  if (!restoring) await clearStash(store);  // 恢复了修改的话，等保存成功后再删
}

/* ---------------- 面容 ID / 指纹解锁（WebAuthn 通行密钥的 PRF 扩展） ---------------- */
// 开启时在这台设备的系统钥匙串里建一个通行密钥（受面容 ID 保护），用它的 PRF 输出派生一把钥匙，把主密码加密后存在本机。
// 解锁时看一下手机，系统给出同样的 PRF 输出，解开主密码，再照常解锁。不联网；主密码仍然有效。
// 这份加密的主密码绑定当时的盐：主密码一改就自动作废（本次是用面容 ID 解锁的，则改密码时直接用新密码重新加密）。
const LS_BIO = 'codevault.bio.v1', LS_BIO_UID = 'codevault.bio.uid';
const BIO_NAME = IS_IOS ? '面容 ID ' : IS_TOUCH ? '指纹或面部识别' : ' Windows Hello ';  // 英文名两边留空格，放进中文句子里好看
let bioAvailable = false;  // 启动时检测：这台设备能不能用
async function detectBio() {
  try {
    if (!IS_WEB || !window.PublicKeyCredential || typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== 'function') return;
    if (!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return;
    if (typeof PublicKeyCredential.getClientCapabilities === 'function') {
      const caps = await PublicKeyCredential.getClientCapabilities().catch(() => null);
      if (caps && caps['extension:prf'] === false) return;
    }
    bioAvailable = true;
  } catch {}
}
function bioRecord() {
  try {
    const r = JSON.parse(localStorage.getItem(LS_BIO) || 'null');
    return r && r.v === 1 && r.credId && r.prfSalt && r.iv && r.ct && r.vaultSalt ? r : null;
  } catch { return null; }
}
function clearBio() { try { localStorage.removeItem(LS_BIO); } catch {} S.bio = null; }
function localVaultSalt() { try { const o = JSON.parse(localStorage.getItem(LS_VAULT) || 'null'); return (o && o.kdf && o.kdf.salt) || ''; } catch { return ''; } }
// 只用于本机存储的保险箱（手机），而且记录必须对应现在这个保险箱（同一个盐）
function bioUsable(store) {
  const r = bioRecord();
  return !!(r && IS_WEB && window.PublicKeyCredential && store && store.kind === 'local' && r.vaultSalt === localVaultSalt());
}
async function bioWrapKey(prfOut) {
  const ikm = await crypto.subtle.importKey('raw', prfOut, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: enc.encode('codevault bio unlock v1') }, ikm, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const bioAad = vaultSalt => enc.encode('codevault-bio-v1|' + vaultSalt);
async function bioSave(credId, prfSalt, key, password) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: bioAad(S.header.kdf.salt) }, key, enc.encode(password)));
  localStorage.setItem(LS_BIO, JSON.stringify({ v: 1, credId, prfSalt, iv: b64e(iv), ct: b64e(ct), vaultSalt: S.header.kdf.salt, at: Date.now() }));
  S.bio = { credId, prfSalt, key };
}
async function bioOpen(rec, prfOut) {
  const key = await bioWrapKey(prfOut);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(rec.iv), additionalData: bioAad(rec.vaultSalt) }, key, b64d(rec.ct));
  return { password: dec.decode(pt), key };
}
function bioPrf(cred) {
  try { const r = cred.getClientExtensionResults(); return r && r.prf && r.prf.results && r.prf.results.first ? new Uint8Array(r.prf.results.first) : null; } catch { return null; }
}
const noPrf = () => Object.assign(new Error('NOPRF'), { code: 'NOPRF' });
// 下面两个调用必须在点击的当下发起（iPhone 要求有用户操作），之前不能先 await 别的
function bioGet(credId, prfSalt) {
  return navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname, timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: b64d(credId) }],
    extensions: { prf: { eval: { first: b64d(prfSalt) } } },
  } });
}
function bioCreate(prfSalt) {
  let uid = null;  // 固定的用户号：重新开启时替换同一个通行密钥，而不是越积越多
  try { uid = localStorage.getItem(LS_BIO_UID); } catch {}
  if (!uid) { uid = b64e(crypto.getRandomValues(new Uint8Array(16))); try { localStorage.setItem(LS_BIO_UID, uid); } catch {} }
  return navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { id: location.hostname, name: APP_NAME },
    user: { id: b64d(uid), name: APP_NAME, displayName: `${APP_NAME}（本机解锁）` },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
    attestation: 'none', timeout: 60000,
    extensions: { prf: { eval: { first: b64d(prfSalt) } } },
  } });
}
function bioError(e) {
  const n = e && e.name;
  if (e && e.code === 'NOPRF') return `这台设备的${BIO_NAME}暂时不能用来解锁保险箱` + (IS_IOS ? '（需要 iOS 18 或更新的系统）。刚才建的通行密钥没有用，可以在「密码」App 里删掉。' : '。');
  if (n === 'NotAllowedError' || n === 'AbortError') return `没有完成${BIO_NAME}验证（取消了或超时了），可以再试一次`;
  if (n === 'SecurityError') return `这个网址不能使用${BIO_NAME}`;
  if (n === 'NotSupportedError') return `这台设备不支持${BIO_NAME}解锁`;
  return (`${BIO_NAME}出错了：` + ((e && e.message) || n || '未知错误')).trim();
}
// 开启：先验证主密码（不让输错密码的人建出没用的通行密钥），再点一下建通行密钥；有的系统建的时候不给结果，就再点一下验证一次
function enableBio(onDone) {
  if (!S.key || S.locking || S.store.kind !== 'local') return;
  const session = S.key, look = DEVICE_NAME === '电脑' ? '' : '，看一下手机';
  const pw = pwField({ autocomplete: 'current-password', placeholder: '主密码' });
  const text = h('p', { class: 'confirm-msg' }, `先输入一次主密码，确认是你本人。开启后这台设备解锁时看一下就行；主密码仍然有效，请继续记牢。`);
  const field = h('div', { class: 'field' }, pw.el);
  const err = h('p', { class: 'err', role: 'alert' });
  const next = h('button', { type: 'submit', class: 'btn primary' }, '下一步');
  let stage = 'pw', password = '', prfSalt = '', credId = '', working = false;
  const label = () => next.replaceChildren(...(stage === 'pw' ? ['下一步'] : [icon('faceId', 'sm'), stage === 'get' ? '完成' : '开启']));
  const finish = async out => {
    const key = await bioWrapKey(out);
    if (S.key !== session || S.locking) return;
    await bioSave(credId, prfSalt, key, password);
    password = '';
    close();
    toast(`已开启${BIO_NAME}解锁。下次解锁时点「用${BIO_NAME}解锁」就行`, { duration: 6000 });
    if (onDone) onDone();
  };
  const { close } = openDialog({
    title: `开启${BIO_NAME}解锁`, size: 'sm', form: true,
    body: [text, field, err],
    footer: [h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消'), next],
    onClose: () => { password = ''; },
    onSubmit: () => {
      if (working || stage === 'off') return;
      err.textContent = '';
      if (stage === 'pw') {
        const p = pw.input.value;
        if (!p) { pw.input.focus(); return; }
        working = true; busy(next, true, '正在验证…');
        (async () => {
          try {
            const k = await deriveKey(p, b64d(S.header.kdf.salt), S.header.kdf.iterations);
            await decryptRaw(parseFile(await seal({ probe: 1 }, S.key, S.header)), k);
            if (S.key !== session) return;
            password = p; stage = 'create'; field.hidden = true;
            text.textContent = `主密码正确。点「开启」${look}，完成${BIO_NAME}验证。`;
          } catch {
            if (S.key !== session) return;
            err.textContent = '主密码不正确'; pw.input.select();
          } finally { working = false; busy(next, false); label(); }
        })();
        return;
      }
      prfSalt = prfSalt || b64e(crypto.getRandomValues(new Uint8Array(32)));
      let job;
      try { job = stage === 'create' ? bioCreate(prfSalt) : bioGet(credId, prfSalt); }  // 必须同步发起
      catch (e) { err.textContent = bioError(e); return; }
      working = true; busy(next, true, '等待验证…');
      job.then(async cred => {
        if (!cred) throw Object.assign(new Error('没有拿到凭据'), { name: 'NotAllowedError' });
        if (stage === 'create') {
          credId = b64e(new Uint8Array(cred.rawId));
          const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
          if (!ext.prf || ext.prf.enabled === false) throw noPrf();
          const out = bioPrf(cred);
          if (out) { await finish(out); return; }
          stage = 'get';
          text.textContent = `还差一步：点「完成」${look}，再验证一次。`;
          return;
        }
        const out = bioPrf(cred);
        if (!out) throw noPrf();
        await finish(out);
      }).catch(e => {
        if (S.key !== session) return;
        err.textContent = bioError(e);
        if (e && e.code === 'NOPRF') stage = 'off';
      }).finally(() => {
        working = false;
        if (next.isConnected) { busy(next, false); label(); next.disabled = stage === 'off'; }
      });
    },
  });
  pw.input.focus();
}
async function disableBio(onDone) {
  const ok = await confirmDialog({ title: `关闭${BIO_NAME}解锁？`, message: '关闭后解锁需要输入主密码，之后可以随时重新开启。', ok: '关闭' });
  if (!ok) return;
  clearBio();
  toast(`已关闭${BIO_NAME}解锁`);
  if (onDone) onDone();
}
// 这台设备的主密码改了：这次是用面容 ID 解锁的，就直接用新密码重新加密；否则关闭，提示重新开启
async function bioAfterRekey(newPassword) {
  const rec = bioRecord();
  if (!rec || !S.store || S.store.kind !== 'local') return;
  if (S.bio && S.bio.credId === rec.credId && newPassword) {
    try { await bioSave(rec.credId, rec.prfSalt, S.bio.key, newPassword); return; } catch (e) { console.warn('面容 ID 记录更新失败', e); }
  }
  clearBio();
  toast(`主密码改了，${BIO_NAME}解锁已关闭，可以在「设置」里重新开启`, { duration: 6000 });
}

function renderLock(opts = {}) {
  const store = S.store;
  if (!store) { renderWelcome(); return; }
  const isFile = store.kind === 'file';
  const pw = pwField({ autocomplete: 'current-password', placeholder: '输入主密码' });
  const err = h('p', { class: 'err', role: 'alert' });
  const hintBox = h('div');
  const notice = h('div');
  // 面容 ID：记录还在但对不上现在的保险箱（主密码改过、换过保险箱），就作废并说明
  if (!isFile && IS_WEB && bioRecord() && !bioUsable(store)) {
    clearBio();
    notice.append(h('div', { class: 'reason info' }, icon('info', 'sm'), `主密码改过了，${BIO_NAME}解锁已关闭。解锁后可以在「设置」里重新开启`));
  }
  const bioOk = !isFile && bioUsable(store);
  const submit = h('button', { type: 'submit', class: 'btn block' + (bioOk ? '' : ' primary') }, icon('unlock'), '解锁');
  let bioBusy = false;
  const bioBtn = bioOk ? h('button', { type: 'button', class: 'btn primary block bio-btn', onclick: () => bioUnlock() }, icon('faceId'), `用${BIO_NAME}解锁`) : null;
  const bioOr = bioOk ? h('div', { class: 'or-line' }, '或者输入主密码') : null;
  const scanning = on => { const em = $('#emblem'); if (em) em.classList.toggle('scan', !!on); };
  const bioUnlock = () => {
    if (S.key || bioBusy) return;
    const rec = bioRecord();
    if (!rec || !bioUsable(store)) { renderLock(opts); return; }
    err.textContent = '';
    let job;
    try { job = bioGet(rec.credId, rec.prfSalt); }  // 必须在点击当下发起
    catch (e) { err.textContent = bioError(e); return; }
    bioBusy = true; busy(bioBtn, true, '正在验证…'); links.inert = true; scanning(true);
    job.then(async cred => {
      const out = cred && bioPrf(cred);
      if (!out) throw noPrf();
      let opened;
      try { opened = await bioOpen(rec, out); } catch { throw Object.assign(new Error('STALE'), { code: 'STALE' }); }
      const text = await store.read();
      if (!text) throw new Error('找不到保险箱数据');
      let res;
      try { res = await unseal(text, opened.password); }
      catch (e) { throw e.code === 'BAD_PASSWORD' ? Object.assign(new Error('STALE'), { code: 'STALE' }) : e; }

// 锁定一定会成功：点下去的同时冻结界面；能保存就先保存；保存不了的修改和编辑中的草稿先加密暂存，再锁上
async function lock(reason) {
  if (!S.key || S.locking) return;
  S.locking = true;
  freezeUI(true);
  try {
    clearTimeout(S.saveTimer);
    const draft = S.editor && S.editor.changed() ? S.editor.capture() : null;
    let saved = !S.dirty && !S.saving;
    if (!saved) saved = await Promise.race([flushSave(), sleep(4000).then(() => false)]);
    if (S.dirty) saved = false;  // 保存期间如果还有新改动（界面已冻结，正常不会发生），一并暂存，绝不悄悄丢掉
    let stashed = null, stashFailed = false;
    if (!saved || draft) {
      try { stashed = await writeStash({ vault: saved ? null : S.vault, draft }); }
      catch (e) { stashFailed = true; console.error('暂存失败', e); }
    }
    if (clipPending || clipTimer) { clearTimeout(clipTimer); if (document.hasFocus()) { try { await navigator.clipboard.writeText(''); } catch {} } clipPending = false; clipTimer = 0; }
    stopTotp();
    S.key = null; S.vault = null; S.header = null; S.ui = null; S.lastDeleted = null;
    S.dirty = false; S.editor = null; S.pendingStashClear = false; S.pendingStashStore = null; S.readOnly = false;
    S.revealed.clear(); hmacCache.clear(); totpCache.clear(); S.bio = null;
    closeDialogs();

    renderLock({ reason, stashed, stashFailed });

}

}

}

  const of = k => withPw.filter(e => level.get(e.id) === k);

}

}

  el._hide = setTimeout(() => { if (el.isConnected && !el.classList.contains('dots')) revealPw(e, el, btn); }, 30000);
  if (reducedMotion()) { el.textContent = e.password; return; }

  }, 34);
}

/* —— 复制、标记用过 —— */
async function copyTotpNow(e, bump) {
  if (!e.totp) return;
  // 先用已经算好的当前码同步复制（iPhone 要求复制必须在点击当下完成，中间不能等待）
  let code = cachedTotp(e);
  if (code) { if (!(await copyText(code))) return; }
  else {
    try { code = await currentTotp(e); } catch (err) { toast(err.message, { type: 'error' }); return; }
    if (!(await copyText(code))) return;
  }
  const left = Math.ceil(e.totp.period - (Date.now() / 1000) % e.totp.period);
  toast('动态验证码已复制', { entry: e, sub: `${fmtTotp(code)} · 还剩 ${left} 秒` });
  if (bump) { const s = $(`.slots[data-id="${e.id}"]`); if (s) { s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); } }
}
async function copyCode(e, c) {
  if (!(await copyText(c.v))) return;
  if (c.used) toast('已复制（注意：这个码之前标记为用过）', { entry: e });
  else toast('备用码已复制', { entry: e, sub: c.v, duration: 7000, action: { label: '标记为已用', run: () => { if (findEntry(e.id) === e && e.codes.includes(c) && !c.used) setUsed(e, c, true); } } });
}
function setUsed(e, c, used) {

  renderFilters(); renderList();
  const st = codeStats(e);
  if (used && st.level !== 'ok') toast(st.left ? `「${e.service}」只剩 ${st.left} 个可用备用码了` : `「${e.service}」的备用码已全部用完`, { type: 'error', duration: 4000 });
}
// 只更新备用码这一块（整页重画会把展开的大按钮收起来）

  const t = $('#t-codes');

/* —— 动态码：每 30 秒换新时数字滚动；圆环和进度条连续走 —— */
let totpTimer = 0;
function startTotp() { stopTotp(); totpTimer = setInterval(() => refreshTotp(), 250); refreshTotp(); }
function stopTotp() { clearInterval(totpTimer); totpTimer = 0; }
// 每个条目这一轮（30 秒内）的动态码；锁定时清空
const totpCache = new Map();
const totpSlot = (e, now = Date.now()) => e.totp.algorithm + '|' + e.totp.digits + '|' + e.totp.secret + '|' + Math.floor(now / 1000 / e.totp.period);
function cachedTotp(e) { if (!e.totp) return null; const c = totpCache.get(e.id); return c && c.slot === totpSlot(e) ? c.code : null; }
async function currentTotp(e, now = Date.now()) {
  const slot = totpSlot(e, now), c = totpCache.get(e.id);
  if (c && c.slot === slot) return c.code;
  const code = await totpAt(e.totp, now);
  totpCache.set(e.id, { slot, code });
  return code;
}
function setOtpText(el, txt, roll) {
  if (el.textContent === txt) return;
  if (!roll || reducedMotion() || !el.animate) { el.textContent = txt; return; }
  el.animate([{ transform: 'none', opacity: 1, filter: 'blur(0)' }, { transform: 'translateY(-45%)', opacity: 0, filter: 'blur(4px)' }], { duration: 170, easing: 'ease-in' }).finished.then(() => {
    el.textContent = txt;
    el.animate([{ transform: 'translateY(45%)', opacity: 0, filter: 'blur(4px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: 560, easing: EASE.spring });
  }, () => { el.textContent = txt; });
}
function paintSlots(box, code, roll) {
  box.classList.remove('bad');
  const slots = $$('.slot', box);
  slots.forEach((slot, i) => {
    const d = code[i] || '';
    const old = slot.lastElementChild;
    if (old && old.textContent === d) return;
    if (!roll || !old || !old.textContent || reducedMotion()) { slot.replaceChildren(h('b', null, d)); return; }
    const nb = h('b', null, d);
    slot.append(nb);
    const o = { duration: 620, delay: i * 45, easing: EASE.spring, fill: 'both' };
    old.animate([{ transform: 'none', filter: 'blur(0)' }, { transform: 'translateY(-105%)', filter: 'blur(3px)' }], o).finished.then(() => old.remove(), () => old.remove());
    nb.animate([{ transform: 'translateY(105%)', filter: 'blur(3px)' }, { transform: 'none', filter: 'blur(0)' }], o);
  });
}
async function refreshTotp(force) {
  if (!S.vault) return;
  const now = Date.now();
  for (const el of $$('.js-otp')) {
    const e = findEntry(el.dataset.id);
    if (!e || !e.totp) continue;
    const k = totpSlot(e, now);
    if (!force && el.dataset.k === k) continue;
    const roll = !!el.dataset.k && el.dataset.k !== k;
    el.dataset.k = k;
    try { setOtpText(el, fmtTotp(await currentTotp(e, now)), roll); el.classList.remove('bad'); }
    catch { el.textContent = '密钥无效'; el.classList.add('bad'); }
  }
  for (const box of $$('.slots[data-id]')) {
    const e = findEntry(box.dataset.id);
    if (!e || !e.totp) continue;
    const k = totpSlot(e, now);
    if (!force && box.dataset.k === k) continue;
    const roll = !!box.dataset.k && box.dataset.k !== k;
    box.dataset.k = k;
    try { paintSlots(box, await currentTotp(e, now), roll); }
    catch { box.classList.add('bad'); box.textContent = '2FA 密钥无效，请点「编辑」检查'; }
  }
  for (const el of $$('.js-ring, .js-sec, .js-bar')) {
    const e = findEntry(el.dataset.id);
    if (!e || !e.totp) continue;
    const p = e.totp.period, left = p - (now / 1000) % p;
    if (el.classList.contains('js-ring')) { const arc = el.querySelector('.arc'); if (arc) arc.style.strokeDashoffset = (50.27 * (1 - left / p)).toFixed(2); }
    else if (el.classList.contains('js-sec')) el.textContent = Math.ceil(left);
    else { el.style.width = (left / p * 100).toFixed(2) + '%'; const o = el.closest('.otp'); if (o) o.classList.toggle('soon', left <= 5); }
  }
}

function deleteEntry(e) {
  confirmDialog({ title: '删除「' + e.service + '」？', message: '这个账号的密码、备用码、密钥和备注都会被删除。删除后短时间内可以撤销。', ok: '删除', danger: true }).then(ok => {
    if (!ok) return;
    const idx = S.vault.entries.indexOf(e);
    if (idx < 0) return;
    S.vault.entries.splice(idx, 1);
    S.vault.deleted[e.id] = Math.max(Date.now(), e.updatedAt);  // 同步时把删除也带到另一台设备
    S.lastDeleted = { entry: e, idx };
    if (S.ui.sel === e.id) S.ui.sel = null;
    markDirty();
    renderAll();
    toast('已删除「' + e.service + '」', { duration: 8000, action: { label: '撤销', run: () => {
      if (!S.vault || !S.lastDeleted || S.lastDeleted.entry !== e) return;
      if (findEntry(e.id)) { S.lastDeleted = null; toast('这个账号已经在了（可能刚同步回来）'); return; }
      S.vault.entries.splice(Math.min(S.lastDeleted.idx, S.vault.entries.length), 0, e);
      delete S.vault.deleted[e.id];
      S.lastDeleted = null; S.ui.sel = e.id; markDirty(); renderAll(); toast('已恢复');
    } } });
  });
}

  input.addEventListener('input', () => { if (!picking && document.activeElement === input) open(true); });
  input.addEventListener('keydown', e => {

  return wrap;
}

const EMAIL_RE = /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g;
function guessMeta(text, fileName = '') {
  const t = String(text || '');
  const addresses = [...new Map((t.match(EMAIL_RE) || []).map(a => [a.toLowerCase(), a])).values()];
  const account = addresses.length === 1 ? addresses[0] : '';
  const pick = s => {
    let best = null, at = Infinity;
    for (const [re, service, group] of SERVICE_RULES) {
      const m = re.exec(s);
      if (m && m.index < at) { best = { service, group }; at = m.index; }
    }
    return best;
  };
  // 先看文件名，再看正文（去掉邮箱，免得把账号的邮箱域名当成网站），最后才按邮箱域名猜
  const hit = pick(String(fileName).replace(/\.[^.]+$/, '')) || pick(t.replace(EMAIL_RE, ' ')) || (account ? pick(account.split('@')[1]) : null);
  return { service: hit ? hit.service : '', group: hit ? hit.group : '', account, multipleAccounts: addresses.length > 1 };
}

function decodeText(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }  // 也会去掉 UTF-8 的 BOM
  catch { try { return new TextDecoder('gb18030').decode(b); } catch { return new TextDecoder('utf-8').decode(b); } }  // 中文网站常用的 GBK 编码
}

async function quickCapture(text, sourceLabel, fileName = '') {
  if (!S.key || S.locking) return;

  const report = inspectCodeText(raw), codes = report.codes;
  if (!codes.length && !report.excluded.length && !uri) { toast('没有可识别的内容'); return; }
  const guess = guessMeta(raw, fileName);

  if (codes.length && !uri) {
    const site = accountKey(guess.service), acct = accountKey(guess.account);
    const bySite = site ? S.vault.entries.filter(e => accountKey(e.service) === site) : [];
    const exact = acct ? bySite.filter(e => accountKey(e.account) === acct) : [];
    const candidates = exact.length ? exact : (site
      ? bySite.filter(e => !acct || !accountKey(e.account))

        ? '没有唯一匹配「' + guess.account + '」的旧条目；未填账号不能视为匹配。'

      const vals = parseCodeLines(ta.value);
      const long = vals.findIndex(v => clen(v) > LIMITS.code);
      count.textContent = vals.length ? '共 ' + vals.length + ' 个码' : '';
      ta.classList.toggle('bad', long >= 0);
      warnEl.replaceChildren(...(long < 0 ? [] : [h('p', { class: 'err' }, '第 ' + (long + 1) + ' 个码超过 ' + LIMITS.code + ' 字符，无法保存。')]));
      okBtn.disabled = !vals.length || long >= 0;
      okBtn.replaceChildren(icon('check', 'sm'), vals.length ? (hadCodes ? '换成这 ' + vals.length + ' 个新码' : '保存这 ' + vals.length + ' 个码') : (hadCodes ? '替换' : '保存'));
    };
    const accept = (text, label, options) => applyCodePreview(ta, note, upd, text, label, options);
    ta.addEventListener('input', upd);
    smartPaste(ta, accept);
    let confirming = false, writing = false;
    const me = { changed: () => !!ta.value.trim() || codeReviews.has(ta), capture: () => ({
      kind: 'replace-codes', entryId: id, service: entry.service, account: entry.account, baseCodes: base, codes: ta.value, codeReview: codeReviews.get(ta),
    }) };
    const sink = { el: ta, accept: (t, name) => accept(t, '文件「' + name + '」') };
    S.editor = me; S.dropSink = sink;
    const { close } = openDialog({
      title: hadCodes ? '「' + entry.service + '」换一组新码' : '给「' + entry.service + '」添加备用码', form: true,
      body: [
        h('p', { class: 'confirm-msg' }, '目标：' + targetName(entry) + '\n' + (hadCodes
          ? '将替换现有 ' + st.total + ' 个码（' + st.left + ' 个未用）。整组换新会重置已用标记；只想追加请使用「编辑」。'
          : '把网站给的备用码放在下面，核对后再保存。')),
        h('div', { class: 'sec-h' }, h('h4', null, icon('grid', 'sm'), hadCodes ? '新的备用码' : '备用码'), count, h('span', { class: 'spacer' }), fileButton((t, name) => accept(t, '文件「' + name + '」'))),
        ta, warnEl, note, msg],
      footer: [h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消'), okBtn],
      onSubmit: async c => {
        if (confirming || writing || S.key !== session || S.locking) return;
        if (S.reloading || S.conflictOpen) { msg.textContent = '正在核对其他窗口的修改，请稍后再提交。'; return; }
        msg.textContent = '';
        let live = current();
        if (!live) { msg.textContent = '原条目已删除或账号已变，本次未替换。输入的新码仍在此处，请核对后另存。'; return; }
        const entered = ta.value, vals = parseCodeLines(entered);
        if (!vals.length || vals.some(v => clen(v) > LIMITS.code)) return;
        if (sameCodeSet(codeValues(live), vals)) { toast('和现在存的码完全一样，不用替换'); return; }
        if (!sameCodeSet(base, codeValues(live))) {
          const version = codeState(live);
          confirming = true;
          let decision;
          try {
            decision = await chooseDialog({ title: '旧码已在别处更换',
              message: '「' + targetName(live) + '」当前有 ' + live.codes.length + ' 个码，与打开此窗口时不同。本次还没有写入。取消可保留输入；只有明确确认才会覆盖最新的一组。',
              options: [['replace', '确认替换最新一组']] });
          } finally { confirming = false; }
          if (!decision || S.editor !== me || S.key !== session || S.locking || S.reloading || S.conflictOpen) return;
          live = current();
          if (!live || codeState(live) !== version || ta.value !== entered) {
            msg.textContent = '目标或内容在确认期间又发生变化，未写入；请重新核对。'; return;
          }
        }
        // reload 会更换 entry 对象。仅修改按 id 取回的当前对象，不动它的备注、分组等其他字段。
        const before = live.codes.map(c => ({ ...c }));
        live.codes = vals.map(v => ({ v, used: false, usedAt: 0 }));
        live.ver.codes = Date.now();
        const applied = codeState(live), destStore = S.store;
        writing = true; touch(live); S.ui.sel = id;
        c(); renderAll();
        let persisted = false;
        try {
          persisted = await flushSave();
          const now = current();
          if (!now || S.store !== destStore || codeState(now) !== applied) return;
          if (!persisted || S.readOnly || S.dirty) {
            toast('备用码在当前窗口已更新，但尚未写入文件或浏览器存储。请保留原始新码，按页面提示处理。', { type: 'error', duration: 6500 }); return;
          }
          toast(hadCodes ? '已换成 ' + vals.length + ' 个新码' : '已保存 ' + vals.length + ' 个备用码', { duration: 8000, action: { label: '撤销', run: async () => {
            const dest = current();
            if (!dest || S.reloading || S.conflictOpen || S.store !== destStore || codeState(dest) !== applied) { toast('备用码或使用状态已变化，未撤销，避免覆盖后来的修改。', { type: 'error' }); return; }
            dest.codes = before.map(c => ({ ...c })); const restored = codeState(dest);
            dest.ver.codes = Date.now(); touch(dest); renderAll();
            const ok = await flushSave(), latest = current();
            if (latest && codeState(latest) === restored) toast(ok && !S.dirty && !S.readOnly ? '已恢复原来的码' : '撤销只在本窗口生效，尚未保存');
          } } });
        } finally { resolve(persisted); }
      },
      onClose: () => { if (S.editor === me) S.editor = null; if (S.dropSink === sink) S.dropSink = null; if (!writing) resolve(false); },
    });
    if (opts.draft !== undefined) { ta.value = String(opts.draft);
      if (typeof opts.review?.raw === 'string') accept(opts.review.raw, opts.review.source, { previewOnly: true });
      msg.textContent = '已恢复换码草稿；核对后再提交，尚未覆盖当前条目。'; }
    else if (raw) accept(raw, source || '粘贴的文字', { report: opts.report });
    upd(); ta.focus();
  });
}

// entry：要编辑的条目（新增时为 null）；draft：锁定前暂存的未提交内容；prefill：粘贴或拖入文件后自动识别出的内容
function openEditor(entry, draft, prefill, opts = {}) {
  if (entry && !findEntry(entry.id)) entry = null;
  const isNew = !entry;
  const d = entry ? structuredClone(entry) : { service: '', account: '', group: '', favorite: false, codes: [], totp: null, fields: [], note: '', password: '', url: '', pwHistory: [] };
  const fService = h('input', { class: 'input', placeholder: '例如：Google、微信、GitHub', value: d.service, autocomplete: 'off' });
  const fAccount = h('input', { class: 'input', placeholder: '邮箱 / 用户名 / 手机号', value: d.account, autocomplete: 'off' });
  // —— 密码（可以一键生成）、网址 ——
  const pwBox = pwField({ autocomplete: 'new-password', placeholder: '这个网站的登录密码' });
  const fPassword = pwBox.input;
  fPassword.value = d.password || '';
  const fUrl = h('input', { class: 'input', placeholder: '例如 accounts.google.com', value: d.url || '', autocomplete: 'off', spellcheck: 'false', inputmode: 'url', autocapitalize: 'off' });
  const genBtn = h('button', { type: 'button', class: 'btn sm', title: '生成一个随机的强密码', onclick: () => openGenerator(v => { fPassword.value = v; fPassword.type = 'text'; fPassword.dispatchEvent(new Event('input', { bubbles: true })); }) }, icon('sparkles', 'sm'), '生成');
  const pwMeter = strengthMeter(fPassword);
  fUrl.addEventListener('change', () => { if (!fService.value.trim()) { const g = serviceFromUrl(fUrl.value); if (g) { fService.value = g; markSingles(); } } });
  const groups = [...new Set([...S.vault.entries.map(e => e.group).filter(Boolean), ...GROUPS])];
  const fGroup = h('input', { class: 'input', placeholder: '例如：社交、工作', value: d.group, autocomplete: 'off' });
  const serviceBox = combo(fService, () => [...S.vault.entries.map(e => e.service), ...SERVICES]);
  const groupBox = combo(fGroup, () => groups);
  const singles = [[fService, LIMITS.service], [fAccount, LIMITS.account], [fGroup, LIMITS.group], [fUrl, LIMITS.url]];
  const markSingles = () => { for (const [el, max] of singles) el.classList.toggle('bad', clen(el.value.trim()) > max); };
  for (const [el] of singles) el.addEventListener('input', markSingles);
  const fFav = h('input', { type: 'checkbox' });
  fFav.checked = !!d.favorite;

  // —— 备用码 ——
  const fCodes = h('textarea', { class: 'textarea mono', rows: 6, spellcheck: 'false', autocomplete: 'off', placeholder: '每行一个码。\n也可以直接粘贴网站给的整段文字（含编号、说明），或把下载的 .txt 文件拖进来，会自动识别出备用码。', value: d.codes.map(c => c.v).join('\n') });
  const codesCount = h('span', { class: 'count' });
  const codesWarn = h('div');
  const parseNote = h('div');
  const updCount = () => {
    const all = fCodes.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const uniq = [...new Set(all)];
    const dup = all.length - uniq.length;
    codesCount.textContent = uniq.length ? `共 ${uniq.length} 个码` + (dup ? `（另有 ${dup} 个重复，保存时会合并）` : '') : '';
    const i = uniq.findIndex(v => clen(v) > LIMITS.code);
    fCodes.classList.toggle('bad', i >= 0);
    codesWarn.replaceChildren(...[i >= 0 ? h('p', { class: 'err' }, `第 ${i + 1} 个码有 ${clen(uniq[i])} 个字符，超过了 ${LIMITS.code} 字符的上限，这样无法保存。备用码通常只有十几个字符，请检查是不是粘贴了别的内容。`) : null].filter(Boolean));
  };
  fCodes.addEventListener('input', updCount);
  const applyExtract = (raw, label, opts) => applyCodePreview(fCodes, parseNote, updCount, raw, label, opts);
  const acceptText = (text, label, fileName = '', opts) => {
    const info = applyExtract(text, label, opts);
    if (!info.codes.length && !info.uncertain) return;
    const g = guessMeta(text, fileName);
    if (!fService.value.trim() && g.service) fService.value = g.service;
    if (!fAccount.value.trim() && g.account) fAccount.value = g.account;
    if (!fGroup.value.trim() && g.group) fGroup.value = g.group;
    markSingles(); syncReveal();
  };
  smartPaste(fCodes, (t, name, opts) => acceptText(t, name, '', opts));

  // —— 动态码 ——
  const t0 = d.totp || { secret: '', digits: 6, period: 30, algorithm: 'SHA-1' };
  const fSecret = h('input', { class: 'input mono', spellcheck: 'false', autocomplete: 'off', placeholder: '例如 JBSW Y3DP EHPK 3PXP，或 otpauth:// 开头的链接', value: d.totp ? groupChars(t0.secret) : '' });
  const mkSel = (opts, val) => h('select', { class: 'select', value: String(val) }, opts.map(([v, l]) => h('option', { value: String(v) }, l)));
  const fDigits = mkSel([[6, '6 位'], [7, '7 位'], [8, '8 位']], t0.digits);
  const fPeriod = mkSel([[30, '30 秒'], [60, '60 秒'], [15, '15 秒']], 30);
  const setPeriod = p => {
    if (![...fPeriod.options].some(o => o.value === String(p))) fPeriod.append(h('option', { value: String(p) }, p + ' 秒'));
    fPeriod.value = String(p);
  };
  setPeriod(t0.period);
  const fAlgo = mkSel([['SHA-1', 'SHA-1（默认）'], ['SHA-256', 'SHA-256'], ['SHA-512', 'SHA-512']], t0.algorithm);
  const totpPrev = h('div', { class: 'totp-preview' });
  let prevSeq = 0;
  const readTotp = () => {
    const secret = cleanB32(fSecret.value);
    if (!secret) return null;
    return { secret, digits: +fDigits.value, period: +fPeriod.value, algorithm: fAlgo.value };
  };
  const updTotp = async () => {
    const seq = ++prevSeq;
    const t = readTotp();
    totpPrev.className = 'totp-preview';
    if (!t) { totpPrev.textContent = '在网站开启「两步验证 / 身份验证器」时，选择「无法扫码 / 手动输入密钥」就能看到这串密钥。'; return; }
    try {
      b32decode(t.secret);
      const code = await totpAt(t);
      if (seq !== prevSeq) return;
      totpPrev.replaceChildren('当前动态码 ', h('b', null, fmtTotp(code)), '　—— 与手机验证器上的一致就说明填对了');
    } catch (e) {
      if (seq !== prevSeq) return;
      totpPrev.className = 'totp-preview bad';
      totpPrev.textContent = e.message;
    }
  };
  fSecret.addEventListener('input', () => {
    const v = fSecret.value.trim();
    if (/^otpauth(-migration)?:\/\//i.test(v)) {
      const p = parseOtpauth(v);
      if (!p) { totpPrev.className = 'totp-preview bad'; totpPrev.textContent = /^otpauth-migration/i.test(v) ? '暂不支持 Google 验证器的批量导出链接，请逐个账号导出或手动输入密钥' : '无法识别这个链接'; return; }
      if (p.error) { totpPrev.className = 'totp-preview bad'; totpPrev.textContent = p.error; return; }
      fSecret.value = groupChars(p.secret);
      fDigits.value = String(p.digits);
      setPeriod(Number.isInteger(p.period) && p.period >= 5 && p.period <= 300 ? p.period : 30);
      fAlgo.value = p.algorithm;
      if (!fService.value.trim() && p.issuer) fService.value = p.issuer;
      if (!fAccount.value.trim() && p.account) fAccount.value = p.account;
      markSingles();
      toast('已从链接中读取密钥' + (p.issuer ? '（' + p.issuer + '）' : ''));
    }
    updTotp();
  });
  for (const s of [fDigits, fPeriod, fAlgo]) s.addEventListener('change', updTotp);

  // —— 密钥 / 安全码 ——
  const fieldsBox = h('div');
  const addField = (label = '', value = '', focus, ph = {}) => {
    const lab = h('input', { class: 'input', placeholder: ph.label || '名称，如：恢复密钥', value: label, autocomplete: 'off' });
    const val = h('textarea', { class: 'textarea mono', rows: 1, spellcheck: 'false', autocomplete: 'off', placeholder: ph.value || '内容', value });
    const warn = h('p', { class: 'err fld-warn' });
    const grow = () => { val.style.height = 'auto'; val.style.height = Math.min(val.scrollHeight + 2, 220) + 'px'; };
    const chk = () => {
      const nl = clen(lab.value.trim()), nv = clen(val.value);
      lab.classList.toggle('bad', nl > LIMITS.label);
      val.classList.toggle('bad', nv > LIMITS.value);
      warn.textContent = nl > LIMITS.label ? `名称最多 ${LIMITS.label} 个字（现在 ${nl} 个）`
        : nv > LIMITS.value ? `内容最多 ${LIMITS.value} 个字（现在 ${nv} 个），这样无法保存` : '';
    };
    val.addEventListener('input', () => { grow(); chk(); });
    // 按「安全问题」添加的行，内容框提示「答案」；改选成其他名称（如 PIN 码）后提示变回「内容」
    const updPh = () => { val.placeholder = ph.value && !FIELD_LABELS.some(x => x !== '安全问题' && x === lab.value.trim()) ? ph.value : '内容'; };
    lab.addEventListener('input', () => { chk(); updPh(); });
    const row = h('div', { class: 'fld-row' }, combo(lab, () => FIELD_LABELS), val, h('button', { type: 'button', class: 'icon-btn danger', title: '删除这一项', 'aria-label': '删除这一项', onclick: () => row.remove() }, icon('trash', 'sm')), warn);
    row._get = () => ({ label: lab.value.trim(), value: val.value });
    row._els = { lab, val };
    fieldsBox.append(row);
    requestAnimationFrame(grow);
    chk();
    if (focus) (label && !label.endsWith('：') ? val : lab).focus();
  };
  for (const f of d.fields) addField(f.label, f.value);
  const quick = h('div', { class: 'quick-add' },
    [['恢复密钥', '恢复密钥'], ['安全码 / PIN', 'PIN 码'], ['安全问题', '', { label: '问题，例如：我的小学叫什么名字？', value: '答案' }], ['自定义', '']].map(([t, l, ph]) =>
      h('button', { type: 'button', class: 'btn sm', onclick: () => addField(l, '', true, ph) }, icon('plus', 'sm'), t)));

  // —— 备注 ——
  const fNote = h('textarea', { class: 'textarea', rows: 3, placeholder: '例如：备用码生成于哪天、在哪台设备上设置的 2FA、客服电话……', value: d.note });
  const noteInfo = h('p', { class: 'hint' });
  const updNote = () => {
    const n = clen(fNote.value);
    const over = n > LIMITS.note;
    fNote.classList.toggle('bad', over);
    noteInfo.className = over ? 'err' : 'hint';
    noteInfo.textContent = n > LIMITS.note * 0.9 ? `${n} / ${LIMITS.note} 字` + (over ? '，超出上限，这样无法保存' : '') : '';
  };
  fNote.addEventListener('input', updNote);

  // —— 不常用的几块默认收起，用「＋」按钮展开；有内容的会自动展开；每块右上角的「×」可以再收起 ——
  const closeBtn = key => h('button', { type: 'button', class: 'icon-btn sm sec-close', title: '收起这一栏', 'aria-label': '收起这一栏', onclick: () => collapse(key) }, icon('x', 'sm'));
  const groupRow = h('div', { class: 'row group-row', hidden: true },
    h('div', { class: 'field' }, h('label', { class: 'label' }, '分组'), groupBox),
    h('div', { class: 'field fav-field' }, h('label', { class: 'check' }, fFav, h('span', null, '收藏（显示在首页的卡片里）'))),
    h('div', { class: 'group-close' }, closeBtn('group')));
  const scanSecret = async () => {
    const r = await scanQR({ title: '扫描两步验证二维码', sub: '对准网站开启两步验证时显示的二维码', syncFrames: false });
    if (!r) return;
    if (r.type === 'text' && /^otpauth:\/\//i.test(r.text)) { fSecret.value = r.text; fSecret.dispatchEvent(new Event('input')); reveal('totp'); }
    else toast('这不是两步验证（身份验证器）的二维码', { type: 'error', duration: 4000 });
  };
  const secTotp = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('clock', 'sm'), '2FA 密钥（动态验证码）'), h('span', { class: 'spacer' }),
      h('button', { type: 'button', class: 'btn sm ghost', title: '用摄像头扫网站显示的二维码', onclick: scanSecret }, icon('scan', 'sm'), '扫码'), closeBtn('totp')),
    fSecret, totpPrev,
    h('details', { class: 'adv' }, h('summary', null, '高级选项（一般不用改）'), h('div', { class: 'row' }, fDigits, fPeriod, fAlgo)));
  const secFields = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('key', 'sm'), '其他密钥与安全码'), h('span', { class: 'count' }, '恢复密钥、PIN、安全问题等'), h('span', { class: 'spacer' }), closeBtn('fields')),
    fieldsBox, quick);
  const secNote = h('div', { class: 'sec', hidden: true },
    h('div', { class: 'sec-h' }, h('h4', null, icon('note', 'sm'), '备注'), h('span', { class: 'spacer' }), closeBtn('note')),
    fNote, noteInfo);
  const moreBar = h('div', { class: 'more-bar' }, h('span', null, '更多：'));
  const parts = {};
  const reveal = (key, focusIt) => {
    const p = parts[key];
    if (!p || !p.sec.hidden) return;
    p.sec.hidden = false; p.btn.hidden = true;
    if (Object.values(parts).every(x => x.btn.hidden)) moreBar.hidden = true;
    if (focusIt && p.focus) p.focus();
  };
  for (const [key, label, sec, focus] of [
    ['totp', '2FA 密钥', secTotp, () => fSecret.focus()],
    ['fields', '恢复密钥 / PIN / 安全问题', secFields, null],
    ['note', '备注', secNote, () => fNote.focus()],
    ['group', '分组 / 收藏', groupRow, () => fGroup.focus()],
  ]) {
    const btn = h('button', { type: 'button', class: 'chip', onclick: () => reveal(key, true) }, icon('plus', 'xs'), label);
    parts[key] = { sec, btn, focus };
    moreBar.append(btn);
  }
  const syncReveal = () => {
    if (fSecret.value.trim()) reveal('totp');
    if ($$('.fld-row', fieldsBox).length) reveal('fields');
    if (fNote.value.trim()) reveal('note');
    if (fGroup.value.trim() || fFav.checked) reveal('group');
  };
  // 收起：没填内容就直接收起；填了内容先确认，再清空并收起（点「添加 / 保存」之前都不会改动保险箱）
  const PART_NAMES = { totp: '2FA 密钥', fields: '其他密钥与安全码', note: '备注', group: '分组 / 收藏' };
  const hasContent = {
    totp: () => !!fSecret.value.trim(),
    fields: () => $$('.fld-row', fieldsBox).some(r => r._get().value.trim()),
    note: () => !!fNote.value.trim(),
    group: () => !!fGroup.value.trim() || fFav.checked,
  };
  const clearPart = {
    totp: () => { fSecret.value = ''; fDigits.value = '6'; setPeriod(30); fAlgo.value = 'SHA-1'; updTotp(); },
    fields: () => clear(fieldsBox),
    note: () => { fNote.value = ''; updNote(); },
    group: () => { fGroup.value = ''; fFav.checked = false; markSingles(); },
  };
  const collapse = async key => {
    const p = parts[key];
    if (!p || p.sec.hidden) return;
    if (hasContent[key]()) {
      const ok = await confirmDialog({
        title: `移除「${PART_NAMES[key]}」这一栏？`,
        message: `这一栏里填的内容会被清空。点「${isNew ? '添加' : '保存'}」之前，保险箱里的数据都不会改动。`,
        ok: '移除', danger: true,
      });
      if (!ok || p.sec.hidden) return;
    }
    clearPart[key]();
    p.sec.hidden = true; p.btn.hidden = false; moreBar.hidden = false;
  };

  const err = h('p', { class: 'err', role: 'alert' });
  const snapshot = () => JSON.stringify([fService.value, fAccount.value, fPassword.value, fUrl.value, fGroup.value, fFav.checked, fCodes.value, fSecret.value, fDigits.value, fPeriod.value, fAlgo.value, $$('.fld-row', fieldsBox).map(r => r._get()), fNote.value]);
  const initial = snapshot();

  // 恢复锁定前暂存的草稿
  if (draft) {
    fService.value = str(draft.service); fAccount.value = str(draft.account); fGroup.value = str(draft.group);
    fPassword.value = str(draft.password); fUrl.value = str(draft.url);
    fFav.checked = !!draft.favorite;
    fCodes.value = str(draft.codes);
    fSecret.value = str(draft.secret);
    if ([6, 7, 8].includes(+draft.digits)) fDigits.value = String(+draft.digits);
    if (Number.isInteger(+draft.period) && +draft.period >= 5 && +draft.period <= 300) setPeriod(+draft.period);
    if (['SHA-1', 'SHA-256', 'SHA-512'].includes(draft.algorithm)) fAlgo.value = draft.algorithm;
    clear(fieldsBox);
    for (const f of Array.isArray(draft.fields) ? draft.fields : []) addField(str(f && f.label), str(f && f.value));
    fNote.value = str(draft.note);
  }
  // 粘贴 / 拖入文件后自动识别出的内容
  if (prefill) {
    const g = prefill.guess || {};
    if (g.service) fService.value = g.service;
    if (g.account) fAccount.value = g.account;
    if (g.group) fGroup.value = g.group;
    if (prefill.raw) applyExtract(prefill.raw, prefill.source, { report: prefill.report });
    if (prefill.uri) { fSecret.value = prefill.uri; fSecret.dispatchEvent(new Event('input')); }
  }
  if (typeof draft?.codeReview?.raw === 'string') applyExtract(draft.codeReview.raw, draft.codeReview.source, { previewOnly: true });
  markSingles(); updCount(); updTotp(); updNote(); syncReveal();

  const fail = (msg, el) => {
    err.textContent = msg; toast(msg, { type: 'error', duration: 6000 });
    for (const [key, p] of Object.entries(parts)) if (el && p.sec.contains(el)) reveal(key);
    if (el) el.focus();
  };
  const onCancel = async close => {
    if (snapshot() === initial && !codeReviews.has(fCodes)) { close(); return; }
    if (await confirmDialog({ title: '放弃修改？', message: '你填写的内容还没有保存。', ok: '放弃', cancel: '继续编辑', danger: true })) close();
  };
  const onSubmit = close => {
    err.textContent = '';
    const service = fService.value.trim(), account = fAccount.value.trim(), group = fGroup.value.trim();
    const password = fPassword.value, url = fUrl.value.trim();
    if (!service) return fail('请填写服务名称', fService);
    if (clen(service) > LIMITS.service) return fail(`服务名称最多 ${LIMITS.service} 个字（现在 ${clen(service)} 个），没有保存`, fService);
    if (clen(account) > LIMITS.account) return fail(`账号最多 ${LIMITS.account} 个字（现在 ${clen(account)} 个），没有保存`, fAccount);
    if (clen(group) > LIMITS.group) return fail(`分组名最多 ${LIMITS.group} 个字（现在 ${clen(group)} 个），没有保存`, fGroup);
    if (clen(password) > LIMITS.password) return fail(`密码最多 ${LIMITS.password} 个字符（现在 ${clen(password)} 个），没有保存`, fPassword);
    if (clen(url) > LIMITS.url) return fail(`网址最多 ${LIMITS.url} 个字符（现在 ${clen(url)} 个），没有保存`, fUrl);
    const codeVals = parseCodeLines(fCodes.value);
    const longI = codeVals.findIndex(v => clen(v) > LIMITS.code);
    if (longI >= 0) return fail(`第 ${longI + 1} 个备用码有 ${clen(codeVals[longI])} 个字符，超过了 ${LIMITS.code} 字符的上限，没有保存`, fCodes);
    const totp = readTotp();
    if (totp) { try { b32decode(totp.secret); } catch (e) { return fail('2FA 密钥有误：' + e.message, fSecret); } }
    const rows = $$('.fld-row', fieldsBox);
    for (let i = 0; i < rows.length; i++) {
      const f = rows[i]._get();
      if (clen(f.label) > LIMITS.label) return fail(`第 ${i + 1} 项的名称最多 ${LIMITS.label} 个字（现在 ${clen(f.label)} 个），没有保存`, rows[i]._els.lab);
      if (clen(f.value) > LIMITS.value) return fail(`第 ${i + 1} 项「${f.label || '未命名'}」的内容最多 ${LIMITS.value} 个字（现在 ${clen(f.value)} 个），没有保存`, rows[i]._els.val);
    }
    const note = fNote.value.replace(/\s+$/, '');
    if (clen(note) > LIMITS.note) return fail(`备注最多 ${LIMITS.note} 个字（现在 ${clen(note)} 个），没有保存`, fNote);
    const oldMap = new Map((entry ? entry.codes : []).map(c => [c.v, c]));
    const codes = codeVals.map(v => (oldMap.has(v) ? { ...oldMap.get(v) } : { v, used: false, usedAt: 0 }));
    const fields = rows.map(r => r._get()).filter(f => f.label || f.value.trim());
    if (prefill && !codeVals.length && !totp && !fields.length && !note && !password) return fail('没有选中备用码或其他密钥。请核对未加入的项，或手工录入。', fCodes);
    const now = Date.now();
    // 改了密码：把旧密码记进「以前的密码」（最多 10 个），万一网站上没改成功还能找回
    const live = entry && findEntry(entry.id);
    let pwHistory = live ? live.pwHistory.map(x => ({ ...x })) : [];
    if (live && live.password && live.password !== password) pwHistory = [{ v: live.password, at: now }, ...pwHistory.filter(x => x.v !== live.password && x.v !== password)].slice(0, PW_HISTORY_MAX);
    const data = { service, account, group, favorite: fFav.checked, codes, totp, fields, note, password, url, pwHistory, updatedAt: now };
    let target = entry && findEntry(entry.id);
    const before = target ? structuredClone(target) : null;
    if (target) Object.assign(target, data);
    else { target = { id: uid(), createdAt: now, ...data, ver: {} }; S.vault.entries.push(target); }
    stampChanges(before, target, now);
    S.ui.sel = target.id;
    if (S.ui.filter !== 'all' && !visibleEntries().includes(target)) S.ui.filter = 'all';
    markDirty();
    close();
    renderAll();
    toast(isNew ? `已添加「${service}」` + (codes.length ? `，共 ${codes.length} 个备用码` : '') : '已保存修改');
  };

  const me = {
    changed: () => snapshot() !== initial || codeReviews.has(fCodes),
    capture: () => ({
      entryId: entry ? entry.id : null,
      service: fService.value, account: fAccount.value, group: fGroup.value, favorite: fFav.checked, password: fPassword.value, url: fUrl.value,
      codes: fCodes.value, secret: fSecret.value, digits: +fDigits.value, period: +fPeriod.value, algorithm: fAlgo.value,
      fields: $$('.fld-row', fieldsBox).map(r => r._get()), note: fNote.value, codeReview: codeReviews.get(fCodes),
    }),
  };
  const sink = { el: fCodes, accept: (t, name) => acceptText(t, `文件「${name}」`, name) };
  S.editor = me;
  S.dropSink = sink;
  let notice = null;
  if (draft) {
    notice = h('div', { class: 'callout info' }, icon('info'), h('span', null,
      draft.entryId && !entry ? '已恢复锁定前没提交的编辑内容。原来的条目已经不在了，保存后会作为新条目添加。'
        : `已恢复锁定前没提交的编辑内容，确认无误后点「${isNew ? '添加' : '保存'}」。`));
  } else if (prefill) {
    const n = prefill.raw ? parseCodeLines(fCodes.value).length : 0;
    const g = prefill.guess || {};
    const found = [n ? `${n} 个备用码` : '', prefill.uri ? '2FA 密钥' : ''].filter(Boolean).join('和');
    notice = h('div', { class: 'callout info' }, icon('sparkles'), h('span', null,
      (found ? `已从${prefill.source}识别出 ${found}` : `没有在${prefill.source}里识别出确定的备用码，未写入`)
      + (fService.value.trim() ? `，看起来是「${fService.value.trim()}」${fAccount.value.trim() ? '（' + fAccount.value.trim() + '）' : ''}。核对一下，没问题就点「${isNew ? '添加' : '保存'}」。` : `。填上服务名称，然后点「${isNew ? '添加' : '保存'}」。`)));
  }

  const submitBtn = h('button', { type: 'submit', class: 'btn primary' }, icon('check', 'sm'), isNew ? '添加' : '保存');
  const { dlg } = openDialog({
    title: isNew ? '新增账号' : '编辑「' + entry.service + '」',
    form: true, onSubmit, onCancel,
    onClose: () => {
      if (S.editor === me) S.editor = null;
      if (S.dropSink === sink) S.dropSink = null;
      if (prefill && prefill.onDone) prefill.onDone();
    },
    body: [
      notice,
      h('div', { class: 'sec' },
        h('div', { class: 'row' },
          h('div', { class: 'field' }, h('label', { class: 'label' }, '服务名称'), serviceBox),
          h('div', { class: 'field' }, h('label', { class: 'label' }, '账号 ', h('span', { class: 'opt' }, '（可选）')), fAccount)),
        h('div', { class: 'field' }, h('label', { class: 'label' }, '密码 ', h('span', { class: 'opt' }, '（可选）')), h('div', { class: 'pw-line' }, pwBox.el, genBtn), pwMeter),
        h('div', { class: 'field' }, h('label', { class: 'label' }, '网址 ', h('span', { class: 'opt' }, '（可选）')), fUrl),
        groupRow),
      h('div', { class: 'sec' },
        h('div', { class: 'sec-h' }, h('h4', null, icon('grid', 'sm'), '一次性备用码'), codesCount, h('span', { class: 'spacer' }),
          fileButton((t, name) => acceptText(t, `文件「${name}」`, name)),
          h('button', { type: 'button', class: 'btn sm ghost', title: '从当前内容中识别备用码', onclick: () => applyExtract(fCodes.value, '当前内容') }, icon('sparkles', 'sm'), '智能整理')),
        fCodes, codesWarn, parseNote,
        entry && entry.codes.some(c => c.used) ? h('p', { class: 'hint', style: { marginTop: '6px' } }, '已标记为「用过」的码，只要内容不变就会保留标记。') : null),
      moreBar,
      secTotp, secFields, secNote,
      err,
    ],
    footer: [
      h('button', { type: 'button', class: 'btn', onclick: () => onCancel(() => dlg._close()) }, '取消'),
      submitBtn,
    ],
  });
  if (Object.values(parts).every(x => x.btn.hidden)) moreBar.hidden = true;
  if (opts.focus === 'password') fPassword.focus();
  else if (opts.focus && parts[opts.focus]) { reveal(opts.focus, true); if (opts.focus === 'fields' && !$$('.fld-row', fieldsBox).length) addField('', '', true); }
  else if (prefill && fService.value.trim()) submitBtn.focus();
  else if (isNew && !draft) fService.focus();
  else if (!IS_TOUCH) fService.focus();
}

/* ---------------- 设置 ---------------- */
function openSettings() {
  const st = S.vault.settings;
  const prefs = loadPrefs();
  const sel = (opts, val, onchange) => {
    const s = h('select', { class: 'select', onchange: e => onchange(e.target.value) }, opts.map(([v, l]) => h('option', { value: String(v) }, l)));
    s.value = String(val);
    return s;
  };
  const row = (title, desc, control) => h('div', { class: 'set-row' }, h('div', { class: 't' }, h('b', null, title), desc ? h('span', null, desc) : null), control);
  const sw = (checked, onchange) => {
    const input = h('input', { type: 'checkbox', onchange: e => onchange(e.target.checked) });
    input.checked = checked;
    return h('label', { class: 'switch' }, input, h('span', { class: 'slider' }));
  };
  const group = (title, ic, ...rows) => [h('div', { class: 'set-title' }, icon(ic, 'sm'), title), h('div', { class: 'set-group' }, rows.filter(Boolean))];
  const isFile = S.store.kind === 'file';
  // 面容 ID 解锁：只在从网址打开、数据存在本机（手机）时出现
  const bioRow = () => {
    if (!IS_WEB || isFile) return null;
    const desc = h('span'), btn = h('button', { type: 'button', class: 'btn sm' });
    const upd = () => {
      const on = bioUsable(S.store);
      desc.textContent = on ? `已开启：锁定后点「用${BIO_NAME}解锁」，看一下就能打开`
        : bioAvailable ? '开启后解锁时不用输入主密码；主密码仍然有效，请继续记牢'
        : `这台设备暂时不支持（需要${IS_IOS ? ' iOS 18 或更新的系统，并设置好面容 ID 或触控 ID' : '支持指纹或面部识别'}）`;
      btn.hidden = !on && !bioAvailable;
      btn.replaceChildren(on ? '关闭' : '开启');
      btn.onclick = () => (on ? disableBio(upd) : enableBio(upd));
    };
    upd();
    if (!bioAvailable) detectBio().then(() => { if (desc.isConnected) upd(); });  // 启动时可能还没检测出来：打开设置时再查一次
    return h('div', { class: 'set-row' }, h('div', { class: 't' }, h('b', null, `用${BIO_NAME}解锁`), desc), btn);
  };
  const { close } = openDialog({
    title: '设置',
    body: [
      ...group('安全', 'lock',
        row('自动锁定', '一段时间没有操作后自动锁上', sel([[1, '1 分钟'], [3, '3 分钟'], [5, '5 分钟'], [10, '10 分钟'], [15, '15 分钟'], [30, '30 分钟'], [0, '从不']], st.autoLock, v => { st.autoLock = +v; markDirty(); })),
        row('复制后清空剪贴板', '复制密码或码值后，过一会儿自动清空剪贴板（本窗口在前台时生效）', sel([[15, '15 秒后'], [30, '30 秒后'], [60, '60 秒后'], [120, '2 分钟后'], [0, '不清空']], st.clipClear, v => { st.clipClear = +v; markDirty(); })),
        bioRow(),
        row('主密码', '修改用来解锁保险箱的主密码', h('button', { type: 'button', class: 'btn sm', onclick: () => changePassword() }, '修改主密码')),
        row('密码提示', S.header.hint ? '当前提示：' + S.header.hint : '未设置', h('button', { type: 'button', class: 'btn sm', onclick: () => { close(); editHint(); } }, S.header.hint ? '修改' : '设置'))),
      ...group('显示', 'eye',
        row('首页卡片显示动态码', '收藏的账号卡片上直接显示正在变化的动态码；关掉后要点进账号才能看到', sw(st.cardCodes !== false, v => { st.cardCodes = v; markDirty(); renderList(); })),
        row('外观', null, sel([['auto', '跟随系统'], ['light', '浅色'], ['dark', '深色']], prefs.theme, v => { savePrefs({ ...loadPrefs(), theme: v }); applyTheme(v); }))),
      ...group('数据', 'hardDrive',
        row('存储位置', isFile ? '加密文件：' + S.store.name + (S.readOnly ? '（只读打开，修改不会写回）' : '') : `${THIS_LOCAL}的本地存储` + (IS_TOUCH ? '' : '（清除浏览器数据会丢失）'),
          isFile ? h('button', { type: 'button', class: 'btn sm', onclick: async () => { if (await saveAsNewFile()) close(); } }, '另存到…') : null),
        row('电脑和手机同步', '扫码或用文件，把两台设备上的内容合并在一起', h('button', { type: 'button', class: 'btn sm', onclick: () => { close(); openSyncDialog(); } }, icon('devices', 'sm'), '同步')),
        row('从其他密码管理器导入', 'Edge、Chrome、iCloud 钥匙串、Bitwarden 等导出的 CSV 文件。已有的密码不会被覆盖', h('button', { type: 'button', class: 'btn sm', onclick: () => { close(); importCsv(); } }, icon('upload', 'sm'), '导入 CSV')),
        row('导出备份', '导出一份加密备份文件，用同一个主密码解锁。建议存到 U 盘或网盘', h('button', { type: 'button', class: 'btn sm', onclick: exportBackup }, icon('download', 'sm'), '导出')),
        row('导入备份', '把另一个备份文件里的账号合并进来（相同账号保留较新的版本）', h('button', { type: 'button', class: 'btn sm', onclick: () => importBackup() }, icon('upload', 'sm'), '导入')),
        row('打印', '打印全部账号，做一份纸质备份', h('button', { type: 'button', class: 'btn sm', onclick: () => { close(); printEntries(S.vault.entries); } }, icon('printer', 'sm'), '打印全部'))),
      ...group('帮助', 'help', h('div', { class: 'set-help' }, helpContent())),
    ],
  });
}
function helpContent() {
  const qa = (q, a) => [h('h5', null, q), h('p', null, a)];
  return h('div', { class: 'help' },
    qa('数据存在哪里？安全吗？', S.store.kind === 'file'
      ? `全部内容加密后保存在「${S.store.name}」这个文件里，本程序不会联网（页面已禁止一切网络请求）。没有主密码，任何人拿到文件也看不到内容。`
      : `全部内容加密后保存在${THIS_LOCAL}的本地存储中，本程序不会联网。没有主密码，任何人都看不到内容。`),
    IS_WEB ? qa('手机版会联网吗？', '只在第一次打开和检查新版本时，从网址下载程序本身（就像安装、更新 App）。页面已禁止发出任何网络请求，保险箱里的数据从不上传；同步靠扫码或文件，不经过任何服务器。') : null,
    qa('电脑和手机怎么同步？', '电脑上点「同步」，手机上点「扫一扫」对准电脑：电脑上的内容先合并到手机；手机上也有修改的话，手机接着会显示一个二维码，把手机屏幕转过来对着电脑上方的摄像头，电脑收到后两边就完全一样了。同一账号以较新的修改为准，删除也会同步。二维码里是用主密码加密的数据，被别人拍到也打不开。没有摄像头时可以用「文件同步」。'),
    qa('怎么把浏览器里存的密码搬过来？', '在 Edge 或 Chrome 的「设置 → 密码」里选「导出密码」，得到一个 CSV 文件；iPhone 的「密码」App、Bitwarden 等也能导出 CSV。然后在这里的「设置 → 数据 → 从其他密码管理器导入」选这个文件。已经存过的账号不会被覆盖。导入后请删掉那个 CSV 文件，它是明文的。'),
    IS_WEB && S.store.kind === 'local' ? qa(`能用${BIO_NAME}解锁吗？`, `可以（设备要支持）：在「设置 → 安全」里开启。开启时会在这台设备的系统钥匙串里建一个通行密钥，用它把主密码加密后保存在本机；解锁时看一下，系统才会解开它。不联网。主密码仍然有效，请继续记牢；主密码改过之后需要重新开启。`) : null,
    qa('用的是什么加密？', '主密码经过 PBKDF2-SHA256（60 万次迭代）生成密钥，数据用 AES-256-GCM 加密。主密码本身不会被保存' + (IS_WEB && S.store.kind === 'local' ? `（开启${BIO_NAME}解锁后，只在本机保存一份用通行密钥加密过的主密码）。` : '。')),
    qa('忘记主密码怎么办？', '没有任何办法找回，这是为了保证别人也破解不了。请把主密码记牢，可以设置一个只有你能看懂的提示。'),
    qa('如何备份 / 换电脑？', S.store.kind === 'file'
      ? `把「验证码保险箱.html」和「${S.store.name}」一起复制到新电脑，用 Edge 或 Chrome 打开 html，选择「打开已有的保险箱文件」即可。也可以用「导出备份」另存一份。`
      : '用「导出备份」得到一个 .vault 文件，在新电脑上打开本程序，选择「从备份文件恢复」。'),
    qa('备用码用完了怎么办？', '到对应网站的「安全设置 / 两步验证」里重新生成一组新的备用码（旧码会失效），然后打开这个账号，在「备用码」里点「换新码」。'),
    h('p', { class: 'about', style: { marginTop: '14px' } }, `${APP_NAME} v${APP_VERSION} · ` + (IS_WEB ? '离线网页应用 · 可添加到主屏幕' : '单文件离线应用 · 建议使用 Microsoft Edge 或 Google Chrome')),
    updatePill());
}

function changePassword() {
  if (S.readOnly) { toast('只读打开时不能修改主密码：请先「另存为」新文件，或允许写入原文件', { type: 'error', duration: 5000 }); return; }
  const cur = pwField({ autocomplete: 'current-password', placeholder: '当前主密码' });
  const p1 = pwField({ autocomplete: 'new-password', placeholder: '新主密码（至少 8 位）' });
  const p2 = pwField({ autocomplete: 'new-password', placeholder: '再输入一次新主密码' });
  const err = h('p', { class: 'err', role: 'alert' });
  const note = h('p', { class: 'hint', role: 'status' });
  const submit = h('button', { type: 'submit', class: 'btn primary' }, '确认修改');
  const cancelBtn = h('button', { type: 'button', class: 'btn', onclick: () => close() }, '取消');
  let closed = false;  // 对话框已关闭（用户取消或被锁定）：之后绝不能再写入
  const lockInputs = on => { for (const f of [cur, p1, p2]) f.input.readOnly = !!on; };
  const { close, setBusy } = openDialog({
    title: '修改主密码', size: 'sm', form: true,
    body: [
      h('div', { class: 'field' }, h('label', { class: 'label' }, '当前主密码'), cur.el),
      h('div', { class: 'field' }, h('label', { class: 'label' }, '新主密码'), p1.el, strengthMeter(p1.input)),
      h('div', { class: 'field' }, h('label', { class: 'label' }, '确认新主密码'), p2.el),
      h('p', { class: 'hint' }, '修改后，之前导出的备份文件仍然需要用旧密码解锁。'),
      note, err],
    footer: [cancelBtn, submit],
    onClose: () => { closed = true; },
    onSubmit: async c => {
      if (submit.disabled) return;
      err.textContent = '';
      // 以点击「确认修改」这一刻的输入为准：三个密码立即取成快照，之后的校验、验证、写入都只用快照；
      // 处理期间输入框设为只读，失败需要重试时再放开
      const curPw = cur.input.value, newPw = p1.input.value, newPw2 = p2.input.value;
      if (clen(newPw) < 8) { err.textContent = '新主密码至少需要 8 个字符'; return; }
      if (newPw !== newPw2) { err.textContent = '两次输入的新主密码不一致'; return; }
      if (S.readOnly) { err.textContent = '只读打开时不能修改主密码'; return; }
      const oldKey = S.key, store = S.store;
      const stillHere = () => !closed && S.key === oldKey && !S.locking;
      lockInputs(true);
      // —— 验证阶段：还可以取消，取消后什么都不会改 ——
      busy(submit, true, '正在验证…');
      try {
        const k = await deriveKey(curPw, b64d(S.header.kdf.salt), S.header.kdf.iterations);
        await decryptRaw(parseFile(await seal({ probe: 1 }, oldKey, S.header)), k);
      } catch {
        if (!stillHere()) return;
        lockInputs(false);
        busy(submit, false); err.textContent = '当前主密码不正确'; cur.input.select(); return;
      }
      if (!stillHere()) return;
      const kdf = newKdf();
      const header = { ...S.header, kdf };
      let key;
      try { key = await deriveKey(newPw, b64d(kdf.salt), kdf.iterations); }
      catch (e) { if (stillHere()) { lockInputs(false); busy(submit, false); err.textContent = '修改失败：' + e.message; } return; }
      if (!stillHere()) return;
      // —— 写入阶段：从这里开始不能取消或关闭，直到写完 ——
      setBusy(true); cancelBtn.disabled = true;
      busy(submit, true, '正在写入…');
      note.textContent = '正在用新密码重写保险箱文件，完成前不能取消或关闭。';
      let job = null;
      try {
        clearTimeout(S.saveTimer);
        while (S.saving) { try { await S.saving; } catch {} }
        if (S.key !== oldKey || S.locking) return;  // 期间已被锁定：什么都没写
        const vault = S.vault;
        job = (async () => { await store.write(await seal(vault, key, header)); })();
        S.saving = job;
        await job;
      } catch (e) {
        setBusy(false); cancelBtn.disabled = false; note.textContent = '';
        lockInputs(false);
        busy(submit, false);
        if (!S.key) return;
        if (e && e.code === 'CONFLICT') {
          err.textContent = '文件已在别处被修改，本次改密没有写入。请先处理版本冲突。';
          onConflict();
        } else {
          const why = (e && (e.message || e.name)) || '未知错误';
          err.textContent = `写入保险箱失败，主密码没有更改，仍然是原来的密码。（${why}）`;
          toast('主密码没有更改：写入保险箱失败', { type: 'error', duration: 6000 });
          if (S.dirty) markDirty();
        }
        return;
      } finally {
        if (job && S.saving === job) S.saving = null;
      }
      // 以下均为提交后的收尾；不再走“仍是旧密码”的错误分支。
      if (S.store === store && S.key === oldKey) {
        const recovered = S.pendingStashClear ? (S.pendingStashStore || store) : null;
        S.key = key; S.header = header; S.dirty = false; S.pendingStashClear = false; S.pendingStashStore = null;
        setSaveState('saved'); hideBanner();
        // 只清理已经合并并写入的暂存；未恢复的草稿不能因改密而被删除。
        if (recovered) clearStash(recovered).catch(e => console.warn('已完成改密，暂存清理失败', e));
      }
      if (S.key === key) await bioAfterRekey(newPw);
      setBusy(false);
      c();
      toast('主密码已修改，以后请用新密码解锁');
    },
  });
  cur.input.focus();
}

const GEN_SETS = { lower: 'abcdefghijkmnopqrstuvwxyz', upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ', digit: '23456789', symbol: '!@#$%^&*-_=+?' };

    if (sets.every(set => out.some(ch => set.includes(ch)))) break;  // 选了的每类字符至少出现一次
  }

}

/* ---------------- 从其他密码管理器导入（CSV） ---------------- */
// 支持 Edge / Chrome、Firefox、iCloud 钥匙串（「密码」App）、Bitwarden、1Password、LastPass 等导出的 CSV
function parseCsv(text) {
  const src = String(text).replace(/^﻿/, '');
  const firstLine = src.split(/\r?\n/, 1)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, firstLine.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cur = '', quoted = false, started = false;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (quoted) {
      if (ch === '"') { if (src[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
      else cur += ch;
      continue;
    }
    if (ch === '"' && !started) { quoted = true; started = true; }
    else if (ch === delim) { row.push(cur); cur = ''; started = false; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = ''; started = false;
    } else { cur += ch; started = true; }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const CSV_COLS = {
  name: ['name', 'title', '名称', '标题', '网站名称', '项目名称'],
  url: ['url', 'login_uri', 'website', 'web site', 'uri', 'urls', '网址', '网站'],
  user: ['username', 'login_username', 'user name', 'user', 'login', 'email', 'e-mail', '用户名', '账号', '帐号', '登录名'],
  pass: ['password', 'login_password', 'pass', '密码'],
  note: ['note', 'notes', 'extra', 'comments', 'comment', '备注'],
  totp: ['totp', 'login_totp', 'otpauth', 'otp', 'one-time password', 'otp auth', '2fa'],
  fav: ['favorite', 'fav', 'favourite', '收藏'],
  group: ['folder', 'grouping', 'group', '分组', '文件夹'],
};
// 返回记录数组；不像密码导出文件时返回 null
function csvRecords(rows) {
  if (rows.length < 1) return null;
  const head = rows[0].map(x => x.trim().toLowerCase());
  const col = {};
  for (const [k, names] of Object.entries(CSV_COLS)) col[k] = head.findIndex(x => names.includes(x));
  if (col.pass < 0 || (col.url < 0 && col.name < 0 && col.user < 0)) return null;
  const get = (r, k) => (col[k] >= 0 ? String(r[col[k]] == null ? '' : r[col[k]]) : '');
  const out = [];
  for (const r of rows.slice(1)) {
    const password = get(r, 'pass'), user = get(r, 'user').trim(), name = get(r, 'name').trim();
    const url = (get(r, 'url').trim().split(/[\s,]+/)[0] || '');
    if (!password && !user && !url && !name) continue;
    const looksHost = /^[\w.-]+\.[a-z]{2,}$/i.test(name);
    const service = (name && !looksHost ? name : serviceFromUrl(url || name) || name || hostOf(url) || '未命名').slice(0, LIMITS.service);
    const t = get(r, 'totp').trim();
    let totp = null;
    if (/^otpauth:\/\//i.test(t)) { const p = parseOtpauth(t); if (p && !p.error && p.secret) totp = { secret: p.secret, digits: p.digits, period: p.period, algorithm: p.algorithm }; }
    else if (t && /^[A-Z2-7\s=-]{16,}$/i.test(t)) totp = { secret: cleanB32(t), digits: 6, period: 30, algorithm: 'SHA-1' };
    if (totp) { try { b32decode(totp.secret); } catch { totp = null; } }
    out.push({
      service, account: user.slice(0, LIMITS.account), password: password.slice(0, LIMITS.password), url: url.slice(0, LIMITS.url),
      note: get(r, 'note').slice(0, LIMITS.note), totp, favorite: /^(1|true|yes|y|是)$/i.test(get(r, 'fav').trim()),
      group: get(r, 'group').trim().slice(0, LIMITS.group),
    });
  }
  return out;
}
// 同一个网站（名称或网址）+ 同一个账号算同一个；已有的只补上没存的密码，绝不覆盖已有的密码
function planCsvImport(recs) {
  const plan = { add: [], fill: [], same: [], conflict: [], dup: 0 };
  const seen = new Set();
  for (const r of recs) {
    const host = hostOf(r.url);
    const key = accountKey(r.service) + '\n' + accountKey(r.account) + '\n' + host;
    if (seen.has(key)) { plan.dup++; continue; }
    seen.add(key);
    const match = S.vault.entries.find(e => accountKey(e.account) === accountKey(r.account)
      && (accountKey(e.service) === accountKey(r.service) || (!!host && hostOf(e.url) === host)));
    if (!match) plan.add.push(r);
    else if (!match.password) (r.password ? plan.fill : plan.same).push([match, r]);
    else if (match.password === r.password || !r.password) plan.same.push([match, r]);
    else plan.conflict.push([match, r]);
  }
  return plan;
}
function pickCsvText() {
  return new Promise(resolve => {
    const input = h('input', { type: 'file', accept: IS_IOS ? null : '.csv,text/csv,text/plain', style: { display: 'none' } });
    input.addEventListener('change', async () => {
      const f = input.files[0];
      input.remove();
      if (!f) { resolve(null); return; }
      if (f.size > 20 * 1024 * 1024) { toast('文件太大了，不像是密码导出文件', { type: 'error' }); resolve(null); return; }
      try { resolve(decodeText(await f.arrayBuffer())); } catch (e) { toast('读不了这个文件：' + e.message, { type: 'error' }); resolve(null); }
    });
    input.addEventListener('cancel', () => { input.remove(); resolve(null); });
    topHost().append(input);
    input.click();
  });
}
async function importCsv(textIn) {
  if (!S.key || S.locking) return false;
  const session = S.key;
  const text = textIn == null ? await pickCsvText() : textIn;
  if (text == null || S.key !== session) return false;
  let recs;
  try { recs = csvRecords(parseCsv(text)); } catch (e) { toast('读不了这个文件：' + e.message, { type: 'error' }); return false; }
  if (recs === null) { toast('这个文件不像是密码导出文件（需要有「密码」这一列）', { type: 'error', duration: 6000 }); return false; }
  if (!recs.length) { toast('文件里没有找到账号', { type: 'error' }); return false; }
  const plan = planCsvImport(recs);
  const lines = [`· 新增 ${plan.add.length} 个账号`];
  if (plan.fill.length) lines.push(`· 给 ${plan.fill.length} 个已有的账号补上密码`);
  if (plan.same.length) lines.push(`· ${plan.same.length} 个已经存过，跳过`);
  if (plan.conflict.length) lines.push(`· ${plan.conflict.length} 个已有、但密码不一样，不会覆盖：${plan.conflict.slice(0, 3).map(([e]) => e.service).join('、')}${plan.conflict.length > 3 ? ' 等' : ''}`);
  if (plan.dup) lines.push(`· 文件里有 ${plan.dup} 行重复，跳过`);
  if (!plan.add.length && !plan.fill.length) { await confirmDialog({ title: '没有需要导入的内容', message: lines.join('\n'), ok: '好', cancel: '关闭' }); return false; }
  const ok = await confirmDialog({ title: `导入 ${recs.length} 个账号？`, message: lines.join('\n') + '\n\n导入后记得删掉那个 CSV 文件——里面的密码没有加密。', ok: '导入' });
  if (!ok || S.key !== session || S.locking) return false;
  const now = Date.now();
  for (const r of plan.add) {
    const e = normalizeEntry({ id: uid(), service: r.service, account: r.account, password: r.password, url: r.url, note: r.note, totp: r.totp, favorite: r.favorite, group: r.group, createdAt: now, updatedAt: now });
    stampChanges(null, e, now);
    S.vault.entries.push(e);
  }
  for (const [e, r] of plan.fill) {
    const live = findEntry(e.id);
    if (!live || live.password) continue;
    const before = structuredClone(live);
    live.password = r.password;
    if (!live.url && r.url) live.url = r.url;
    if (!live.totp && r.totp) live.totp = normalizeTotp(r.totp);
    if (!live.note && r.note) live.note = r.note;
    stampChanges(before, live, now);
  }
  markDirty();
  renderAll();
  toast(`已导入：新增 ${plan.add.length} 个` + (plan.fill.length ? `，补上 ${plan.fill.length} 个密码` : ''), { duration: 6000, sub: '记得删掉那个 CSV 文件' });
  return true;
}
